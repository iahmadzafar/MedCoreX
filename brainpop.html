<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Brainpop Study Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky-free single column app. Top brand bar, one routed page area, floating bottom dock.
   Language: chunky ink outlines, hard offset shadows, saturated candy fills, round-but-not-pill corners. */
:root{
  --bg:#fff7e8; --surface:#ffffff; --surface2:#fff0cf; --ink:#1a1530; --muted:#6a6382; --line:#1a1530; --shadow:#1a1530;
  --brand:#ff3d8b; --brand2:#5b3dff;
  --pink:#ff5fa2; --blue:#4d7cff; --lemon:#ffd83d; --mint:#2fe0a8; --violet:#9b6bff; --orange:#ff8a3d;
  --fixed-ink:#1a1530; --good:#12a36b; --bad:#e0345b;
  --f-display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'DM Mono',ui-monospace,Menlo,monospace;
  --r:18px; --bw:2.5px; --off:5px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#150f2b; --surface:#221a43; --surface2:#2d2358; --ink:#fff6e6; --muted:#b2a9d6; --line:#fff6e6; --shadow:#05030f;
  --good:#3ee6a0; --bad:#ff6b8b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#150f2b; --surface:#221a43; --surface2:#2d2358; --ink:#fff6e6; --muted:#b2a9d6; --line:#fff6e6; --shadow:#05030f;
  --good:#3ee6a0; --bad:#ff6b8b; color-scheme:dark}
:root[data-pal="sunset"]{--brand:#ff6a3d;--brand2:#ff2e7e}
:root[data-pal="lagoon"]{--brand:#13c4a3;--brand2:#2f6bff}
:root[data-pal="grape"]{--brand:#9b5cff;--brand2:#ff4fd8}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 120px;min-height:100%;overflow-x:hidden}
h1,h2,h3{font-family:var(--f-display);line-height:1.05;margin:0;text-wrap:balance;letter-spacing:-.02em}
h1{font-size:clamp(2.2rem,6vw,3.8rem);font-weight:800}
h2{font-size:clamp(1.5rem,3.4vw,2.1rem);font-weight:800}
h3{font-size:1.15rem;font-weight:800}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--brand2);outline-offset:3px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--f-mono);font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* ambient blobs */
.blobs{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.blobs i{position:absolute;width:42vmax;height:42vmax;border-radius:50%;filter:blur(70px);opacity:.38;animation:drift 22s ease-in-out infinite alternate}
.blobs i:nth-child(1){background:var(--pink);left:-12vmax;top:-10vmax}
.blobs i:nth-child(2){background:var(--blue);right:-14vmax;top:20vh;animation-duration:28s}
.blobs i:nth-child(3){background:var(--lemon);left:20vw;bottom:-18vmax;animation-duration:25s;opacity:.3}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}

.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:1.35rem;text-decoration:none;margin-right:auto}
.logo{width:40px;height:40px;border-radius:12px;background:var(--brand);border:var(--bw) solid var(--line);box-shadow:3px 3px 0 var(--shadow);display:grid;place-items:center;transform:rotate(-6deg);transition:transform .3s}
.brand:hover .logo{transform:rotate(8deg) scale(1.08)}
.logo svg{width:22px;height:22px}
.pal{display:flex;gap:6px}
.pal button{width:22px;height:22px;border-radius:50%;border:var(--bw) solid var(--line);cursor:pointer;padding:0}
.pal button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--bg),0 0 0 5.5px var(--line)}

/* shared components */
.card{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r);box-shadow:var(--off) var(--off) 0 var(--shadow);padding:20px;min-width:0}
.card.hover{transition:transform .15s,box-shadow .15s}
.card.hover:hover{transform:translate(-2px,-2px);box-shadow:calc(var(--off) + 2px) calc(var(--off) + 2px) 0 var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--brand);color:#fff;border:var(--bw) solid var(--line);border-radius:14px;padding:10px 18px;font-weight:700;cursor:pointer;box-shadow:3px 3px 0 var(--shadow);transition:transform .1s,box-shadow .1s;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--shadow)}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--shadow)}
.btn.alt{background:var(--surface);color:var(--ink);text-shadow:none}
.btn.ok{background:var(--mint);color:var(--fixed-ink);text-shadow:none}
.btn.bad{background:var(--pink);color:var(--fixed-ink);text-shadow:none}
.btn.sm{padding:6px 12px;font-size:.9rem;border-radius:11px}
.chip{display:inline-flex;align-items:center;gap:6px;border:var(--bw) solid var(--line);border-radius:999px;padding:3px 12px;font-size:.82rem;font-weight:700;background:var(--surface);color:var(--ink);cursor:default;white-space:nowrap}
button.chip{cursor:pointer}
button.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--line);flex:none}
.tag{display:inline-block;border:2px solid var(--line);border-radius:8px;padding:1px 8px;font-size:.75rem;font-weight:700;color:var(--fixed-ink)}
.c-blue{background:var(--blue)}.c-pink{background:var(--pink)}.c-lemon{background:var(--lemon)}.c-mint{background:var(--mint)}.c-violet{background:var(--violet)}.c-orange{background:var(--orange)}
input[type=text],input[type=date],input[type=url],select,textarea{background:var(--surface);border:var(--bw) solid var(--line);border-radius:12px;padding:10px 12px;width:100%;min-width:0}
textarea{resize:vertical;min-height:72px}
label{font-size:.85rem;font-weight:700;display:flex;flex-direction:column;gap:4px;min-width:0}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.split{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.page{display:flex;flex-direction:column;gap:24px;animation:pop .35s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}}
.head{display:flex;flex-direction:column;gap:8px}
.hl{background:linear-gradient(transparent 58%,var(--lemon) 58% 92%,transparent 92%);padding:0 .1em;color:var(--ink)}

/* dock */
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;gap:4px;padding:6px;background:var(--surface);border:var(--bw) solid var(--line);border-radius:22px;box-shadow:var(--off) var(--off) 0 var(--shadow);max-width:calc(100vw - 24px)}
.dock a{display:flex;flex-direction:column;align-items:center;gap:1px;text-decoration:none;padding:7px 12px;border-radius:16px;font-size:.72rem;font-weight:700;color:var(--muted);transition:background .15s,transform .15s}
.dock a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.dock a:hover{transform:translateY(-3px);color:var(--ink)}
.dock a[aria-current="page"]{background:var(--brand);color:#fff}
@media(max-width:420px){.dock a{padding:7px 8px}}

/* hero + home */
.hero{display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));align-items:stretch}
.hero .big{display:flex;flex-direction:column;gap:16px;background:var(--brand);color:#fff;position:relative;overflow:hidden}
.hero .big h1,.hero .big .eyebrow{color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.hero .big .eyebrow{opacity:.9}
.clock{font-family:var(--f-mono);font-size:clamp(2rem,6vw,3rem);font-weight:500;font-variant-numeric:tabular-nums}
.sticker{position:absolute;right:-18px;top:-18px;width:120px;height:120px;border-radius:50%;background:var(--lemon);border:var(--bw) solid var(--line);display:grid;place-items:center;transform:rotate(14deg);color:var(--fixed-ink);font-family:var(--f-display);font-weight:800;text-align:center;font-size:.9rem;line-height:1.05;animation:spin 18s linear infinite}
.sticker b{display:block;font-size:1.7rem}
@keyframes spin{to{transform:rotate(374deg)}}
.ringbox{position:relative;width:170px;height:170px;margin:0 auto}
.ringbox svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringbox .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring-bg{stroke:var(--surface2)}
.ring-fg{stroke:var(--brand);transition:stroke-dashoffset .6s cubic-bezier(.3,1.4,.5,1)}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-display);font-size:2rem;font-weight:800;line-height:1}
.tiles{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.tile{border:var(--bw) solid var(--line);border-radius:var(--r);padding:16px;color:var(--fixed-ink);text-decoration:none;box-shadow:4px 4px 0 var(--shadow);display:flex;flex-direction:column;gap:6px;transition:transform .15s}
.tile:hover{transform:rotate(-1.5deg) translateY(-3px)}
.tile b{font-family:var(--f-display);font-size:1.15rem;font-weight:800;line-height:1.1}
.tile small{font-family:var(--f-mono);font-size:.78rem}
.bar{height:14px;border:2px solid var(--line);border-radius:99px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;border-right:2px solid var(--line);transition:width .6s cubic-bezier(.3,1.3,.5,1)}
.ticker{overflow:hidden;border:var(--bw) solid var(--line);border-radius:14px;background:var(--lemon);color:var(--fixed-ink);box-shadow:4px 4px 0 var(--shadow)}
.ticker div{display:flex;gap:40px;width:max-content;padding:8px 0;font-family:var(--f-mono);font-size:.85rem;animation:slide 40s linear infinite;white-space:nowrap}
@keyframes slide{to{transform:translateX(-50%)}}

/* library */
.res{display:flex;flex-direction:column;gap:10px}
.res h3{overflow-wrap:anywhere}
.res .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.res.done{opacity:.72}
.res.done h3{text-decoration:line-through;text-decoration-thickness:3px}
.star{background:none;border:none;cursor:pointer;font-size:1.4rem;line-height:1;padding:2px;color:var(--muted);transition:transform .2s}
.star[aria-pressed="true"]{color:var(--orange);transform:scale(1.2) rotate(-12deg)}
.empty{text-align:center;padding:40px 20px;border:var(--bw) dashed var(--line);border-radius:var(--r)}

/* flashcards */
.deck{display:flex;flex-direction:column;align-items:center;gap:20px}
.flip{perspective:1200px;width:100%;max-width:560px;height:300px;cursor:pointer;background:none;border:none;padding:0;text-align:inherit}
.flip .in{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:var(--bw) solid var(--line);border-radius:24px;box-shadow:8px 8px 0 var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:28px;text-align:center;color:var(--fixed-ink);overflow:auto}
.face.back{transform:rotateY(180deg);background:var(--surface);color:var(--ink)}
.face .q{font-family:var(--f-display);font-weight:800;font-size:clamp(1.3rem,3.6vw,1.9rem);line-height:1.15;text-wrap:balance}
.face .a{font-size:1.25rem;font-weight:700;text-wrap:balance}
.boxes{display:flex;gap:6px}
.boxes i{width:26px;height:10px;border-radius:5px;border:2px solid var(--line);background:var(--surface2)}
.boxes i.f{background:var(--mint)}

/* focus */
.timer{display:flex;flex-direction:column;align-items:center;gap:16px}
.timer .ringbox{width:min(300px,76vw);height:min(300px,76vw)}
.timer .time{font-family:var(--f-mono);font-size:clamp(2.6rem,10vw,3.6rem);font-weight:500;font-variant-numeric:tabular-nums;line-height:1}
.task{display:flex;align-items:center;gap:10px;padding:10px 12px;border:var(--bw) solid var(--line);border-radius:12px;background:var(--surface)}
.task span{flex:1;min-width:0;overflow-wrap:anywhere}
.task.d span{text-decoration:line-through;color:var(--muted)}
.chk{width:26px;height:26px;border-radius:8px;border:var(--bw) solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;flex:none;padding:0;color:var(--fixed-ink);font-weight:800}
.chk[aria-pressed="true"]{background:var(--mint)}

/* progress */
.heat{display:grid;grid-template-columns:repeat(14,1fr);gap:6px}
.heat i{aspect-ratio:1;border-radius:7px;border:2px solid var(--line);background:var(--surface2)}
.heat i[data-l="1"]{background:#ffd9ea}.heat i[data-l="2"]{background:var(--pink)}.heat i[data-l="3"]{background:var(--violet)}.heat i[data-l="4"]{background:var(--brand2)}
.badge{display:flex;gap:12px;align-items:center;padding:12px;border:var(--bw) solid var(--line);border-radius:14px;background:var(--surface)}
.badge .ic{width:46px;height:46px;border-radius:12px;border:var(--bw) solid var(--line);display:grid;place-items:center;font-size:1.4rem;flex:none;color:var(--fixed-ink)}
.badge.off{filter:grayscale(1);opacity:.55}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translate(-50%,-200%);z-index:30;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:14px;font-weight:700;transition:transform .35s cubic-bezier(.3,1.5,.5,1);max-width:calc(100vw - 32px);text-align:center}
.toast.on{transform:translate(-50%,0)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
details.add summary{cursor:pointer;font-weight:800;font-family:var(--f-display);font-size:1.1rem;list-style:none}
details.add summary::-webkit-details-marker{display:none}
details.add summary::before{content:'+';display:inline-grid;place-items:center;width:28px;height:28px;margin-right:10px;border-radius:8px;border:var(--bw) solid var(--line);background:var(--lemon);color:var(--fixed-ink)}
details.add[open] summary::before{content:'–'}
details.add form{display:grid;gap:12px;margin-top:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
details.add form .full{grid-column:1/-1}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<div class="blobs" aria-hidden="true"><i></i><i></i><i></i></div>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="toast" id="toast" role="status"></div>

<div class="wrap">
  <header class="top">
    <a class="brand" href="#home"><span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.5 5.5L20 9.5l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-1z"/></svg></span>Brainpop</a>
    <span class="chip c-lemon" id="xpchip" style="color:var(--fixed-ink)"></span>

</div>

<nav class="dock" aria-label="Main">
  <a href="#home" data-r="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/></svg>Home</a>

  <a href="#cards" data-r="cards"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="14" height="14" rx="2"/><path d="M7 3h13a1 1 0 011 1v13"/></svg>Cards</a>

</nav>

<script>
/* ---------- data ---------- */
const SUBJ={
  med:{n:'Medicine',c:'blue',e:'🩺'},surg:{n:'Surgery',c:'pink',e:'🔪'},peds:{n:'Paediatrics',c:'lemon',e:'🧸'},
  obg:{n:'Obs & Gynae',c:'violet',e:'🤰'},psy:{n:'Psychiatry',c:'mint',e:'🧠'},pharm:{n:'Pharmacology',c:'orange',e:'💊'}};
const TYPES={pdf:'PDF',vid:'Video',qb:'Question bank',note:'Notes',link:'Link'};
const SEED_RES=[
 {id:'r1',t:'High-yield medicine notes',s:'med',ty:'note',u:''},
 {id:'r2',t:'Surgery MCQ bank, past papers',s:'surg',ty:'qb',u:''},

 {id:'r4',t:'Antenatal care lecture series',s:'obg',ty:'vid',u:''},

const SEED_CARDS=[
 ['med','First-line drug in anaphylaxis?','IM adrenaline (0.5 mg of 1:1000 in adults), repeat every 5 min if needed'],
 ['med','Wernicke encephalopathy triad?','Confusion, ophthalmoplegia, ataxia. Give IV thiamine before glucose'],
 ['med','Most common cause of community-acquired pneumonia?','Streptococcus pneumoniae'],
 ['med','Kussmaul breathing is seen in?','Metabolic acidosis, classically DKA'],
 ['surg','Charcot’s triad?','Fever, jaundice, RUQ pain. Suggests ascending cholangitis'],
 ['surg','Reynolds’ pentad adds what to Charcot’s triad?','Hypotension and altered mental status'],
 ['surg','Virchow’s triad?','Stasis, endothelial injury, hypercoagulability'],
 ['peds','Koplik spots point to which disease?','Measles'],
 ['peds','Most common cause of bronchiolitis?','Respiratory syncytial virus (RSV)'],
 ['obg','Drug of choice to prevent and treat eclamptic seizures?','Magnesium sulfate'],
 ['obg','Most common site of ectopic pregnancy?','Ampulla of the fallopian tube'],

].map((x,i)=>({id:'c'+i,s:x[0],q:x[1],a:x[2]}));
const TIPS=['Active recall beats re-reading','Sleep is part of the syllabus','Interleave subjects, do not binge one','25 minutes on, 5 off','Explain it out loud to a wall','Past papers are the real syllabus','Review yesterday before learning today','Small daily wins compound'];

/* ---------- state ---------- */
const KEY='brainpop-v1';
let S={xp:0,days:{},last:'',streak:0,goal:60,exam:'',res:SEED_RES,done:{},star:{},cards:SEED_CARDS,box:{},tasks:[{id:'t1',t:'Revise cardiology notes',d:false},{id:'t2',t:'Do 40 surgery MCQs',d:false}],pal:'pop',theme:''};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const dayKey=off=>{const d=new Date();d.setDate(d.getDate()-off);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const level=()=>Math.floor(S.xp/200)+1;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2200)}
function addXP(n,msg){S.xp+=n;save();head();toast((msg||'Nice')+' +'+n+' XP')}
function addMinutes(m){const k=today();S.days[k]=(S.days[k]||0)+m;
  if(S.last!==k){S.streak=S.last===dayKey(1)?S.streak+1:1;S.last=k}save()}
function streakNow(){return(S.last===today()||S.last===dayKey(1))?S.streak:0}
function mastery(s){const cs=S.cards.filter(c=>!s||c.s===s);if(!cs.length)return 0;return cs.reduce((a,c)=>a+(S.box[c.id]||0),0)/(cs.length*4)}
function head(){$('#xpchip').textContent='⚡ Lv '+level()+' · '+S.xp+' XP';$('#streakchip').textContent='🔥 '+streakNow()+'-day streak'}

/* ---------- confetti ---------- */
const fx=$('#fx'),cx=fx.getContext('2d');let parts=[],raf=0;
function size(){fx.width=innerWidth*devicePixelRatio;fx.height=innerHeight*devicePixelRatio}
addEventListener('resize',size);size();
function boom(x=innerWidth/2,y=innerHeight/2){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const cols=['#ff5fa2','#4d7cff','#ffd83d','#2fe0a8','#9b6bff','#ff8a3d'];
  for(let i=0;i<90;i++){const a=Math.random()*Math.PI*2,v=4+Math.random()*9;
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-6,w:6+Math.random()*7,h:4+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[i%6],l:90+Math.random()*40})}
  if(!raf)raf=requestAnimationFrame(tick)}
function tick(){cx.clearRect(0,0,fx.width,fx.height);const k=devicePixelRatio;
  parts=parts.filter(p=>p.l>0);
  for(const p of parts){p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.r+=p.vr;p.l--;
    cx.save();cx.translate(p.x*k,p.y*k);cx.rotate(p.r);cx.fillStyle=p.c;cx.globalAlpha=Math.min(1,p.l/30);cx.fillRect(-p.w*k/2,-p.h*k/2,p.w*k,p.h*k);cx.restore()}
  raf=parts.length?requestAnimationFrame(tick):0}

/* ---------- timer (lives outside routes) ---------- */
const PRE={'25/5':[25,5],'50/10':[50,10],'15/3':[15,3]};
let T={pre:'25/5',mode:'focus',left:25*60,run:false,h:0,sub:'med',total:25*60};
function tset(){const [f,b]=PRE[T.pre];T.total=(T.mode==='focus'?f:b)*60;T.left=T.total}
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function tpaint(){const t=$('#tm');if(!t)return;t.textContent=fmt(T.left);
  const c=$('#ringT');if(c){const L=2*Math.PI*54;c.style.strokeDashoffset=L*(T.left/T.total)}
  const m=$('#tmode');if(m)m.textContent=T.mode==='focus'?'Focus':'Break';
  const b=$('#tgo');if(b)b.textContent=T.run?'Pause':'Start'}
function ttick(){T.left--;if(T.left<=0){
    if(T.mode==='focus'){const m=PRE[T.pre][0];addMinutes(m);addXP(m*2,'Session complete');boom();T.mode='break'}else{T.mode='focus';toast('Break over. Ready when you are')}
    tset();T.run=false;clearInterval(T.h);if(route()==='progress'||route()==='home')render()}
  tpaint()}
function tgo(){T.run=!T.run;clearInterval(T.h);if(T.run)T.h=setInterval(ttick,1000);tpaint()}

const dot=s=>'<span class="dot c-'+SUBJ[s].c+'"></span>';
function ring(pct,mid,sub){const L=2*Math.PI*54;
  return '<div class="ringbox"><svg viewBox="0 0 120 120"><circle class="ring-bg" cx="60" cy="60" r="54" fill="none" stroke-width="12"/><circle class="ring-fg" cx="60" cy="60" r="54" fill="none" stroke-width="12" stroke-linecap="round" stroke-dasharray="'+L+'" stroke-dashoffset="'+(L*(1-Math.min(1,pct)))+'"/></svg><div class="mid">'+mid+'</div></div>'}

   +'<div class="ticker" aria-hidden="true"><div>'+tip+'</div></div>'

   +'<div class="card" style="display:flex;flex-direction:column;gap:12px"><h3>Up next</h3>'+(S.tasks.filter(t=>!t.d).slice(0,3).map(t=>'<div class="task"><span>'+esc(t.t)+'</span></div>').join('')||'<p class="muted">All clear.</p>')
   +'<a class="btn sm alt" href="#focus" style="align-self:flex-start">Open tasks</a></div></div></div>'}

let LF={q:'',s:'',ty:'',star:false};
function resCard(r){const d=S.done[r.id];
  return '<article class="card hover res'+(d?' done':'')+'"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><span class="tag c-'+SUBJ[r.s].c+'">'+SUBJ[r.s].n+'</span>'
   +'<button class="star" data-act="star" data-id="'+r.id+'" aria-pressed="'+!!S.star[r.id]+'" aria-label="Bookmark">★</button></div>'
   +'<h3>'+esc(r.t)+'</h3><div class="meta"><span class="chip">'+TYPES[r.ty]+'</span>'+(r.id.startsWith('r')&&r.id.length<4?'<span class="chip muted">sample</span>':'')+'</div>'
   +'<div class="row" style="margin-top:auto">'+(r.u?'<a class="btn sm alt" href="'+esc(r.u)+'" target="_blank" rel="noopener">Open ↗</a>':'')

function libList(){const q=LF.q.toLowerCase();

  return L.length?L.map(resCard).join(''):'<div class="empty" style="grid-column:1/-1"><h3>Nothing here yet</h3><p class="muted">Clear a filter or add a resource above.</p></div>'}

   +'<label for="rs">Subject<select id="rs">'+Object.entries(SUBJ).map(([k,v])=>'<option value="'+k+'">'+v.n+'</option>').join('')+'</select></label>'

let CF={s:'',i:0,flip:false};
function deckCards(){return S.cards.filter(c=>!CF.s||c.s===CF.s)}
function vCards(){
  const subs=['<button class="chip" data-act="cs" data-v="" aria-pressed="'+(!CF.s)+'">All decks</button>'].concat(Object.entries(SUBJ).map(([k,v])=>'<button class="chip" data-act="cs" data-v="'+k+'" aria-pressed="'+(CF.s===k)+'">'+v.n+'</button>')).join('');
  return '<div class="page"><div class="head"><span class="eyebrow">Flashcards</span><h1>Flip, answer, <span class="hl">level up</span></h1></div><div class="row">'+subs+'</div><div class="deck" id="deck">'+deckHTML()+'</div>'
   +'<details class="add card"><summary>Add a card</summary><form id="cardform"><label for="cs2">Subject<select id="cs2">'+Object.entries(SUBJ).map(([k,v])=>'<option value="'+k+'">'+v.n+'</option>').join('')+'</select></label>'
   +'<label class="full" for="cq">Question<textarea id="cq" required></textarea></label><label class="full" for="ca">Answer<textarea id="ca" required></textarea></label><button class="btn full" type="submit">Add card</button></form></details></div>'}
function deckHTML(){const cs=deckCards();if(!cs.length)return '<div class="empty"><h3>No cards in this deck</h3><p class="muted">Add one below.</p></div>';
  CF.i=((CF.i%cs.length)+cs.length)%cs.length;const c=cs[CF.i],b=S.box[c.id]||0,col=SUBJ[c.s].c;
  return '<span class="mono muted">Card '+(CF.i+1)+' / '+cs.length+'</span>'
   +'<button class="flip'+(CF.flip?' on':'')+'" data-act="flip" aria-label="Flip card"><div class="in"><div class="face c-'+col+'"><span class="tag" style="background:var(--surface)">'+SUBJ[c.s].n+'</span><div class="q">'+esc(c.q)+'</div><span class="mono" style="font-size:.8rem">tap to reveal</span></div>'
   +'<div class="face back"><div class="a">'+esc(c.a)+'</div></div></div></button>'
   +'<div class="boxes" title="Mastery box">'+[0,1,2,3].map(i=>'<i class="'+(b>i?'f':'')+'"></i>').join('')+'</div>'
   +'<div class="row" style="justify-content:center"><button class="btn alt" data-act="prev" aria-label="Previous">←</button><button class="btn bad" data-act="again">Again</button><button class="btn ok" data-act="know">Got it</button><button class="btn alt" data-act="next" aria-label="Next">→</button></div>'}

function vFocus(){
  const subs=Object.entries(SUBJ).map(([k,v])=>'<option value="'+k+'"'+(T.sub===k?' selected':'')+'>'+v.n+'</option>').join('');
  const L=2*Math.PI*54;
  return '<div class="page"><div class="head"><span class="eyebrow">Focus room</span><h1>One thing. <span class="hl">Right now.</span></h1></div><div class="split">'
   +'<div class="card timer"><div class="row">'+Object.keys(PRE).map(p=>'<button class="chip" data-act="pre" data-v="'+p+'" aria-pressed="'+(T.pre===p)+'">'+p+'</button>').join('')+'</div>'
   +'<div class="ringbox"><svg viewBox="0 0 120 120"><circle class="ring-bg" cx="60" cy="60" r="54" fill="none" stroke-width="10"/><circle id="ringT" class="ring-fg" style="transition:stroke-dashoffset 1s linear;stroke:'+(T.mode==='focus'?'var(--brand)':'var(--mint)')+'" cx="60" cy="60" r="54" fill="none" stroke-width="10" stroke-linecap="round" stroke-dasharray="'+L+'" stroke-dashoffset="'+(L*T.left/T.total)+'"/></svg><div class="mid"><div class="time" id="tm">'+fmt(T.left)+'</div><span class="eyebrow" id="tmode">'+(T.mode==='focus'?'Focus':'Break')+'</span></div></div>'
   +'<label for="tsub" style="width:100%;max-width:260px">Studying<select id="tsub">'+subs+'</select></label>'
   +'<div class="row"><button class="btn" id="tgo" data-act="tgo">'+(T.run?'Pause':'Start')+'</button><button class="btn alt" data-act="treset">Reset</button></div></div>'
   +'<div class="card" style="display:flex;flex-direction:column;gap:12px"><h3>Today’s tasks</h3><div id="tasks" style="display:flex;flex-direction:column;gap:8px">'+tasksHTML()+'</div>'
   +'<form id="taskform" class="row" style="flex-wrap:nowrap"><input id="tin" type="text" placeholder="Add a task" aria-label="New task" required><button class="btn" type="submit">Add</button></form></div></div></div>'}
function tasksHTML(){return S.tasks.length?S.tasks.map(t=>'<div class="task'+(t.d?' d':'')+'"><button class="chk" data-act="ttog" data-id="'+t.id+'" aria-pressed="'+t.d+'" aria-label="Toggle">'+(t.d?'✓':'')+'</button><span>'+esc(t.t)+'</span><button class="btn sm alt" data-act="tdel" data-id="'+t.id+'" aria-label="Delete">✕</button></div>').join(''):'<p class="muted">No tasks. Add the first one below.</p>'}

function vProgress(){
  const bars=Object.entries(SUBJ).map(([k,v])=>{const p=Math.round(mastery(k)*100);
    return '<div style="display:flex;flex-direction:column;gap:6px"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><b>'+v.e+' '+v.n+'</b><span class="mono">'+p+'%</span></div><div class="bar"><i class="c-'+v.c+'" style="width:'+p+'%"></i></div></div>'}).join('');
  let heat='',tot=0;for(let i=27;i>=0;i--){const m=S.days[dayKey(i)]||0;tot+=m;const l=m===0?0:m<20?1:m<45?2:m<90?3:4;heat+='<i data-l="'+l+'" title="'+dayKey(i)+': '+m+' min"></i>'}
  const mastered=S.cards.filter(c=>(S.box[c.id]||0)>=3).length,doneN=Object.values(S.done).filter(Boolean).length,tm=Object.values(S.days).reduce((a,b)=>a+b,0);
  const B=[['🚀','c-pink','First session','Finish one focus session',tm>0],['🔥','c-orange','3-day streak','Study three days running',streakNow()>=3],['🧠','c-mint','Card shark','Master 5 cards',mastered>=5],['📚','c-blue','Bookworm','Finish 3 resources',doneN>=3],['⚡','c-lemon','Level 3','Reach 400 XP',S.xp>=400],['⏱','c-violet','Ten hours','Log 600 minutes',tm>=600]]
   .map(b=>'<div class="badge'+(b[4]?'':' off')+'"><span class="ic '+b[1]+'">'+b[0]+'</span><div><b>'+b[2]+'</b><div class="muted" style="font-size:.85rem">'+b[3]+'</div></div></div>').join('');
  return '<div class="page"><div class="head"><span class="eyebrow">Progress</span><h1>Your <span class="hl">scoreboard</span></h1></div>'

   +'<div class="split"><div class="card" style="display:flex;flex-direction:column;gap:14px"><h3>Subject mastery</h3>'+bars+'</div>'
   +'<div class="card" style="display:flex;flex-direction:column;gap:14px"><h3>Last 28 days</h3><div class="heat">'+heat+'</div><span class="muted mono" style="font-size:.8rem">'+tot+' min in the last four weeks. Darker means more.</span></div></div>'
   +'<section class="head"><h2>Badges</h2></section><div class="grid">'+B+'</div></div>'}

const V={home:vHome,library:vLibrary,cards:vCards,focus:vFocus,progress:vProgress};
function render(){const r=route();$('#view').innerHTML=V[r]();
  document.querySelectorAll('.dock a').forEach(a=>{if(a.dataset.r===r)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  clock();tpaint();head()}
function clock(){const c=$('#clk');if(!c)return;const d=new Date(),h=d.getHours();
  c.textContent=d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});
  const g=$('#greet');if(g)g.textContent=(h<5?'Late night':h<12?'Good morning':h<17?'Good afternoon':h<21?'Good evening':'Night owl')+' · '+d.toLocaleDateString([], {weekday:'long',day:'numeric',month:'short'})}
setInterval(clock,1000);

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const p=e.target.closest('button[data-pal]');if(p){S.pal=p.dataset.pal;applyTheme();save();return}
  if(e.target.closest('#themeBtn')){const cur=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');S.theme=cur==='dark'?'light':'dark';applyTheme();save();return}
  const s=e.target.closest('[data-subj]');if(s){LF.s=s.dataset.subj}
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id,v=b.dataset.v;
  if(a==='goal'){S.goal=Math.max(10,S.goal+ +b.dataset.d);save();render()}
  else if(a==='star'){S.star[id]=!S.star[id];save();render()}
  else if(a==='done'){S.done[id]=!S.done[id];save();if(S.done[id]){addXP(15,'Resource finished');boom(e.clientX,e.clientY)}render()}
  else if(a==='delres'){S.res=S.res.filter(r=>r.id!==id);save();render()}
  else if(a==='fs'){LF.s=LF.s===v?'':v;render()}
  else if(a==='ft'){LF.ty=LF.ty===v?'':v;render()}
  else if(a==='fstar'){LF.star=!LF.star;render()}
  else if(a==='cs'){CF.s=v;CF.i=0;CF.flip=false;render()}
  else if(a==='flip'){CF.flip=!CF.flip;b.classList.toggle('on',CF.flip)}
  else if(a==='next'||a==='prev'){CF.i+=a==='next'?1:-1;CF.flip=false;$('#deck').innerHTML=deckHTML()}
  else if(a==='know'||a==='again'){const cs=deckCards();if(!cs.length)return;const c=cs[CF.i];
    S.box[c.id]=a==='know'?Math.min(4,(S.box[c.id]||0)+1):0;save();
    if(a==='know'){addXP(5,'Got it');if(S.box[c.id]===3)boom(e.clientX,e.clientY)}CF.i++;CF.flip=false;$('#deck').innerHTML=deckHTML()}
  else if(a==='pre'){T.pre=v;if(T.run)tgo();T.mode='focus';tset();render()}
  else if(a==='tgo')tgo();
  else if(a==='treset'){if(T.run)tgo();tset();tpaint()}
  else if(a==='ttog'){const t=S.tasks.find(t=>t.id===id);t.d=!t.d;save();if(t.d){addXP(10,'Task done');boom(e.clientX,e.clientY)}$('#tasks').innerHTML=tasksHTML()}
  else if(a==='tdel'){S.tasks=S.tasks.filter(t=>t.id!==id);save();$('#tasks').innerHTML=tasksHTML()}
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){LF.q=e.target.value;$('#reslist').innerHTML=libList()}
});
document.addEventListener('change',e=>{
  if(e.target.id==='examd'){S.exam=e.target.value;save();render()}
  if(e.target.id==='tsub')T.sub=e.target.value;
});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target.id;
  if(f==='resform'){S.res.unshift({id:'u'+Date.now(),t:$('#rt').value.trim(),s:$('#rs').value,ty:$('#rty').value,u:$('#ru').value.trim()});save();toast('Added to library');render()}
  if(f==='cardform'){S.cards.push({id:'u'+Date.now(),s:$('#cs2').value,q:$('#cq').value.trim(),a:$('#ca').value.trim()});save();toast('Card added');render()}
  if(f==='taskform'){const i=$('#tin');S.tasks.push({id:'u'+Date.now(),t:i.value.trim(),d:false});save();$('#tasks').innerHTML=tasksHTML();i.value=''}
});
function applyTheme(){const r=document.documentElement;S.theme?r.dataset.theme=S.theme:r.removeAttribute('data-theme');r.dataset.pal=S.pal;
  document.querySelectorAll('.pal button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.pal===S.pal))}
addEventListener('hashchange',()=>{render();scrollTo(0,0)});
applyTheme();render();
</script>

<script>
/* =========================================================
   LOOK ENGINE — the studyverse randomizer, introduced here.
   New look every visit (colors · fonts · radius · border ·
   shadow depth · pattern) unless 🔒 is on. T remixes.
   ========================================================= */
(function(){
"use strict";
var STYLE_ID='bpop-variation', ATTR='data-bpop', LOCK_KEY='brainpop-look-lock', EVT='bpop:change';
var rand=function(a,b){return Math.random()*(b-a)+a};
var pick=function(a){return a[Math.floor(Math.random()*a.length)]};
var hsl=function(h,s,l){return 'hsl('+Math.round(((h%360)+360)%360)+' '+Math.round(s)+'% '+Math.round(l)+'%)'};
var SCHEMES={Triadic:[0,120,240,60],Complementary:[0,180,30,210],Split:[0,150,210,45],Analogous:[0,32,64,-32],Tetradic:[0,90,180,270],Candy:[0,300,60,200]};
var DISPLAY=[
 {f:'Futura,"Century Gothic","Trebuchet MS",sans-serif',w:800},
 {f:'Rockwell,"Roboto Slab",Georgia,serif',w:800},
 {f:'"American Typewriter","Courier New",monospace',w:700},
 {f:'"Marker Felt","Comic Sans MS",cursive',w:700},
 {f:'"Chalkboard SE","Comic Sans MS",cursive',w:700},
 {f:'Didot,"Bodoni 72","Times New Roman",serif',w:700},
 {f:'Copperplate,"Copperplate Gothic Light",serif',w:700},
 {f:'Impact,"Arial Black",sans-serif',w:400},
 {f:'"Avenir Next Condensed","Arial Narrow",sans-serif',w:800},
 {f:'"Cooper Black","Bookman Old Style",Georgia,serif',w:900},
 {f:"'Bricolage Grotesque','Trebuchet MS',sans-serif",w:800}
];
var BODY=[
 '"Avenir Next","Segoe UI",sans-serif','"Gill Sans","Gill Sans MT",sans-serif',
 'Optima,Candara,sans-serif','Georgia,"Times New Roman",serif',
 'Menlo,Consolas,monospace','Baskerville,"Hoefler Text",Georgia,serif',
 '"Trebuchet MS",Verdana,sans-serif',"'Figtree',system-ui,sans-serif"
];
var ADJ=['Electric','Bubblegum','Cosmic','Retro','Sour','Velvet','Jazzy','Turbo','Lemon','Neon','Groovy','Fizzy','Disco','Cherry','Tropical','Glitter','Mango','Pixel'];
var NOUN=['Notebook','Riot','Library','Sundae','Lab','Arcade','Atlas','Mixtape','Garden','Comet','Parade','Studio','Lagoon','Cassette','Carnival','Orbit'];
var PATTERNS=['dots','grid','stripes','checks','waves','plain'];

function makeLook(){
  var h=rand(0,360), scheme=pick(Object.keys(SCHEMES)), offs=SCHEMES[scheme], s=rand(74,96);
  var d=pick(DISPLAY), bfont=pick(BODY);
  var pink=hsl(h+offs[0]+10,s,66), blue=hsl(h+offs[2],s*.9,62),
      lemon=hsl(h+offs[1],Math.min(95,s),61), mintP=hsl(155+(h%40)-20,s*.78,60),
      violetP=hsl(h+offs[3],s*.85,68), orange=hsl(h+offs[0]+30,s,63);
  var brand=hsl(h+offs[0],Math.min(95,s),59), brand2=hsl(h+offs[2],s,62);
  var bgL=hsl(h+offs[1]*.2,rand(70,92),rand(95,97)), surfL=hsl(h,100,99.5), surf2L=hsl(h,rand(85,95),rand(90,93)),
      inkL=hsl(h+200,rand(35,55),rand(10,15)), mutedL=hsl(h+200,28,44), shadL=hsl(h+215,rand(45,65),rand(4,8));
  var bgD=hsl(h+215,rand(40,50),rand(9,12)), surfD=hsl(h+215,rand(38,48),rand(15,18)), surf2D=hsl(h+215,rand(36,46),rand(21,25)),
      inkD=hsl(h+35,rand(45,65),rand(93,96)), mutedD=hsl(h+215,32,70), shadD=hsl(h+220,55,3);
  var goodL=hsl(155+(h%30)-15,68,40), badL=hsl(350+(h%16)-8,78,56),
      goodD=hsl(155+(h%30)-15,70,55), badD=hsl(350+(h%16)-8,80,66);
  var r=pick(['0px','8px','14px','18px','26px']), bw=pick(['2px','2.5px','3.5px']), off=pick(['3px','5px','7px']);

  var shared=':root[data-bpop]{'+'--r:'+r+';--bw:'+bw+';--off:'+off+';--f-display:'+d.f+';--f-body:'+bfont+';}';
  var light=':root[data-bpop]:not([data-theme="dark"]){'+
    '--bg:'+bgL+';--surface:'+surfL+';--surface2:'+surf2L+';--ink:'+inkL+';--muted:'+mutedL+';--line:'+inkL+';--shadow:'+shadL+';'+
    '--brand:'+brand+';--brand2:'+brand2+';--pink:'+pink+';--blue:'+blue+';--lemon:'+lemon+';--mint:'+mintP+';--violet:'+violetP+';--orange:'+orange+';'+
    '--fixed-ink:'+inkL+';--good:'+goodL+';--bad:'+badL+';}';
  var darkMedia='@media (prefers-color-scheme:dark){:root[data-bpop]:not([data-theme="light"]){'+
    '--bg:'+bgD+';--surface:'+surfD+';--surface2:'+surf2D+';--ink:'+inkD+';--muted:'+mutedD+';--line:'+inkD+';--shadow:'+shadD+';'+
    '--fixed-ink:'+inkD+';--good:'+goodD+';--bad:'+badD+';color-scheme:dark;}}';
  var darkAttr=':root[data-bpop][data-theme="dark"]{'+
    '--bg:'+bgD+';--surface:'+surfD+';--surface2:'+surf2D+';--ink:'+inkD+';--muted:'+mutedD+';--line:'+inkD+';--shadow:'+shadD+';'+
    '--fixed-ink:'+inkD+';--good:'+goodD+';--bad:'+badD+';color-scheme:dark;}';
  var display=':root[data-bpop] h1,:root[data-bpop] h2,:root[data-bpop] h3,:root[data-bpop] .brand,:root[data-bpop] .stat b,:root[data-bpop] .tile b{font-weight:'+d.w+'}';
  var pat='html[data-pattern="dots"] body{background-image:radial-gradient(color-mix(in srgb,var(--ink) 14%,transparent) 1.4px,transparent 1.6px);background-size:22px 22px}'+
    'html[data-pattern="grid"] body{background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:34px 34px}'+
    'html[data-pattern="stripes"] body{background-image:repeating-linear-gradient(-45deg,color-mix(in srgb,var(--lemon) 24%,transparent) 0 14px,transparent 14px 30px)}'+
    'html[data-pattern="checks"] body{background-image:conic-gradient(color-mix(in srgb,var(--pink) 12%,transparent) 25%,transparent 0 50%,color-mix(in srgb,var(--blue) 12%,transparent) 0 75%,transparent 0);background-size:56px 56px}'+
    'html[data-pattern="waves"] body{background-image:radial-gradient(circle at 50% 0,transparent 13px,color-mix(in srgb,var(--violet) 22%,transparent) 14px 16px,transparent 17px);background-size:36px 18px}';
  return {name:pick(ADJ)+' '+pick(NOUN), scheme:scheme, pattern:pick(PATTERNS), css:shared+light+darkMedia+darkAttr+display+pat};
}

var current=null, applied=false;
function readLock(){try{var r=localStorage.getItem(LOCK_KEY);return r?JSON.parse(r):null}catch(e){return null}}
function writeLock(v){try{localStorage.setItem(LOCK_KEY,JSON.stringify(v))}catch(e){}}
function clearLock(){try{localStorage.removeItem(LOCK_KEY)}catch(e){}}
function say(m){try{toast(m)}catch(e){}}
function dispatch(t){try{window.dispatchEvent(new CustomEvent(EVT,{detail:{type:t,look:current,locked:!!readLock()}}))}catch(e){}}
function apply(v){
  var el=document.getElementById(STYLE_ID);
  if(!el){el=document.createElement('style');el.id=STYLE_ID;document.head.appendChild(el)}
  el.textContent=v.css;
  document.documentElement.setAttribute('data-pattern',v.pattern);
  document.documentElement.setAttribute(ATTR,'');
  var n=document.getElementById('bpName'); if(n)n.textContent=v.name;
  current=v;
}
function ensure(){if(applied)return;applied=true;apply(readLock()||makeLook());syncLock()}
function remix(){var v=makeLook();apply(v);if(readLock())writeLock(v);say('New look: '+v.name+' · '+v.scheme);dispatch('remix')}
function syncLock(){var b=document.getElementById('bpLock');if(b)b.setAttribute('aria-pressed',!!readLock())}
function toggleLock(){if(readLock()){clearLock();say('A new look every visit')}else{writeLock(current);say('Look locked for your next visit')}syncLock();dispatch('lock')}
window.BpopGen={ensure:ensure,remix:remix,toggleLock:toggleLock,get current(){return current},get locked(){return !!readLock()}};
document.addEventListener('click',function(e){
  var t=e.target; if(!t||!t.closest)return;
  if(t.closest('#bpRemix'))remix();
  else if(t.closest('#bpLock'))toggleLock();
});
document.addEventListener('keydown',function(e){
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  var el=e.target;
  if(el&&(el.tagName==='INPUT'||el.tagName==='TEXTAREA'||el.isContentEditable))return;
  if(e.key==='t'||e.key==='T')remix();
});
ensure();
})();
</script>

</body></html>
