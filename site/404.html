<!doctype html>
<html lang="en" data-mode="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — MedLib X</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230B0D12'/%3E%3Cpath d='M7 7l10 10M17 7L7 17' stroke='%23FFC53D' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Geist+Mono:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
:root{
  --ground:#0B0D12; --ground-2:#14171E; --void:#08090D;
  --chalk:#FFFFFF; --chalk-2:#FFFFFF; --muted:#FFFFFF; --faint:#FFFFFF;
  --amber:#FFC53D; --line:#1F2430; --line-2:#2A3140;
  --serif:'Bricolage Grotesque',system-ui,sans-serif;
  --body:'Plus Jakarta Sans',system-ui,sans-serif;
  --mono:'Geist Mono',ui-monospace,monospace;
}
html[data-mode="light"]{
  --ground:#ffffff;
  --ground-2:#f4f5f7;
  --void:#eceef1;
  --chalk:#000000;
  --chalk-2:#000000;
  --muted:#000000;
  --faint:#000000;
  --amber:#c98a00;
  --line:#e3e6ea;
  --line-2:#d5dae1;
  --serif:'Bricolage Grotesque',system-ui,sans-serif;
  --body:'Plus Jakarta Sans',system-ui,sans-serif;
  --mono:'Geist Mono',ui-monospace,monospace;
}

*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--chalk);font-family:var(--body);font-size:17px;line-height:1.62;-webkit-font-smoothing:antialiased;min-height:100dvh;display:flex;flex-direction:column}
a{color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
::selection{background:var(--amber);color:var(--void)}
.topbar{border-bottom:1px solid var(--line);background:var(--void)}
.topbar-in{max-width:1020px;margin:0 auto;padding:0 24px;height:60px;display:flex;align-items:center;gap:22px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--serif);font-size:22px;line-height:1;text-decoration:none}
.brand .glyph{width:18px;height:18px;color:var(--amber);flex:none}
.brand .x{color:var(--amber)}
main{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:48px 24px}
.kicker{font-family:var(--mono);font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--faint)}
h1{font-weight:400;font-family:var(--serif);font-size:clamp(64px,14vw,140px);line-height:1;margin:.18em 0 .1em}
h1 em{font-style:normal;color:var(--amber)}
p.lede{color:var(--muted);max-width:460px;margin:0 auto}
.ctas{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:26px}
.btn{display:inline-flex;align-items:center;font-family:var(--mono);font-size:13px;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;border:1px solid var(--line-2);color:var(--chalk);padding:11px 18px;border-radius:10px;transition:border-color .15s}
.btn:hover{border-color:var(--amber)}
.btn-amber{background:var(--amber);border-color:var(--amber);color:var(--void)}
.btn-amber:hover{background:#ffc44d}
.footer{border-top:1px solid var(--line);background:var(--void)}
.foot-in{max-width:1020px;margin:0 auto;padding:22px 24px 28px}
.foot-legal{color:var(--faint);font-family:var(--mono);font-size:11.5px;letter-spacing:.05em}
</style>

<style id="mx-surface">
/* ── soft material · "more present" (house rules 1.4) ──
   every quiet surface floats: contact + ambient on cards, panels, facts, buttons */
.gcard,.card,.fact,.panel,.btn{
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),
             0 1px 2px rgba(0,0,0,.55),
             0 14px 30px -18px rgba(0,0,0,.65) !important;
}
.btn:hover,.gcard:hover,.card:hover,.fact:hover{
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),
             0 1px 2px rgba(0,0,0,.55),
             0 18px 44px -16px rgba(0,0,0,.8) !important;
}
/* the footer sits on a raised seam, not a dead line */
.footer{ position:relative }
.footer::before{ content:""; position:absolute; left:0; right:0; top:-1px; height:1px;
  background:linear-gradient(90deg,transparent,var(--line-3),transparent) }
/* ground breathes: a faint ambient pool under the main column */
main{ position:relative }
main::before{ content:""; position:absolute; inset:-40px -60px auto; height:200px; pointer-events:none;
  background:radial-gradient(600px 200px at 50% 0%, rgba(46,80,87,.14), transparent 70%); z-index:0 }
main>*{ position:relative; z-index:1 }
</style>
<style>
/* shared mobile tightening (house pass) */
@media (max-width:640px){
  .topbar-in{padding-left:16px;padding-right:16px;height:56px}
  main,.pagehead,.foot-in{padding-left:16px;padding-right:16px}
  .foot-in{flex-wrap:wrap;gap:16px 24px;padding-top:20px}
  .card{padding:22px 18px}
  .faq{margin-top:28px}
  .faq summary{padding:13px 15px}
  .faq details .a{padding:12px 15px}
}
</style>

<style id="mlx-2026">
/* ── 2026 skin: chassis brought to the home page's design system ── */
:root{--grad:linear-gradient(100deg,var(--mint),var(--cyan))}
.orb{position:fixed;border-radius:50%;filter:blur(64px);opacity:.5;pointer-events:none;z-index:0;transition:opacity .45s}
html[data-mode="light"] .orb{opacity:.32}
.orb-a{width:340px;height:340px;background:radial-gradient(circle,var(--violet),transparent 70%);top:-110px;right:-90px;animation:drift 12s ease-in-out infinite alternate}
.orb-b{width:300px;height:300px;background:radial-gradient(circle,var(--mint),transparent 70%);top:44vh;left:-120px;animation:drift 15s ease-in-out infinite alternate-reverse}
.orb-c{width:260px;height:260px;background:radial-gradient(circle,var(--coral),transparent 70%);bottom:-90px;right:8vw;animation:drift 17s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(32px,22px) scale(1.14)}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes wob{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(9deg) scale(1.14)}}
main{position:relative}
main>*{position:relative;z-index:1;animation:rise .6s cubic-bezier(.16,1,.3,1) both}
main>*:nth-child(1){animation-delay:.05s}
main>*:nth-child(2){animation-delay:.14s}
main>*:nth-child(3){animation-delay:.23s}
main>*:nth-child(4){animation-delay:.32s}
main>*:nth-child(5){animation-delay:.4s}
h1,h2,h3{letter-spacing:-.015em}
.pagehead h1{font-weight:800;letter-spacing:-.025em}
.brand{font-weight:800;letter-spacing:-.02em}
.brand .glyph,.foot-brand .glyph{width:17px;height:17px;stroke:none;border-radius:5px;background:var(--grad);display:inline-block;animation:wob 4.5s ease-in-out infinite}
.brand .x,.foot-brand .x{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.topnav a.here{color:var(--chalk);text-decoration:underline;text-decoration-color:var(--cyan);text-underline-offset:6px;text-decoration-thickness:2px}
.btn{border-radius:14px;transition:transform .18s cubic-bezier(.34,1.56,.64,1),box-shadow .18s,border-color .18s}
.btn:hover{transform:translateY(-3px)}
.btn:active{transform:translateY(0) scale(.96)}
.btn-amber{background:var(--grad);border-color:transparent;color:#000;font-weight:700;box-shadow:0 12px 30px -12px rgba(77,160,255,.55)}
html[data-mode="light"] .btn-amber{color:#FFFFFF;box-shadow:0 12px 28px -14px rgba(29,111,209,.5)}
.card,.fact,.grp,.faq details,.shelfbar,.panel{border-radius:16px}
.faq details{transition:transform .18s,border-color .18s}
.faq details:hover{border-color:var(--line-3)}
input[type=search]{border-radius:12px}
.facts .fact{border:1px solid var(--line);box-shadow:0 14px 34px -16px rgba(0,0,0,.6);transition:transform .2s}
.facts .fact:hover{transform:translateY(-4px)}
.fv i{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-style:normal}
.footer{position:relative;z-index:1}
.footer::before{background:linear-gradient(90deg,transparent,var(--violet),var(--mint),transparent)}
@media print{main>*,.orb,.brand .glyph{animation:none!important}.orb{display:none!important}}
@media(prefers-reduced-motion:reduce){main>*,.orb,.brand .glyph,.btn,.card{animation:none!important;transition:none!important}}
</style>
<style>
main h1 em{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
</style></head>
<body>
<div class="orb orb-a"></div><div class="orb orb-b"></div><div class="orb orb-c"></div>

<header class="topbar"><div class="topbar-in">
  <a class="brand" href="/"><span class="glyph"></span>MedLib&nbsp;<span class="x">X</span></a>
</div></header>
<main>
  <div>
    <p class="kicker">MedLib X · off the shelf</p>
    <h1>4<em>0</em>4</h1>
    <p class="lede">This call number doesn't exist. Whatever was here is either mis-shelved or withdrawn to stay exact.</p>
    <div class="ctas">
      <a class="btn btn-amber" href="/">Front page</a>
      <a class="btn" href="/library">Open the library</a>
    </div>
  </div>
</main>
<footer class="footer"><div class="foot-in">
  <div class="foot-legal">© 2026 MedLib X. All rights reserved. Files are licensed for the account holder's personal use.</div>
</div></footer>

<style id="mlx-live">
h1{font-weight:800}h2{font-weight:700}h3,h4{font-weight:700}
@keyframes mlxFade{from{opacity:0}to{opacity:1}}
body{animation:mlxFade .4s ease both}
.mlx-toggle{position:fixed;right:16px;bottom:16px;z-index:99;font:600 12px/1 'Geist Mono',ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;padding:11px 15px;border-radius:999px;cursor:pointer;background:var(--panel,#14171E);color:var(--chalk,#FFFFFF);border:1px solid var(--line,#2A3140);box-shadow:0 10px 30px -12px rgba(0,0,0,.55);transition:transform .15s,border-color .2s}
.mlx-toggle:hover{border-color:var(--cyan,#4DA3FF)}
.mlx-toggle:active{transform:scale(.94)}
@media print{.mlx-toggle{display:none!important}body{animation:none!important}}
@media(prefers-reduced-motion:reduce){body,.mlx-toggle{animation:none!important;transition:none!important}}
</style>
<script>
(function(){
 try{
  var s=localStorage.getItem('mlx-theme');
  var m=s||(window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');
  document.documentElement.setAttribute('data-mode',m);
 }catch(e){}
 var b=document.createElement('button');
 b.className='mlx-toggle';b.type='button';
 function lbl(){b.textContent=document.documentElement.getAttribute('data-mode')==='light'?'dark':'light';}
 b.addEventListener('click',function(){
  var n=document.documentElement.getAttribute('data-mode')==='light'?'dark':'light';
  document.documentElement.setAttribute('data-mode',n);
  try{localStorage.setItem('mlx-theme',n);}catch(e){}
  lbl();
 });
 document.body.appendChild(b);lbl();
})();
</script>

</body>
</html>
