<!doctype html>
<html lang="en" data-mode="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — MedLib X</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230C171A'/%3E%3Cpath d='M7 7l10 10M17 7L7 17' stroke='%23F5A524' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#0C171A; --ground-2:#101F23; --void:#080F11;
  --chalk:#E9F1F2; --chalk-2:#C2D4D6; --muted:#7E979B; --faint:#5A7276;
  --amber:#F5A524; --line:#1E3338; --line-2:#264248;
  --serif:'Instrument Serif',Georgia,serif;
  --body:'Newsreader',Georgia,serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--chalk);font-family:var(--body);font-size:17px;line-height:1.62;-webkit-font-smoothing:antialiased;min-height:100dvh;display:flex;flex-direction:column}
a{color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
::selection{background:var(--amber);color:var(--void)}
.topbar{border-bottom:1px solid var(--line);background:var(--void)}
.topbar-in{max-width:1020px;margin:0 auto;padding:0 24px;height:60px;display:flex;align-items:center;gap:22px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--serif);font-size:22px;line-height:1;text-decoration:none}
.brand .glyph{width:18px;height:18px;color:var(--amber);flex:none}
.brand .x{color:var(--amber)}
main{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:48px 24px}
.kicker{font-family:var(--mono);font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--faint)}
h1{font-weight:400;font-family:var(--serif);font-size:clamp(64px,14vw,140px);line-height:1;margin:.18em 0 .1em}
h1 em{font-style:normal;color:var(--amber)}
p.lede{color:var(--muted);max-width:460px;margin:0 auto}
.ctas{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:26px}
.btn{display:inline-flex;align-items:center;font-family:var(--mono);font-size:13px;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;border:1px solid var(--line-2);color:var(--chalk);padding:11px 18px;border-radius:2px;transition:border-color .15s}
.btn:hover{border-color:var(--amber)}
.btn-amber{background:var(--amber);border-color:var(--amber);color:var(--void)}
.btn-amber:hover{background:#ffc44d}
.footer{border-top:1px solid var(--line);background:var(--void)}
.foot-in{max-width:1020px;margin:0 auto;padding:22px 24px 28px}
.foot-legal{color:var(--faint);font-family:var(--mono);font-size:11.5px;letter-spacing:.05em}
</style>

<style id="mx-surface">
/* ── soft material · "more present" (house rules 1.4) ──
   every quiet surface floats: contact + ambient on cards, panels, facts, buttons */
.gcard,.card,.fact,.panel,.btn{
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),
             0 1px 2px rgba(0,0,0,.55),
             0 14px 30px -18px rgba(0,0,0,.65) !important;
}
.btn:hover,.gcard:hover,.card:hover,.fact:hover{
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),
             0 1px 2px rgba(0,0,0,.55),
             0 18px 44px -16px rgba(0,0,0,.8) !important;
}
/* the footer sits on a raised seam, not a dead line */
.footer{ position:relative }
.footer::before{ content:""; position:absolute; left:0; right:0; top:-1px; height:1px;
  background:linear-gradient(90deg,transparent,var(--line-3),transparent) }
/* ground breathes: a faint ambient pool under the main column */
main{ position:relative }
main::before{ content:""; position:absolute; inset:-40px -60px auto; height:200px; pointer-events:none;
  background:radial-gradient(600px 200px at 50% 0%, rgba(46,80,87,.14), transparent 70%); z-index:0 }
main>*{ position:relative; z-index:1 }
</style>
</head>
<body>
<header class="topbar"><div class="topbar-in">
  <a class="brand" href="/"><svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 7l14 0M5 12l14 0M5 17l9 0"/></svg>MedLib&nbsp;<span class="x">X</span></a>
</div></header>
<main>
  <div>
    <p class="kicker">MedLib X · off the shelf</p>
    <h1>4<em>0</em>4</h1>
    <p class="lede">This call number doesn't exist. Whatever was here is either mis-shelved or withdrawn to stay exact.</p>
    <div class="ctas">
      <a class="btn btn-amber" href="/">Front page</a>
      <a class="btn" href="/library">Open the library</a>
    </div>
  </div>
</main>
<footer class="footer"><div class="foot-in">
  <div class="foot-legal">© 2026 MedLib X. All rights reserved. Files are licensed for the account holder's personal use.</div>
</div></footer>
</body>
</html>
