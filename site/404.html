<style>
*,*::before,*::after{box-sizing:border-box;border-radius:0}
:root{--serif:'Space Grotesk','Plus Jakarta Sans',sans-serif;--body:'Plus Jakarta Sans',-apple-system,'Segoe UI',sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace}
html[data-banktheme="ink"][data-mode="dark"]{color-scheme:dark;--bg:#0B0C0E;--card:#141619;--txt:#EDEFF2;--txt2:#C6CCD4;--muted:#8A919B;--faint:#6E757F;--rim:#23262B;--rim2:#2B2F35;--a1:#B58AD6;--on:#0B0C0E}
html[data-banktheme="ink"][data-mode="light"]{color-scheme:light;--bg:#FAF9F6;--card:#FFFFFF;--txt:#14161A;--txt2:#3C4249;--muted:#6B7280;--faint:#6E757F;--rim:#E7E5DF;--rim2:#D8D5CC;--a1:#6E4A96;--on:#FFFFFF}

html[data-banktheme="ice"][data-mode="light"]{color-scheme:light;--bg:#F7FAFC;--card:#FFFFFF;--txt:#101820;--txt2:#374A57;--muted:#63798A;--faint:#66788A;--rim:#E2E8EC;--rim2:#CFD9E0;--a1:#2E6E9E;--on:#FFFFFF}
html[data-banktheme="copper"][data-mode="dark"]{color-scheme:dark;--bg:#12100F;--card:#1A1816;--txt:#EFE9E3;--txt2:#CCC3B9;--muted:#8E857A;--faint:#726A60;--rim:#282420;--rim2:#322D28;--a1:#C97A4A;--on:#12100F}

html[data-banktheme="paper"][data-mode="dark"]{color-scheme:dark;--bg:#151011;--card:#1D1618;--txt:#F2EAEB;--txt2:#D2C3C6;--muted:#96848A;--faint:#7A6A70;--rim:#2C2325;--rim2:#382C2F;--a1:#C4666F;--on:#151011}
html[data-banktheme="paper"][data-mode="light"]{color-scheme:light;--bg:#FAFAF7;--card:#FFFFFF;--txt:#14161A;--txt2:#3C4249;--muted:#6B7280;--faint:#6E757F;--rim:#E6E7E2;--rim2:#D8DAD4;--a1:#8C2F39;--on:#FFFFFF}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--txt);font-family:var(--body);line-height:1.6;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:12px;padding:16px 22px;border-bottom:1px solid var(--rim)}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--serif);font-size:20px;font-weight:600;text-decoration:none;color:var(--txt)}
.brand svg{color:var(--a1)}
.bar .sp{flex:1}
.fseg{display:flex;border:1px solid var(--rim2);overflow:hidden}
.fseg button{appearance:none;border:0;background:transparent;color:var(--txt2);cursor:pointer;font-family:var(--mono);font-size:11px;font-weight:600;padding:7px 11px}
.fseg button+button{border-left:1px solid var(--rim2)}
.fseg button.on{background:var(--a1);color:var(--on)}
.tt{appearance:none;border:1px solid var(--rim2);background:transparent;color:var(--txt);cursor:pointer;font-size:15px;line-height:1;padding:7px 10px}
.tt:hover{border-color:var(--a1);color:var(--a1)}
main{flex:1;display:grid;place-items:center;padding:40px 22px}
.card{max-width:620px;border:1px solid var(--rim);background:var(--card);padding:clamp(28px,5vw,52px);border-left:3px solid var(--a1)}
.k{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--a1)}
h1{font-family:var(--serif);font-size:clamp(40px,9vw,84px);font-weight:600;line-height:1;letter-spacing:-.02em;margin:14px 0 0}
p{color:var(--txt2);margin:16px 0 0;font-size:16px;max-width:460px}
.btn{display:inline-flex;align-items:center;gap:9px;margin-top:28px;background:var(--a1);color:var(--on);text-decoration:none;font-weight:700;font-size:14px;padding:13px 22px}
.btn:hover{filter:brightness(1.08)}
.code{font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:22px}
</style>

</div>
<main>

    <div class="k">Error 404</div>

    <p>That address doesn’t resolve to anything in the library — the file may have been renamed, merged, or never existed.</p>

</main>
<script>
(function(){
  var root=document.documentElement, FAM=["ink","ice","copper","paper"], K="medcore.theme";
  function setFam(f,save){ if(FAM.indexOf(f)<0)f="ink"; root.setAttribute("data-banktheme",f);
    if(save!==false){try{localStorage.setItem("medcore.banktheme",f)}catch(e){}}
    var b=document.getElementById("famSeg"); if(b)[].slice.call(b.children).forEach(function(x){x.classList.toggle("on",x.getAttribute("data-f")===f)}); }
  function setMode(m,save){ if(m!=="light")m="dark"; root.setAttribute("data-mode",m);
    var tb=document.getElementById("ttD"); if(tb)tb.textContent=m==="light"?"☀":"☾";
    if(save!==false){try{localStorage.setItem(K,m)}catch(e){}} }
  function boot(){ var f="ink",m="dark"; try{f=localStorage.getItem("medcore.banktheme")||"ink";m=localStorage.getItem(K)==="light"?"light":"dark"}catch(e){} setFam(f,false); setMode(m,false); }
  boot();
  document.getElementById("famSeg").addEventListener("click",function(e){var b=e.target.closest("button[data-f]");if(b)setFam(b.getAttribute("data-f"));});
  document.getElementById("ttD").addEventListener("click",function(){ setMode(root.getAttribute("data-mode")==="light"?"dark":"light"); });
  window.addEventListener("storage",function(e){ if(e.key==="medcore.banktheme"&&e.newValue)setFam(e.newValue,false); if(e.key===K&&e.newValue)setMode(e.newValue,false); });
})();
</script>
