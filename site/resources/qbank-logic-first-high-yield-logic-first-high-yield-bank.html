  html[data-banktheme="paper"][data-mode="light"]{ --nx-bg:#FAFAF7;--nx-card:#FFFFFF;--nx-card2:#F4F4EF;--nx-txt:#14161A;--nx-txt2:#3C4249;--nx-muted:#6B7280;--nx-faint:#8D949C;--nx-rim:#E6E7E2;--nx-rim2:#D8DAD4;--nx-a1:#8C2F39;--nx-a2:#2E6E9E;--nx-good:#2F7D53;--nx-no:#B23A48;--nx-violet:#6A4FB8; --nx-on:#FFFFFF; --nx-shadow:0 8px 24px rgba(0,0,0,.10); }

  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:
      radial-gradient(1200px 500px at 80% -10%, rgba(176,106,78,.07), transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:var(--body);
    font-size:0.9063rem; line-height:1.55;
    min-height:100vh;min-height:100dvh;height:100dvh;min-height:100dvh;height:100dvh;
    -webkit-font-smoothing:antialiased;
  }
  .shell{max-width:100%; margin:0 auto; padding:28px 22px 80px;}

  /* header */
  header{display:flex; align-items:flex-end; justify-content:space-between; gap:18px; flex-wrap:wrap; margin-bottom:6px;}
  .brand{display:flex; align-items:center; gap:14px;}
  .brand-badge{
    width:46px; height:46px; border-radius:13px; flex:none;
    display:grid; place-items:center; color:var(--bg);
    background:linear-gradient(135deg, var(--accent), #d59a6a);
  }
  h1{font-family:var(--serif); font-size:1.625rem; font-weight:700; letter-spacing:.2px;}
  .kicker{font-size:0.6875rem; letter-spacing:2.6px; text-transform:uppercase; color:var(--muted); margin-bottom:3px;}
  .head-actions{display:flex; gap:8px; align-items:center;}

  /* buttons */
  .btn{
    appearance:none; border:1px solid var(--line); background:var(--bg2); color:var(--ink);
    font:inherit; font-size:0.7813rem; font-weight:500; padding:8px 13px; border-radius:9px;
    cursor:pointer; display:inline-flex; align-items:center; gap:7px; transition:.15s;
  }
  .btn:hover{border-color:var(--faint); background:var(--bg3);}
  .btn svg{width:15px; height:15px; flex:none;}
  .btn.active{color:var(--bg); border-color:transparent;}
  .btn.t1.active{background:var(--t1);} .btn.t2.active{background:var(--t2);}
  .btn.t3.active{background:var(--t3);} .btn.t4.active{background:var(--t4);}
  .btn.icon-only{padding:8px 10px;}

  /* stats */
  .stats{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:20px 0 6px;}
  .stat{
    background:var(--bg2); border:1px solid var(--line); border-radius:var(--radius);
    padding:13px 16px; display:flex; align-items:center; gap:12px;
  }
  .stat .ico{width:34px; height:34px; border-radius:9px; display:grid; place-items:center; flex:none;}
  .stat .ico svg{width:17px; height:17px;}
  .stat .num{font-family:var(--serif); font-size:1.375rem; font-weight:700; line-height:1;}
  .stat .lab{font-size:0.7188rem; color:var(--muted); margin-top:3px;}
  .ico.banked{background:rgba(78,157,123,.14); color:var(--good);}
  .ico.faint{background:rgba(201,154,78,.14); color:var(--warn);}
  .ico.missed{background:rgba(201,107,91,.14); color:var(--bad);}
  .ico.untouched{background:rgba(154,164,174,.12); color:var(--muted);}

  .masterybar{height:5px; border-radius:3px; background:var(--bg4); overflow:hidden; margin:10px 0 4px; display:flex;}
  .masterybar i{height:100%; display:block;}

  /* controls */
  .controls{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:18px 0 4px;}
  .chips{display:flex; gap:7px; flex-wrap:wrap;}
  .search{position:relative; flex:1; min-width:190px; max-width:320px;}
  .search svg{position:absolute; left:11px; top:50%; translate:0 -50%; width:15px; height:15px; color:var(--faint); pointer-events:none;}
  .search input{
    width:100%; padding:9px 12px 9px 33px; background:var(--bg2); color:var(--ink);
    border:1px solid var(--line); border-radius:9px; font:inherit; font-size:0.8125rem; outline:none;
  }
  .search input:focus{border-color:var(--accent);}
  select{
    appearance:none; background:var(--bg2) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' stroke='%239aa4ae' stroke-width='1.5' fill='none' stroke-linecap='round'/></svg>") no-repeat right 11px center;
    color:var(--ink); border:1px solid var(--line); border-radius:9px; font:inherit; font-size:0.7813rem;
    padding:9px 30px 9px 12px; cursor:pointer; outline:none;
  }
  .toggle{display:inline-flex; align-items:center; gap:8px; font-size:0.7813rem; color:var(--muted); cursor:pointer; user-select:none; margin-left:auto;}
  .toggle input{accent-color:var(--accent); width:15px; height:15px; cursor:pointer;}

  /* browse */
  #browseView{margin-top:14px;}
  .tier-section{margin-bottom:26px;}
  .tier-head{display:flex; align-items:baseline; gap:14px; margin:6px 0 10px;}
  .tier-title{font-family:var(--serif); font-size:1.1875rem; font-weight:700;}
  .tier-dot{width:10px; height:10px; border-radius:3px; transform:translateY(-1px);}
  .tier-sub{font-size:0.75rem; color:var(--muted); font-style:italic;}
  .tier-count{font-size:0.7188rem; color:var(--faint); margin-left:auto; white-space:nowrap;}
  .cards{display:grid; gap:10px;}
  .card{
    background:var(--bg2); border:1px solid var(--line); border-left:3px solid var(--tc,var(--faint));
    border-radius:var(--radius); padding:15px 18px 13px; position:relative;
  }
  .card-top{display:flex; align-items:center; gap:10px; margin-bottom:7px; flex-wrap:wrap;}
  .fnum{font-family:var(--serif); font-size:0.8125rem; font-weight:700; color:var(--tc,var(--faint)); letter-spacing:.5px;}
  .pill{font-size:0.6563rem; font-weight:600; letter-spacing:.6px; text-transform:uppercase; padding:3px 9px; border-radius:20px;}
  .pill.t1{background:rgba(78,157,123,.13); color:var(--t1);}
  .pill.t2{background:rgba(91,140,196,.13); color:var(--t2);}
  .pill.t3{background:rgba(201,154,78,.13); color:var(--t3);}
  .pill.t4{background:rgba(138,143,150,.15); color:var(--t4);}
  .subj-tag{font-size:0.6875rem; color:var(--muted); border:1px solid var(--line); padding:2px 8px; border-radius:6px;}
  .mastery{display:flex; gap:5px; margin-left:auto;}
  .mbtn{
    width:29px; height:29px; border-radius:8px; border:1px solid var(--line); background:var(--bg3);
    color:var(--muted); cursor:pointer; display:grid; place-items:center; transition:.12s;
  }
  .mbtn svg{width:13px; height:13px;}
  .mbtn:hover{color:var(--ink); border-color:var(--faint);}
  .mbtn.on-good{background:var(--good); border-color:var(--good); color:#fff;}
  .mbtn.on-warn{background:var(--warn); border-color:var(--warn); color:#fff;}
  .mbtn.on-bad{background:var(--bad); border-color:var(--bad); color:#fff;}
  .fact{font-family:var(--serif); font-size:1.0313rem; font-weight:600; line-height:1.42; margin-bottom:8px;}
  .logic-toggle{
    appearance:none; border:none; background:none; color:var(--muted); font:inherit; font-size:0.75rem;
    cursor:pointer; display:inline-flex; align-items:center; gap:6px; padding:2px 0; margin-bottom:2px;
  }
  .logic-toggle:hover{color:var(--ink);}
  .logic-toggle svg{width:12px; height:12px; transition:transform .18s;}
  .logic-toggle.open svg{transform:rotate(180deg);}
  .logic{
    display:none; font-size:0.8125rem; color:var(--muted); border-left:2px solid var(--line);
    padding:2px 0 2px 12px; margin:4px 0 8px;
  }
  .logic.open{display:block;}
  .logic b{color:var(--ink); font-weight:600;}
  .meta{font-size:0.7188rem; color:var(--faint); margin-top:2px;}
  .selfcheck{font-size:0.7813rem; color:var(--muted); font-style:italic; margin-top:6px;}
  .selfcheck b{color:var(--tc,var(--faint)); font-style:normal; font-weight:600;}

  /* quiz */
  #quizView{margin-top:16px; display:none;}
  .quiz-shell{max-width:100%; margin:0 auto;}
  .quiz-top{display:flex; align-items:center; gap:14px; margin-bottom:14px;}
  .quiz-progress{font-size:0.7813rem; color:var(--muted);}
  .quiz-progress b{color:var(--ink); font-family:var(--serif); font-size:0.9375rem;}
  .quiz-bar{flex:1; height:6px; border-radius:3px; background:var(--bg4); overflow:hidden;}
  .quiz-bar i{display:block; height:100%; background:linear-gradient(90deg,var(--t1),var(--accent)); border-radius:3px; transition:width .25s;}
  .quiz-card{
    background:var(--bg2); border:1px solid var(--line); border-radius:18px;
    padding:34px 36px 28px; box-shadow:var(--shadow); min-height:300px; display:flex; flex-direction:column;
  }
  .q-tags{display:flex; gap:8px; align-items:center; margin-bottom:18px;}
  .q-fact{font-family:var(--serif); font-size:1.375rem; font-weight:600; line-height:1.4; flex:1;}
  .q-reveal-area{margin-top:22px;}
  .q-logic{
    display:none; background:var(--bg3); border-radius:12px; padding:16px 18px; margin-top:14px;
  }
  .q-logic.open{display:block;}
  .q-logic .q-l1{font-size:0.8438rem; color:var(--ink); margin-bottom:8px;}
  .q-logic .q-l1 b{color:var(--tc,var(--ink)); font-weight:600;}
  .q-logic .q-l2{font-size:0.7813rem; color:var(--muted); font-style:italic;}
  .q-actions{display:flex; gap:10px; margin-top:24px; justify-content:center; opacity:0; pointer-events:none; transition:.2s;}
  .q-actions.show{opacity:1; pointer-events:auto;}
  .grade{
    flex:1; max-width:180px; padding:11px 8px; border-radius:11px; border:1px solid var(--line);
    background:var(--bg3); color:var(--ink); font:inherit; font-size:0.8125rem; font-weight:500; cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center; gap:8px; transition:.12s;
  }
  .grade svg{width:15px; height:15px;}
  .grade:hover{transform:translateY(-1px);}
  .grade.good:hover{border-color:var(--good); color:var(--good);}
  .grade.warn:hover{border-color:var(--warn); color:var(--warn);}
  .grade.bad:hover{border-color:var(--bad); color:var(--bad);}
  .quiz-done{text-align:center; padding:30px 0;}
  .quiz-done h2{font-family:var(--serif); font-size:1.5rem; margin-bottom:6px;}
  .quiz-done p{color:var(--muted); margin-bottom:22px;}

  .empty{padding:50px 20px; text-align:center; color:var(--faint); border:1px dashed var(--line); border-radius:var(--radius);}
  .empty svg{width:30px; height:30px; opacity:.5; margin-bottom:10px;}

  footer{margin-top:36px; text-align:center; font-size:0.7188rem; color:var(--faint);}
  @media(max-width:640px){
    .stats{grid-template-columns:repeat(2,1fr);}
    .quiz-card{padding:24px 20px 20px;}
    .q-fact{font-size:1.1563rem;}
    .toggle{margin-left:0; width:100%; justify-content:flex-end;}
  }
</style>

</head>
<body>
<div class="shell">

  <header>
    <div class="brand">
      <div class="brand-badge" id="brandIcon"></div>
      <div>
        <div class="kicker">The free-marks layer</div>
        <h1>Logic-First High-Yield Bank</h1>
      </div>
    </div>
    <div class="head-actions">
      <span class="nx-fam" id="nxFam"><button type="button" data-f="ink">Ink</button><button type="button" data-f="ice">Ice</button><button type="button" data-f="copper">Copper</button><button type="button" data-f="paper">Paper</button></span>
      <button class="btn icon-only" id="themeBtn" title="Toggle theme" aria-label="Toggle theme"></button>
      <button class="btn" id="resetBtn" title="Reset all mastery"></button>
    </div>
  </header>

  <div class="stats" id="stats"></div>
  <div class="masterybar" id="masteryBar" title="Mastery coverage"></div>

  <div class="controls">
    <div class="chips" id="tierChips"></div>
    <select id="subjectSel" aria-label="Filter by subject"></select>
    <div class="search" id="searchWrap">
      <input id="searchInput" type="text" placeholder="Search facts…" aria-label="Search facts">
    </div>
  </div>

  <div class="controls" style="margin-top:10px;">
    <div class="chips" id="viewToggle">
      <button class="btn active" data-view="browse" id="viewBrowse"></button>
      <button class="btn" data-view="quiz" id="viewQuiz"></button>
    </div>
    <label class="toggle" id="skipMasteredWrap"><input type="checkbox" id="skipMastered"> Only not-yet-banked</label>
  </div>

  <main id="browseView"></main>
  <main id="quizView"></main>

  <footer>Bank the easy points first — the hard questions shouldn't have to carry the paper.</footer>
</div>

<script>
(function(){
  "use strict";

  /* ---------- icons (SF-Symbol style, stroke-based, currentColor) ---------- */
  var S = function(inner, vb){ return '<svg viewBox="'+(vb||"0 0 24 24")+'" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+inner+'</svg>'; };
  var icons = {
    layers: S('<path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/><path d="M3 17.5l9 5 9-5" opacity=".55"/>'),
    check: S('<path d="M5 12.5l4.5 4.5L19 7.5"/>'),
    wave:  S('<path d="M2.5 9.5c3-4 6-4 9 0s6 4 9 0"/><path d="M2.5 14.5c3-4 6-4 9 0s6 4 9 0"/>'),
    xmark: S('<path d="M6 6l12 12M18 6L6 18"/>'),
    minus: S('<path d="M5 12h14"/>'),
    clear: S('<path d="M9 9l6 6M15 9l-6 6"/><circle cx="12" cy="12" r="9" opacity=".45"/>'),

      '<div class="quiz-shell">'+
        '<div class="quiz-top">'+
          '<span class="quiz-progress"><b>'+(quiz.idx+1)+'</b> / '+quiz.list.length+'</span>'+
          '<div class="quiz-bar"><i style="width:'+((quiz.idx)/quiz.list.length*100)+'%"></i></div>'+
          '<span class="pill '+tier.css+'">Tier '+e.t+' · '+tier.name+'</span>'+
        '</div>'+
        '<div class="quiz-card" style="--tc:'+tier.color+'">'+
          '<div class="q-tags"><span class="fnum">F'+String(e.id).padStart(2,"0")+'</span><span class="subj-tag">'+esc(e.s)+'</span>'+
          '<span class="tier-sub" style="margin-left:auto">'+esc(tier.cadence)+'</span></div>'+
          '<div class="q-fact">'+esc(e.f)+'</div>'+
          '<div class="q-reveal-area">'+
            '<button class="btn" id="qReveal">'+icons.quiz+'<span>Reveal the logic</span></button>'+
            '<div class="q-logic" id="qLogic">'+
              '<div class="q-l1"><b>'+esc(e.l)+'</b></div>'+
              '<div class="q-l2">Self-check: '+esc(e.c)+'</div>'+
            '</div>'+
          '</div>'+
          '<div class="q-actions" id="qActions">'+
            '<button class="grade good" data-v="1">'+icons.check+'<span>Banked</span></button>'+
            '<button class="grade warn" data-v="2">'+icons.wave+'<span>Faint</span></button>'+
            '<button class="grade bad" data-v="3">'+icons.xmark+'<span>Missed</span></button>'+
          '</div>'+
        '</div>'+
      '</div>';
    var reveal = document.getElementById("qReveal");
    reveal.addEventListener("click", function(){
      document.getElementById("qLogic").classList.add("open");
      document.getElementById("qActions").classList.add("show");
      reveal.style.display = "none";
      quiz.revealed = true;
      if(quiz.idx < quiz.list.length - 1){
        var next = document.createElement("button");
        next.className = "btn"; next.id = "qNext";
        next.innerHTML = icons.target + "<span>Next fact</span>";
        reveal.parentNode.insertBefore(next, reveal);
        next.addEventListener("click", function(){ quiz.idx++; quiz.revealed=false; renderQuiz(); });
      }
    });
    document.querySelectorAll("#qActions .grade").forEach(function(btn){
      btn.addEventListener("click", function(){
        state.mastery[e.id] = parseInt(btn.dataset.v, 10);
        persist(); renderStats();
        quiz.idx++; quiz.revealed = false;
        renderQuiz();
      });
    });
  }

  /* ---------- controls ---------- */
  function renderChips(){
    var html = '<button class="btn '+(state.tier===0?"active":"")+'" data-t="0">All</button>';
    [1,2,3,4].forEach(function(t){
      html += '<button class="btn t'+t+' '+(state.tier===t?"active":"")+'" data-t="'+t+'">Tier '+t+'</button>';
    });
    document.getElementById("tierChips").innerHTML = html;
    document.getElementById("tierChips").querySelectorAll("button").forEach(function(b){
      b.addEventListener("click", function(){
        state.tier = parseInt(b.dataset.t, 10); persist();
        renderChips(); buildQuizList(); renderViews();
      });
    });
  }
  function renderSubjects(){
    var subs = [];
    D.forEach(function(e){ if(subs.indexOf(e.s) === -1) subs.push(e.s); });
    subs.sort();
    var html = '<option value="all">All subjects</option>';
    subs.forEach(function(s){ html += '<option value="'+esc(s)+'"'+(state.subject===s?" selected":"")+'>'+esc(s)+'</option>'; });
    document.getElementById("subjectSel").innerHTML = html;
  }
  function renderViews(){
    renderStats();
    renderBrowse();
    renderQuiz();
  }

  /* ---------- wire up ---------- */
  document.getElementById("viewBrowse").innerHTML = icons.book + "<span>Browse</span>";
  document.getElementById("viewQuiz").innerHTML  = icons.quiz + "<span>Quiz</span>";
  document.getElementById("resetBtn").innerHTML = icons.reset + "<span>Reset</span>";
  document.getElementById("themeBtn").innerHTML = icons.moon;

  var root = document.documentElement, FAM = ["ink","ice","copper","paper"];
  function setFam(f, save){
    if (FAM.indexOf(f) < 0) f = "ink";
    root.setAttribute("data-banktheme", f);
    if (save !== false) { try { localStorage.setItem("medcore.banktheme", f); } catch(e){} }
    var b = document.getElementById("nxFam");
    if (b) [].slice.call(b.children).forEach(function(x){ x.classList.toggle("on", x.getAttribute("data-f") === f); });
  }
  function setMode(m, save){
    if (m !== "light") m = "dark";
    root.setAttribute("data-mode", m);
    document.getElementById("themeBtn").innerHTML = m === "light" ? "☀" : "☾";
    if (save !== false) { try { localStorage.setItem("medcore.theme", m); } catch(e){} }
  }
  function boot(){
    var f = "ink", m = "dark";
    try { f = localStorage.getItem("medcore.banktheme") || "ink"; m = localStorage.getItem("medcore.theme") === "light" ? "light" : "dark"; } catch(e){}
    setFam(f, false); setMode(m, false);
  }
  boot();
  document.getElementById("nxFam").addEventListener("click", function(e){
    var b = e.target.closest("button[data-f]"); if (b) setFam(b.getAttribute("data-f"));
  });
  document.getElementById("themeBtn").addEventListener("click", function(){
    setMode(root.getAttribute("data-mode") === "light" ? "dark" : "light");
  });
  window.addEventListener("storage", function(e){
    if (e.key === "medcore.banktheme" && e.newValue) setFam(e.newValue, false);
    if (e.key === "medcore.theme" && e.newValue) setMode(e.newValue, false);
  });

  document.getElementById("resetBtn").addEventListener("click", function(){
    if(!confirm("Clear all mastery marks for all 39 facts?")) return;
    D.forEach(function(e){ state.mastery[e.id] = 0; });
    persist(); buildQuizList(); renderViews();
  });

  document.getElementById("viewToggle").querySelectorAll("button").forEach(function(b){
    b.addEventListener("click", function(){
      state.view = b.dataset.view; persist();
      document.getElementById("viewToggle").querySelectorAll("button").forEach(function(x){ x.classList.remove("active"); });
      b.classList.add("active");
      if(state.view === "quiz") buildQuizList();
      renderViews();
    });
  });

  document.getElementById("subjectSel").addEventListener("change", function(){
    state.subject = this.value; persist(); buildQuizList(); renderViews();
  });

  var searchTimer = null;
  document.getElementById("searchInput").addEventListener("input", function(){
    var self = this;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function(){ state.q = self.value; persist(); buildQuizList(); renderViews(); }, 160);
  });

  document.getElementById("skipMastered").addEventListener("change", function(){
    state.skipMastered = this.checked; persist(); buildQuizList(); renderViews();
  });

  document.getElementById("browseView").addEventListener("click", function(ev){
    var toggle = ev.target.closest(".logic-toggle");
    if(toggle){
      var open = toggle.classList.toggle("open");
      toggle.setAttribute("aria-expanded", open ? "true" : "false");
      toggle.parentNode.querySelector(".logic").classList.toggle("open", open);
      return;
    }
    var btn = ev.target.closest(".mbtn");
    if(btn){
      var card = btn.closest(".card");
      var id = parseInt(card.dataset.id, 10);
      state.mastery[id] = parseInt(btn.dataset.act, 10);
      persist(); renderStats(); buildQuizList();
      card.outerHTML = cardHtml(D.filter(function(e){ return e.id === id; })[0]);
      return;
    }
  });

  document.getElementById("searchWrap").querySelector("svg") || (function(){
    var svg = document.createElement("span");
    svg.innerHTML = icons.search; svg.style.cssText = "position:absolute;left:11px;top:50%;translate:0 -50%;width:15px;height:15px;color:var(--faint);pointer-events:none;display:grid;place-items:center";
    svg.firstChild.style.cssText = "width:100%;height:100%";
    document.getElementById("searchWrap").appendChild(svg);
  })();

  renderSubjects();
  renderChips();
  renderViews();
  document.getElementById("skipMastered").checked = state.skipMastered;
})();
</script>

<script src="/medcore-sync.js" defer></script>
</body>
</html>
