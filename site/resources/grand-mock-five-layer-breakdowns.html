eviseTopic":"Pathology","syllabusTopic":"Pathology","correctRule":"Saponification consumes calcium → hypocalcaemia is a poor prognostic sign in pancreatitis.","distractors":{"A":"Generic term; not the specific fat–calcium soap reaction.","C":"Coagulative necrosis is ischaemic.","D":"Liquefactive necrosis is enzymatic digestion into fluid."}},{"id":"GM-123","stem":"After 8 weeks in a cast, the arm muscles are visibly smaller. Adaptation?","options":[{"letter":"A","text":"Hypertrophy"},{"letter":"B","text":"Hyperplasia"},{"letter":"C","text":"Atrophy"},{"letter":"D","text":"Metaplasia"}],"correct":"C","testedConcept":"Disuse atrophy","cognitiveTask":"Interpretation","discriminator":"Reduced workload → reduced cell size = atrophy (ubiquitin–proteasome, autophagy).","whyCorrect":"Atrophy causes: disuse, denervation, ischaemia, malnutrition, loss of hormones, ageing, pressure.","trapType":"Hypertrophy is the opposite (increased size from increased load).","futureAlert":"Atrophy causes: disuse, denervation, ischaemia, malnutrition, loss of hormones, ageing, pressure.","reviseTopic":"Pathology","syllabusTopic":"Pathology","correctRule":"Atrophy causes: disuse, denervation, ischaemia, malnutrition, loss of hormones, ageing, pressure.","distractors":{"A":"Increase in cell size.","B":"Increase in cell number.","D":"Change of cell type."}},{"id":"GM-124","stem":"A 25-year-old has a mid-zone peripheral lung lesion with hilar node enlargement in primary TB. This combination is called?","options":[{"letter":"A","text":"Ghon complex"},{"letter":"B","text":"Assmann focus"},{"letter":"C","text":"Simon focus"},{"letter":"D","text":"Cavitary lesion"}],"correct":"A","testedConcept":"Primary tuberculosis","cognitiveTask":"Interpretation","discriminator":"Ghon focus (subpleural lower upper/upper lower lobe) + hilar lymphadenopathy = Ghon complex.","whyCorrect":"Calcified Ghon complex = Ranke complex. Secondary TB: apical (Simon focus/Assmann focus), cavitation.","trapType":"Ghon FOCUS is the lung lesion alone; adding the node makes the COMPLEX.","futureAlert":"Calcified Ghon complex = Ranke complex. Secondary TB: apical (Simon focus/Assmann focus), cavitation.","reviseTopic":"Pathology","syllabusTopic":"Pathology","correctRule":"Calcified Ghon complex = Ranke complex. Secondary TB: apical (Simon focus/Assmann focus), cavitation.","distractors":{"B":"Assmann focus: infraclavicular lesion in post-primary TB.","C":"Simon focus: apical seeding from primary infection.","D":"Cavitation is a feature of secondary (reactivation) TB."}},{"id":"GM-125","stem":"A 12-year-old with acute rheumatic carditis has myocardial lesions with fibrinoid necrosis, lymphocytes and macrophages with wavy nuclei. Name?","options":[{"letter":"A","text":"Aschoff body"},{"letter":"B","text":"Ghon complex"},{"letter":"C","text":"Reed-Sternberg cell"},{"letter":"D","text":"Negri body"}],"correct":"A","testedConcept":"Rheumatic heart disease pathology","cognitiveTask":"Interpretation","discriminator":"Aschoff body = pathognomonic granuloma; Anitschkow (caterpillar) cells have wavy nuclear chromatin.","whyCorrect":"Rheumatic fever: Jones criteria; molecular mimicry to group A strep M protein. Mitral valve most affected.","trapType":"Choosing another 'eponymous body' from a different disease.","futureAlert":"Rheumatic fever: Jones criteria; molecular mimicry to group A strep M protein. Mitral valve most affected.","reviseTopic":"Pathology","syllabusTopic":"Pathology","correctRule":"Rheumatic fever: Jones criteria; molecular mimicry to group A strep M protein. Mitral valve most affected.","distractors":{"B":"Ghon complex = primary TB.","C":"Reed-Sternberg = Hodgkin lymphoma.","D":"Negri bodies = rabies (Purkinje/hippocampal neurons)."}},{"id":"GM-126","stem":"In a mass casualty incident, a patient with minor abrasions and lacerations is ambulatory. START triage colour?","options":[{"letter":"A","text":"Red"},{"letter":"B","text":"Yellow"},{"letter":"C","text":"Green"},{"letter":"D","text":"Black"}],"correct":"C","testedConcept":"START triage","cognitiveTask":"Interpretation","discriminator":"Can walk = 'walking wounded' = GREEN (minor).","whyCorrect":"Walking → green. Not breathing after airway opening → black. RR >30, CRT >2 s, or can't obey commands → red. Otherwise → yellow.","trapType":"Labelling injuries 'yellow' because there is bleeding — mobility decides first.","futureAlert":"Walking → green. Not breathing after airway opening → black. RR >30, CRT >2 s, or can't obey commands → red. Otherwise → yellow.","reviseTopic":"Forensic & Community Medicine","syllabusTopic":"Forensic & Community Medicine","correctRule":"Walking → green. Not breathing after airway opening → black. RR >30, CRT >2 s, or can't obey commands → red. Otherwise → yellow.","distractors":{"A":"Red: immediate life threat.","B":"Yellow: delayed, non-ambulatory but stable.","D":"Black: dead/expectant."}},{"id":"GM-127","stem":"Best example of primary prevention?","options":[{"letter":"A","text":"Mammography"},{"letter":"B","text":"Hepatitis B vaccination"},{"letter":"C","text":"Physiotherapy after stroke"},{"letter":"D","text":"Routine glucose monitoring in diabetic"}],"correct":"B","testedConcept":"Levels of prevention","cognitiveTask":"Interpretation","discriminator":"Primary prevention stops disease from occurring — vaccination before exposure.","whyCorrect":"Primordial: prevent risk factors. Primary: prevent disease. Secondary: early detection/treatment. Tertiary: limit disability/rehabilitate.","trapType":"Screening (mammography) feels preventive but is secondary (early detection).","futureAlert":"Primordial: prevent risk factors. Primary: prevent disease. Secondary: early detection/treatment. Tertiary: limit disability/rehabilitate.","reviseTopic":"Forensic & Community Medicine","syllabusTopic":"Forensic & Community Medicine","correctRule":"Primordial: prevent risk factors. Primary: prevent disease. Secondary: early detection/treatment. Tertiary: limit disability/rehabilitate.","distractors":{"A":"Screening = secondary.","C":"Rehabilitation = tertiary.","D":"Monitoring established disease = tertiary (limit complications)."}},{"id":"GM-128","stem":"5,000 smokers and 5,000 non-smokers free of lung cancer are followed for 10 years. Study design?","options":[{"letter":"A","text":"Case-control"},{"letter":"B","text":"Cross-sectional"},{"letter":"C","text":"Prospective cohort"},{"letter":"D","text":"RCT"}],"correct":"C","testedConcept":"Study designs","cognitiveTask":"Interpretation","discriminator":"Starts with EXPOSURE, disease-free, followed forward in time = prospective cohort.","whyCorrect":"Cohort: exposure → outcome, gives incidence and relative risk. Case-control: outcome → past exposure, gives odds ratio.","trapType":"RCT also follows people forward, but the investigator ASSIGNS exposure — smoking can't be randomised.","futureAlert":"Cohort: exposure → outcome, gives incidence and relative risk. Case-control: outcome → past exposure, gives odds ratio.","reviseTopic":"Forensic & Community Medicine","syllabusTopic":"Forensic & Community Medicine","correctRule":"Cohort: exposure → outcome, gives incidence and relative risk. Case-control: outcome → past exposure, gives odds ratio.","distractors":{"A":"Case-control starts with diseased vs non-diseased.","B":"Cross-sectional is a single time point snapshot (prevalence).","D":"No randomised intervention here."}},{"id":"GM-129","stem":"A new drug prolongs survival in a chronic disease without curing it; incidence is constant. Effect on prevalence?","options":[{"letter":"A","text":"Decrease"},{"letter":"B","text":"Unchanged"},{"letter":"C","text":"Increase"},{"letter":"D","text":"Decrease then increase"}],"correct":"C","testedConcept":"Prevalence = incidence × duration","cognitiveTask":"Interpretation","discriminator":"Longer survival without cure → longer duration → more people living with the disease → ↑ prevalence.","whyCorrect":"P ≈ I × D. Prevalence ↑ with longer duration, new cases, immigration of cases. ↓ with cure, death, emigration.","trapType":"Thinking a 'better treatment' must lower prevalence — only cure or prevention does that.","futureAlert":"P ≈ I × D. Prevalence ↑ with longer duration, new cases, immigration of cases. ↓ with cure, death, emigration.","reviseTopic":"Forensic & Community Medicine","syllabusTopic":"Forensic & Community Medicine","correctRule":"P ≈ I × D. Prevalence ↑ with longer duration, new cases, immigration of cases. ↓ with cure, death, emigration.","distractors":{"A":"Would need cure or higher mortality.","B":"Duration changed, so prevalence changes.","D":"No mechanism for an initial fall."}},{"id":"GM-130","stem":"A surgical sponge is found left inside the abdomen after surgery; the patient sues for negligence. Doctrine?","options":[{"letter":"A","text":"Vicarious liability"},{"letter":"B","text":"Res ipsa loquitur"},{"letter":"C","text":"Contributory negligence"},{"letter":"D","text":"Therapeutic privilege"}],"correct":"B","testedConcept":"Medical negligence doctrines","cognitiveTask":"Interpretation","discriminator":"'The thing speaks for itself' — a retained swab couldn't happen without negligence, so the patient needn't prove it.","whyCorrect":"Res ipsa loquitur examples: retained instruments, wrong-side surgery, burns from equipment.","trapType":"Vicarious liability also applies to hospitals, but it is about who pays, not proof of negligence.","futureAlert":"Res ipsa loquitur examples: retained instruments, wrong-side surgery, burns from equipment.","reviseTopic":"Forensic & Community Medicine","syllabusTopic":"Forensic & Community Medicine","correctRule":"Res ipsa loquitur examples: retained instruments, wrong-side surgery, burns from equipment.","distractors":{"A":"Employer liable for employee's acts — not the evidential doctrine here.","C":"Patient's own negligence contributed — not applicable.","D":"Withholding information that would harm the patient."}},{"id":"GM-131","stem":"A 45-year-old weighs 85 kg; height² = 2.89 m². WHO BMI class?","options":[{"letter":"A","text":"Normal"},{"letter":"B","text":"Overweight"},{"letter":"C","text":"Obese class I"},{"letter":"D","text":"Obese class II"}],"correct":"B","testedConcept":"BMI calculation","cognitiveTask":"Interpretation","discriminator":"85 ÷ 2.89 = 29.4 kg/m² → overweight (25–29.9).","whyCorrect":"WHO: <18.5 underweight; 18.5–24.9 normal; 25–29.9 overweight; 30–34.9 obese I; 35–39.9 obese II; ≥40 obese III. (Asian cut-offs lower: ≥23 overweight, ≥27.5 obese.)","trapType":"Rounding up to 30 → obese class I.","futureAlert":"WHO: <18.5 underweight; 18.5–24.9 normal; 25–29.9 overweight; 30–34.9 obese I; 35–39.9 obese II; ≥40 obese III. (Asian cut-offs lower: ≥23 overweight, ≥27.5 obese.)","reviseTopic":"Forensic & Community Medicine","syllabusTopic":"Forensic & Community Medicine","correctRule":"WHO: <18.5 underweight; 18.5–24.9 normal; 25–29.9 overweight; 30–34.9 obese I; 35–39.9 obese II; ≥40 obese III. (Asian cut-offs lower: ≥23 overweight, ≥27.5 obese.)","distractors":{"A":"Normal ends at 24.9.","C":"Starts at 30.0.","D":"Starts at 35.0."}},{"id":"GM-132","stem":"An assault victim has a skull fracture with displaced bone fragments. Shajjah classification?","options":[{"letter":"A","text":"Shajjah khafifa"},{"letter":"B","text":"Shajjah mudiah"},{"letter":"C","text":"Shajjah munaqqilah"},{"letter":"D","text":"Shajjah damighah"}],"correct":"C","testedConcept":"Shajjah (head/face hurt) under Qisas & Diyat","cognitiveTask":"Interpretation","discriminator":"Fracture WITH displacement of bone = munaqqilah.","whyCorrect":"Khafifah (no bone exposed) → Mudihah (bone exposed) → Hashimah (fracture, no displacement) → Munaqqilah (fracture + displacement) → Ammah (reaches dura) → Damighah (dura ruptured).","trapType":"Hashimah is a fracture without displacement.","futureAlert":"Khafifah (no bone exposed) → Mudihah (bone exposed) → Hashimah (fracture, no displacement) → Munaqqilah (fracture + displacement) → Ammah (reaches dura) → Damighah (dura ruptured).","reviseTopic":"Forensic & Community Medicine","syllabusTopic":"Forensic & Community Medicine","correctRule":"Khafifah (no bone exposed) → Mudihah (bone exposed) → Hashimah (fracture, no displacement) → Munaqqilah (fracture + displacement) → Ammah (reaches dura) → Damighah (dura ruptured).","distractors":{"A":"Khafifah: injury without exposing bone.","B":"Mudihah: bone exposed, not fractured.","D":"Damighah: dura ruptured."}},{"id":"GM-133","stem":"A neonate develops fever and bloody diarrhoea within 48 h of birth; mother had recent dysentery; stool grows Shigella. Mode of transmission?","options":[{"letter":"A","text":"Faecal-oral"},{"letter":"B","text":"Vector-borne"},{"letter":"C","text":"Vertical"},{"letter":"D","text":"Airborne"}],"correct":"C","testedConcept":"Vertical (perinatal) transmission","cognitiveTask":"Interpretation","discriminator":"Mother-to-baby around birth (exposure to maternal faecal flora during delivery) with onset in 48 h = vertical/perinatal transmission.","whyCorrect":"Vertical = transplacental, intrapartum or perinatal from mother to child (e.g. HIV, HBV, GBS, perinatal Shigella).","trapType":"Shigella is classically faecal-oral; the mother–neonate link and timing shift the answer to vertical.","futureAlert":"Vertical = transplacental, intrapartum or perinatal from mother to child (e.g. HIV, HBV, GBS, perinatal Shigella).","reviseTopic":"Forensic & Community Medicine","syllabusTopic":"Forensic & Community Medicine","correctRule":"Vertical = transplacental, intrapartum or perinatal from mother to child (e.g. HIV, HBV, GBS, perinatal Shigella).","distractors":{"A":"Classic route for Shigella in general, but here the source is maternal during birth.","B":"No vector involved.","D":"Shigella isn't airborne."}},{"id":"GM-134","stem":"Ages 35, 25, 40, 20, 30. Median?","options":[{"letter":"A","text":"25"},{"letter":"B","text":"30"},{"letter":"C","text":"35"},{"letter":"D","text":"40"}],"correct":"B","testedConcept":"Median","cognitiveTask":"Interpretation","discriminator":"Sort first: 20, 25, 30, 35, 40 → middle value = 30.","whyCorrect":"Odd n: (n+1)/2 th value. Even n: mean of two middle values. Median resists outliers.","trapType":"Picking the middle of the UNSORTED list (40).","futureAlert":"Odd n: (n+1)/2 th value. Even n: mean of two middle values. Median resists outliers.","reviseTopic":"Forensic & Community Medicine","syllabusTopic":"Forensic & Community Medicine","correctRule":"Odd n: (n+1)/2 th value. Even n: mean of two middle values. Median resists outliers.","distractors":{"A":"Second value.","C":"Fourth value.","D":"Middle of the unsorted list."}},{"id":"GM-135","stem":"A screening test has 95% sensitivity. Meaning?","options":[{"letter":"A","text":"95% without disease test negative"},{"letter":"B","text":"95% with disease test positive"},{"letter":"C","text":"95% of positives have disease"},{"letter":"D","text":"5% with disease test positive"}],"correct":"B","testedConcept":"Sensitivity","cognitiveTask":"Interpretation","discriminator":"Sensitivity = TP ÷ (TP + FN) — the proportion of DISEASED people who test positive.","whyCorrect":"SnNout: a highly Sensitive test, when Negative, rules out. SpPin: Specific + Positive rules in.","trapType":"A is specificity; C is PPV.","futureAlert":"SnNout: a highly Sensitive test, when Negative, rules out. SpPin: Specific + Positive rules in.","reviseTopic":"Forensic & Community Medicine","syllabusTopic":"Forensic & Community Medicine","correctRule":"SnNout: a highly Sensitive test, when Negative, rules out. SpPin: Specific + Positive rules in.","distractors":{"A":"Specificity.","C":"Positive predictive value.","D":"Inverted — 5% would be false negatives."}},{"id":"GM-136","stem":"A 2-year-old has a 5-minute generalised tonic-clonic seizure with fever 39.2 °C, no focal deficit, first episode. Diagnosis?","options":[{"letter":"A","text":"Complex febrile seizure"},{"letter":"B","text":"Simple febrile seizure"},{"letter":"C","text":"Absence seizure"},{"letter":"D","text":"Bacterial meningitis"}],"correct":"B","testedConcept":"Febrile seizure classification","cognitiveTask":"Interpretation","discriminator":"Generalised + <15 min + single in 24 h + 6 m–5 y + no focal signs = simple.","whyCorrect":"Complex: focal, >15 min, or recurs within 24 h. Simple febrile seizures carry excellent prognosis; treat the fever source.","trapType":"Choosing complex because 5 minutes 'sounds long'.","futureAlert":"Complex: focal, >15 min, or recurs within 24 h. Simple febrile seizures carry excellent prognosis; treat the fever source.","reviseTopic":"Paediatrics","syllabusTopic":"Paediatrics","correctRule":"Complex: focal, >15 min, or recurs within 24 h. Simple febrile seizures carry excellent prognosis; treat the fever source.","distractors":{"A":"Needs focality, >15 min or recurrence.","C":"Absence: brief staring spells, 3 Hz spike-wave, no fever link.","D":"Meningitis: neck stiffness, bulging fontanelle, toxic look — not described."}},{"id":"GM-137","stem":"An unvaccinated 4-year-old with fever, cough, coryza and conjunctivitis has white spots on red base on buccal mucosa a day before a maculopapular rash. Name?","options":[{"letter":"A","text":"Koplik spots"},{"letter":"B","text":"Rose spots"},{"letter":"C","text":"Roth spots"},{"letter":"D","text":"Bitot spots"}],"correct":"A","testedConcept":"Measles prodrome","cognitiveTask":"Interpretation","discriminator":"3 Cs (cough, coryza, conjunctivitis) + buccal white spots = Koplik spots (pathognomonic for measles).","whyCorrect":"Measles: rash starts behind ears/face, spreads down. Give vitamin A. Complications: pneumonia, encephalitis, SSPE.","trapType":"Other eponymous 'spots' belong to unrelated diseases.","futureAlert":"Measles: rash starts behind ears/face, spreads down. Give vitamin A. Complications: pneumonia, encephalitis, SSPE.","reviseTopic":"Paediatrics","syllabusTopic":"Paediatrics","correctRule":"Measles: rash starts behind ears/face, spreads down. Give vitamin A. Complications: pneumonia, encephalitis, SSPE.","distractors":{"B":"Rose spots: typhoid (trunk).","C":"Roth spots: retinal haemorrhages in endocarditis.","D":"Bitot spots: conjunctival in vitamin A deficiency."}},{"id":"GM-138","stem":"At what age can a child typically copy a square?","options":[{"letter":"A","text":"2 years"},{"letter":"B","text":"3 years"},{"letter":"C","text":"4 years"},{"letter":"D","text":"6 years"}],"correct":"C","testedConcept":"Fine motor milestones","cognitiveTask":"Interpretation","discriminator":"Square = 4 years.","whyCorrect":"Line 2 y, circle 3 y, cross 3.5–4 y, square 4 y, triangle 5 y, diamond 6 y.","trapType":"Circle (3 years) vs square (4 years) — adjacent milestones.","futureAlert":"Line 2 y, circle 3 y, cross 3.5–4 y, square 4 y, triangle 5 y, diamond 6 y.","reviseTopic":"Paediatrics","syllabusTopic":"Paediatrics","correctRule":"Line 2 y, circle 3 y, cross 3.5–4 y, square 4 y, triangle 5 y, diamond 6 y.","distractors":{"A":"Vertical line.","B":"Circle.","D":"Diamond."}},{"id":"GM-139","stem":"A 1-year-old with diarrhoea is lethargic, has sunken eyes, cannot drink and skin pinch goes back very slowly (>2 s). IMNCI degree of dehydration?","options":[{"letter":"A","text":"None"},{"letter":"B","text":"Some"},{"letter":"C","text":"Severe"},{"letter":"D","text":"Hypernatraemic"}],"correct":"C","testedConcept":"IMNCI dehydration classification","cognitiveTask":"Interpretation","discriminator":"≥2 of: lethargic/unconscious, sunken eyes, not able to drink, skin pinch very slow = severe.","whyCorrect":"Some: restless/irritable, drinks eagerly, pinch slow → Plan B (ORS 75 mL/kg over 4 h). Severe → Plan C (IV RL).","trapType":"Sunken eyes alone fit 'some' — the lethargy and inability to drink upgrade it.","futureAlert":"Some: restless/irritable, drinks eagerly, pinch slow → Plan B (ORS 75 mL/kg over 4 h). Severe → Plan C (IV RL).","reviseTopic":"Paediatrics","syllabusTopic":"Paediatrics","correctRule":"Some: restless/irritable, drinks eagerly, pinch slow → Plan B (ORS 75 mL/kg over 4 h). Severe → Plan C (IV RL).","distractors":{"A":"Signs clearly present.","B":"Some dehydration has irritability and eager drinking.","D":"Hypernatraemia is a biochemical type, not an IMNCI grade."}},{"id":"GM-140","stem":"A 4-year-old with untreated coeliac disease is at increased risk of?","options":[{"letter":"A","text":"Type 1 diabetes"},{"letter":"B","text":"Cystic fibrosis"},{"letter":"C","text":"Sickle cell anaemia"},{"letter":"D","text":"Congenital heart disease"}],"correct":"A","testedConcept":"Autoimmune associations of coeliac disease","cognitiveTask":"Interpretation","discriminator":"Shared HLA-DQ2/DQ8 → association with T1DM, autoimmune thyroiditis.","whyCorrect":"Coeliac associations: T1DM, thyroid disease, dermatitis herpetiformis, IgA deficiency, Down/Turner syndrome, enteropathy-associated T-cell lymphoma.","trapType":"CF and sickle cell are genetic disorders with no causal link.","futureAlert":"Coeliac associations: T1DM, thyroid disease, dermatitis herpetiformis, IgA deficiency, Down/Turner syndrome, enteropathy-associated T-cell lymphoma.","reviseTopic":"Paediatrics","syllabusTopic":"Paediatrics","correctRule":"Coeliac associations: T1DM, thyroid disease, dermatitis herpetiformis, IgA deficiency, Down/Turner syndrome, enteropathy-associated T-cell lymphoma.","distractors":{"B":"Autosomal recessive CFTR mutation — unrelated.","C":"HbS mutation — unrelated.","D":"Congenital; can't be acquired from coeliac disease."}},{"id":"GM-141","stem":"A 3-day-old has unconjugated jaundice; mother O-negative, baby A-positive; DAT positive. Diagnosis?","options":[{"letter":"A","text":"Physiological"},{"letter":"B","text":"ABO HDN"},{"letter":"C","text":"Rh HDN"},{"letter":"D","text":"Breast milk jaundice"}],"correct":"B","testedConcept":"Immune haemolytic disease of the newborn","cognitiveTask":"Interpretation","discriminator":"O mother + A baby → maternal anti-A IgG; ABO HDN is far more common, can affect a first baby and is usually milder.","whyCorrect":"ABO HDN: O mothers, first pregnancy possible, mild, DAT weakly positive, spherocytes. Rh HDN: prior sensitisation, severe, early (<24 h) jaundice, hydrops.","trapType":"Mother is also Rh-negative, tempting C — but no history of prior sensitisation is given, and ABO incompatibility actually protects against Rh sensitisation.","futureAlert":"ABO HDN: O mothers, first pregnancy possible, mild, DAT weakly positive, spherocytes. Rh HDN: prior sensitisation, severe, early (<24 h) jaundice, hydrops.","reviseTopic":"Paediatrics","syllabusTopic":"Paediatrics","correctRule":"ABO HDN: O mothers, first pregnancy possible, mild, DAT weakly positive, spherocytes. Rh HDN: prior sensitisation, severe, early (<24 h) jaundice, hydrops.","distractors":{"A":"Physiological jaundice is DAT-negative.","C":"Possible, but requires prior sensitisation; ABO is the more common/likely answer here.","D":"Breast milk jaundice appears after the first week and is DAT-negative."}},{"id":"GM-142","stem":"A 2-year-old with pallor, irritability and pica drinks excessive cow's milk; microcytic hypochromic anaemia with low ferritin. Diagnosis?","options":[{"letter":"A","text":"Thalassaemia minor"},{"letter":"B","text":"Iron deficiency anaemia"},{"letter":"C","text":"Sideroblastic anaemia"},{"letter":"D","text":"Lead poisoning"}],"correct":"B","testedConcept":"Nutritional iron deficiency","cognitiveTask":"Interpretation","discriminator":"LOW FERRITIN is diagnostic; excess cow's milk (low iron, occult GI loss) + pica fits.","whyCorrect":"Low ferritin = iron deficiency. Limit cow's milk to ~500 mL/day and give oral iron.","trapType":"Lead poisoning also causes pica and microcytosis, but ferritin is normal and basophilic stippling is seen.","futureAlert":"Low ferritin = iron deficiency. Limit cow's milk to ~500 mL/day and give oral iron.","reviseTopic":"Paediatrics","syllabusTopic":"Paediatrics","correctRule":"Low ferritin = iron deficiency. Limit cow's milk to ~500 mL/day and give oral iron.","distractors":{"A":"Thalassaemia: normal/high ferritin, high RBC count, Mentzer <13.","C":"Sideroblastic: high ferritin, ring sideroblasts.","D":"Lead: normal ferritin, basophilic stippling."}},{"id":"GM-143","stem":"A 5-year-old has a systolic murmur and a widely split S2 that doesn't vary with respiration. Diagnosis?","options":[{"letter":"A","text":"VSD"},{"letter":"B","text":"ASD"},{"letter":"C","text":"PDA"},{"letter":"D","text":"Tetralogy of Fallot"}],"correct":"B","testedConcept":"Fixed splitting of S2","cognitiveTask":"Interpretation","discriminator":"Wide FIXED split S2 = ASD (RV volume overload; respiration doesn't change the shunt).","whyCorrect":"ASD murmur is an ejection systolic flow murmur at the upper left sternal edge (pulmonary flow), not across the defect.","trapType":"VSD gives a pansystolic murmur without fixed splitting.","futureAlert":"ASD murmur is an ejection systolic flow murmur at the upper left sternal edge (pulmonary flow), not across the defect.","reviseTopic":"Paediatrics","syllabusTopic":"Paediatrics","correctRule":"ASD murmur is an ejection systolic flow murmur at the upper left sternal edge (pulmonary flow), not across the defect.","distractors":{"A":"Harsh pansystolic murmur, lower left sternal edge.","C":"Continuous machinery murmur.","D":"Cyanosis, single S2, ejection murmur from RVOT obstruction."}},{"id":"GM-144","stem":"A 6-year-old has 1 year of recurrent nocturnal and exercise-induced dry cough and wheeze, with eczema; chest clear today. Diagnosis?","options":[{"letter":"A","text":"Foreign body"},{"letter":"B","text":"Asthma"},{"letter":"C","text":"Bronchiolitis"},{"letter":"D","text":"Cystic fibrosis"}],"correct":"B","testedConcept":"Childhood asthma","cognitiveTask":"Interpretation","discriminator":"Recurrent, variable, nocturnal + exercise triggers + atopy (eczema) = asthma; normal exam between episodes.","whyCorrect":"Atopic triad: asthma, eczema, allergic rhinitis. Diagnose with history + spirometry/reversibility or FeNO if ≥5 years.","trapType":"Foreign body causes sudden unilateral persistent wheeze, not a year of episodic symptoms.","futureAlert":"Atopic triad: asthma, eczema, allergic rhinitis. Diagnose with history + spirometry/reversibility or FeNO if ≥5 years.","reviseTopic":"Paediatrics","syllabusTopic":"Paediatrics","correctRule":"Atopic triad: asthma, eczema, allergic rhinitis. Diagnose with history + spirometry/reversibility or FeNO if ≥5 years.","distractors":{"A":"Sudden onset, choking episode, unilateral findings.","C":"Infants <1 year, viral, single episode.","D":"Failure to thrive, steatorrhoea, chronic productive cough."}},{"id":"GM-145","stem":"A healthy 3-year-old has a large firm smooth abdominal mass and microscopic haematuria. Diagnosis?","options":[{"letter":"A","text":"Neuroblastoma"},{"letter":"B","text":"Wilms tumour"},{"letter":"C","text":"Hydronephrosis"},{"letter":"D","text":"CAH"}],"correct":"B","testedConcept":"Childhood abdominal masses","cognitiveTask":"Interpretation","discriminator":"Well child + smooth flank mass (doesn't cross midline) + haematuria = Wilms (nephroblastoma).","whyCorrect":"Wilms: WT1/WT2, associated with WAGR, Beckwith–Wiedemann. Don't palpate repeatedly (rupture risk).","trapType":"Neuroblastoma is also a toddler mass but is irregular, crosses the midline, and the child is unwell.","futureAlert":"Wilms: WT1/WT2, associated with WAGR, Beckwith–Wiedemann. Don't palpate repeatedly (rupture risk).","reviseTopic":"Paediatrics","syllabusTopic":"Paediatrics","correctRule":"Wilms: WT1/WT2, associated with WAGR, Beckwith–Wiedemann. Don't palpate repeatedly (rupture risk).","distractors":{"A":"Irregular, crosses midline, raised VMA/HVA, unwell child.","C":"Soft/cystic, not firm solid.","D":"CAH: virilisation/salt wasting, no mass."}},{"id":"GM-146","stem":"A 6-year-old with 2 days of fever, headache, photophobia and vomiting is alert; neck stiff, Kernig's positive; CSF lymphocytes, normal glucose, mildly raised protein. Diagnosis?","options":[{"letter":"A","text":"Bacterial meningitis"},{"letter":"B","text":"TB meningitis"},{"letter":"C","text":"Encephalitis"},{"letter":"D","text":"Viral meningitis"}],"correct":"D","testedConcept":"CSF interpretation","cognitiveTask":"Interpretation","discriminator":"Lymphocytes + NORMAL glucose + alert child = viral meningitis.","whyCorrect":"Bacterial: neutrophils, ↓ glucose, ↑↑ protein. TB: lymphocytes, ↓ glucose, ↑↑ protein. Viral: lymphocytes, normal glucose, mild ↑ protein.","trapType":"TB meningitis is also lymphocytic, but glucose is LOW and onset is subacute (weeks).","futureAlert":"Bacterial: neutrophils, ↓ glucose, ↑↑ protein. TB: lymphocytes, ↓ glucose, ↑↑ protein. Viral: lymphocytes, normal glucose, mild ↑ protein.","reviseTopic":"Paediatrics","syllabusTopic":"Paediatrics","correctRule":"Bacterial: neutrophils, ↓ glucose, ↑↑ protein. TB: lymphocytes, ↓ glucose, ↑↑ protein. Viral: lymphocytes, normal glucose, mild ↑ protein.","distractors":{"A":"Neutrophilic, low glucose.","B":"Low glucose, weeks of illness.","C":"Encephalitis: altered consciousness/seizures — child is alert here."}},{"id":"GM-147","stem":"A 4-month-old in winter has a runny nose and mild fever progressing to tachypnoea, wheeze and fine crackles. Most common causative agent?","options":[{"letter":"A","text":"Adenovirus"},{"letter":"B","text":"Rhinovirus"},{"letter":"C","text":"Parainfluenza"},{"letter":"D","text":"RSV"}],"correct":"D","testedConcept":"Bronchiolitis","cognitiveTask":"Interpretation","discriminator":"Infant <1 y + winter + coryza then wheeze/crackles = bronchiolitis → RSV.","whyCorrect":"Supportive care (O₂, feeds). Palivizumab prophylaxis for high-risk infants.","trapType":"Parainfluenza is the main cause of CROUP.","futureAlert":"Supportive care (O₂, feeds). Palivizumab prophylaxis for high-risk infants.","reviseTopic":"Paediatrics","syllabusTopic":"Paediatrics","correctRule":"Supportive care (O₂, feeds). Palivizumab prophylaxis for high-risk infants.","distractors":{"A":"Adenovirus causes pharyngoconjunctival fever, some pneumonia.","B":"Rhinovirus is the second cause; less common than RSV.","C":"Parainfluenza → croup."}},{"id":"GM-148","stem":"A 2-year-old has a barking seal-like cough, hoarseness and inspiratory stridor, worse at night. Diagnosis?","options":[{"letter":"A","text":"Epiglottitis"},{"letter":"B","text":"Croup"},{"letter":"C","text":"Foreign body"},{"letter":"D","text":"Bronchiolitis"}],"correct":"B","testedConcept":"Croup (laryngotracheobronchitis)","cognitiveTask":"Interpretation","discriminator":"Barking cough + stridor + hoarseness, 6 m–3 y = croup (parainfluenza).","whyCorrect":"Croup: steeple sign on X-ray; oral dexamethasone; nebulised adrenaline if severe.","trapType":"Epiglottitis also causes stridor, but with drooling, toxic look, tripod posture and NO barking cough.","futureAlert":"Croup: steeple sign on X-ray; oral dexamethasone; nebulised adrenaline if severe.","reviseTopic":"Paediatrics","syllabusTopic":"Paediatrics","correctRule":"Croup: steeple sign on X-ray; oral dexamethasone; nebulised adrenaline if severe.","distractors":{"A":"Drooling, toxic, thumbprint sign.","C":"Sudden onset, choking history.","D":"Wheeze and crackles, not stridor."}},{"id":"GM-149","stem":"An 8-year-old has low fever, persistent dry cough and headache; CXR shows bilateral patchy infiltrates but the child doesn't look sick. Organism?","options":[{"letter":"A","text":"S. pneumoniae"},{"letter":"B","text":"Mycoplasma"},{"letter":"C","text":"S. aureus"},{"letter":"D","text":"H. influenzae"}],"correct":"B","testedConcept":"Atypical ('walking') pneumonia","cognitiveTask":"Interpretation","discriminator":"School-age + dry cough + headache + CXR worse than the child looks = Mycoplasma.","whyCorrect":"Mycoplasma: cold agglutinins, erythema multiforme, bullous myringitis. Treat with macrolide (no cell wall → β-lactams useless).","trapType":"S. pneumoniae is the commonest pneumonia overall but gives lobar consolidation and an unwell child.","futureAlert":"Mycoplasma: cold agglutinins, erythema multiforme, bullous myringitis. Treat with macrolide (no cell wall → β-lactams useless).","reviseTopic":"Paediatrics","syllabusTopic":"Paediatrics","correctRule":"Mycoplasma: cold agglutinins, erythema multiforme, bullous myringitis. Treat with macrolide (no cell wall → β-lactams useless).","distractors":{"A":"Lobar, high fever, sick child.","C":"Cavitation/empyema, very ill.","D":"Younger children, typical bacterial pattern."}},{"id":"GM-150","stem":"A 5-week-old boy has projectile vomiting after feeds, constant hunger and an olive-shaped abdominal mass. Diagnosis?","options":[{"letter":"A","text":"GERD"},{"letter":"B","text":"Duodenal atresia"},{"letter":"C","text":"Intussusception"},{"letter":"D","text":"Pyloric stenosis"}],"correct":"D","testedConcept":"Infantile hypertrophic pyloric stenosis","cognitiveTask":"Interpretation","discriminator":"3–6 weeks + non-bilious projectile vomiting + hungry baby + olive mass.","whyCorrect":"Hypochloraemic hypokalaemic metabolic alkalosis; correct fluids/electrolytes first → Ramstedt pyloromyotomy.","trapType":"Duodenal atresia presents in the first day with BILIOUS vomiting and double-bubble.","futureAlert":"Hypochloraemic hypokalaemic metabolic alkalosis; correct fluids/electrolytes first → Ramstedt pyloromyotomy.","reviseTopic":"Paediatrics","syllabusTopic":"Paediatrics","correctRule":"Hypochloraemic hypokalaemic metabolic alkalosis; correct fluids/electrolytes first → Ramstedt pyloromyotomy.","distractors":{"A":"Effortless regurgitation, no mass.","B":"Bilious vomiting day 1, double-bubble, Down's association.","C":"6–18 months, red-currant jelly stool, sausage mass."}},{"id":"GM-151","stem":"A 46-year-old with menorrhagia and fatigue has hypochromic microcytic RBCs with pencil cells. Confirmatory test?","options":[{"letter":"A","text":"Haptoglobin"},{"letter":"B","text":"Hb electrophoresis"},{"letter":"C","text":"Serum transferrin"},{"letter":"D","text":"Serum ferritin"}],"correct":"D","testedConcept":"Iron deficiency anaemia","cognitiveTask":"Interpretation","discriminator":"Chronic blood loss + microcytosis + pencil cells → confirm with LOW ferritin (most specific test of iron stores).","whyCorrect":"Ferritin <15–30 µg/L confirms IDA (but it is an acute-phase reactant; may be falsely normal in inflammation). TIBC/transferrin ↑, saturation ↓.","trapType":"Hb electrophoresis is for thalassaemia, which doesn't fit menorrhagia.","futureAlert":"Ferritin <15–30 µg/L confirms IDA (but it is an acute-phase reactant; may be falsely normal in inflammation). TIBC/transferrin ↑, saturation ↓.","reviseTopic":"Internal Medicine","syllabusTopic":"Internal Medicine","correctRule":"Ferritin <15–30 µg/L confirms IDA (but it is an acute-phase reactant; may be falsely normal in inflammation). TIBC/transferrin ↑, saturation ↓.","distractors":{"A":"Haptoglobin falls in haemolysis.","B":"Electrophoresis diagnoses thalassaemia/haemoglobinopathy.","C":"Transferrin rises in IDA but is less specific than ferritin."}},{"id":"GM-152","stem":"A 30-year-old has weight loss, palpitations, heat intolerance and bilateral proptosis; suppressed TSH, high free T4. Mechanism?","options":[{"letter":"A","text":"TSH-secreting adenoma"},{"letter":"B","text":"Iodine deficiency"},{"letter":"C","text":"TPO destruction"},{"letter":"D","text":"Thyroid-stimulating immunoglobulins"}],"correct":"D","testedConcept":"Graves' disease","cognitiveTask":"Interpretation","discriminator":"Hyperthyroid + EYE signs = Graves' → TSH-receptor-stimulating antibodies (TSI).","whyCorrect":"Graves' triad: hyperthyroidism, ophthalmopathy, pretibial myxoedema. Diffuse uptake on scan.","trapType":"TPO antibodies are typical of Hashimoto's (hypothyroidism).","futureAlert":"Graves' triad: hyperthyroidism, ophthalmopathy, pretibial myxoedema. Diffuse uptake on scan.","reviseTopic":"Internal Medicine","syllabusTopic":"Internal Medicine","correctRule":"Graves' triad: hyperthyroidism, ophthalmopathy, pretibial myxoedema. Diffuse uptake on scan.","distractors":{"A":"TSH would be HIGH, not suppressed.","B":"Iodine deficiency causes goitre/hypothyroidism.","C":"TPO-mediated destruction = Hashimoto's."}},{"id":"GM-153","stem":"Heberden's nodes are present in?","options":[{"letter":"A","text":"Ankylosing spondylitis"},{"letter":"B","text":"Gout"},{"letter":"C","text":"Osteoarthritis"},{"letter":"D","text":"Rheumatoid arthritis"}],"correct":"C","testedConcept":"Hand signs in arthritis","cognitiveTask":"Interpretation","discriminator":"Heberden's = DIP osteophytes; Bouchard's = PIP osteophytes → osteoarthritis.","whyCorrect":"OA: DIP/PIP, 1st CMC, weight-bearing joints. RA: MCP/PIP, wrist, ulnar deviation, swan neck, boutonnière.","trapType":"RA affects hands too, but SPARES the DIPs.","futureAlert":"OA: DIP/PIP, 1st CMC, weight-bearing joints. RA: MCP/PIP, wrist, ulnar deviation, swan neck, boutonnière.","reviseTopic":"Internal Medicine","syllabusTopic":"Internal Medicine","correctRule":"OA: DIP/PIP, 1st CMC, weight-bearing joints. RA: MCP/PIP, wrist, ulnar deviation, swan neck, boutonnière.","distractors":{"A":"Axial spine and sacroiliac disease.","B":"Tophi and acute monoarthritis (1st MTP).","D":"Spares DIP joints."}},{"id":"GM-154","stem":"A 15-year-old with polydipsia, polyuria and BSR 400 mg/dL. Most likely acute complication?","options":[{"letter":"A","text":"Sepsis"},{"letter":"B","text":"DKA"},{"letter":"C","text":"HHS"},{"letter":"D","text":"Lactic acidosis"}],"correct":"B","testedConcept":"Acute complications by diabetes type","cognitiveTask":"Interpretation","discriminator":"Teenager = Type 1 (absolute insulin deficiency) → DKA.","whyCorrect":"DKA: glucose >250 mg/dL, pH <7.3, HCO₃ <18, ketones. Treat: fluids → insulin infusion → potassium.","trapType":"HHS is the complication of elderly Type 2 patients.","futureAlert":"DKA: glucose >250 mg/dL, pH <7.3, HCO₃ <18, ketones. Treat: fluids → insulin infusion → potassium.","reviseTopic":"Internal Medicine","syllabusTopic":"Internal Medicine","correctRule":"DKA: glucose >250 mg/dL, pH <7.3, HCO₃ <18, ketones. Treat: fluids → insulin infusion → potassium.","distractors":{"A":"Possible trigger, not the expected direct complication.","C":"HHS: older T2DM, glucose >600, no ketosis.","D":"Lactic acidosis relates to metformin/shock."}},{"id":"GM-155","stem":"A pregnant woman at 8 weeks has Graves' hyperthyroidism. Best antithyroid drug?","options":[{"letter":"A","text":"Methimazole"},{"letter":"B","text":"Carbimazole"},{"letter":"C","text":"PTU"},{"letter":"D","text":"Radioactive iodine"}],"correct":"C","testedConcept":"Antithyroid drugs in pregnancy","cognitiveTask":"Interpretation","discriminator":"FIRST trimester → PTU (methimazole/carbimazole are teratogenic: aplasia cutis, embryopathy).","whyCorrect":"1st trimester PTU → switch to methimazole in 2nd/3rd (PTU hepatotoxicity). RAI contraindicated in pregnancy.","trapType":"Methimazole is preferred outside the first trimester — timing is the key.","futureAlert":"1st trimester PTU → switch to methimazole in 2nd/3rd (PTU hepatotoxicity). RAI contraindicated in pregnancy.","reviseTopic":"Internal Medicine","syllabusTopic":"Internal Medicine","correctRule":"1st trimester PTU → switch to methimazole in 2nd/3rd (PTU hepatotoxicity). RAI contraindicated in pregnancy.","distractors":{"A":"Teratogenic in the first trimester.","B":"Prodrug of methimazole — same risk.","D":"Destroys the fetal thyroid; absolutely contraindicated."}},{"id":"GM-156","stem":"A 55-year-old has progressive hand weakness, wasting and fasciculations, with lower-limb hyperreflexia and normal sensation. Diagnosis?","options":[{"letter":"A","text":"Myasthenia gravis"},{"letter":"B","text":"GBS"},{"letter":"C","text":"Multiple sclerosis"},{"letter":"D","text":"ALS"}],"correct":"D","testedConcept":"Motor neurone disease","cognitiveTask":"Interpretation","discriminator":"Mixed UMN (hyperreflexia) + LMN (wasting, fasciculations) signs with PURELY motor involvement = ALS.","whyCorrect":"MND spares sensation, eye movements and sphincters. Riluzole prolongs survival.","trapType":"MS also gives UMN signs, but with sensory and visual involvement and no fasciculations.","futureAlert":"MND spares sensation, eye movements and sphincters. Riluzole prolongs survival.","reviseTopic":"Internal Medicine","syllabusTopic":"Internal Medicine","correctRule":"MND spares sensation, eye movements and sphincters. Riluzole prolongs survival.","distractors":{"A":"Fatigable weakness, no wasting/fasciculations.","B":"Areflexia, ascending, often sensory symptoms.","C":"Sensory, visual and cerebellar features; relapsing course."}},{"id":"GM-157","stem":"A third-trimester pregnant woman has acute hepatitis E. Most significant risk?","options":[{"letter":"A","text":"High maternal mortality"},{"letter":"B","text":"Chronic hepatitis"},{"letter":"C","text":"HCC"},{"letter":"D","text":"Carrier state"}],"correct":"A","testedConcept":"Hepatitis E in pregnancy","cognitiveTask":"Interpretation","discriminator":"HEV in the third trimester → fulminant hepatic failure with mortality up to 20–25%.","whyCorrect":"HEV: faeco-oral, waterborne, self-limiting except in pregnancy (genotype 1/2) and immunosuppressed (chronic genotype 3).","trapType":"Chronicity and HCC belong to HBV/HCV.","futureAlert":"HEV: faeco-oral, waterborne, self-limiting except in pregnancy (genotype 1/2) and immunosuppressed (chronic genotype 3).","reviseTopic":"Internal Medicine","syllabusTopic":"Internal Medicine","correctRule":"HEV: faeco-oral, waterborne, self-limiting except in pregnancy (genotype 1/2) and immunosuppressed (chronic genotype 3).","distractors":{"B":"HEV rarely becomes chronic (only in immunosuppressed).","C":"Not an HEV risk.","D":"No carrier state."}},{"id":"GM-158","stem":"A 70-year-old has throbbing left temporal headache, scalp tenderness, jaw claudication and very high ESR. Diagnosis?","options":[{"letter":"A","text":"Migraine"},{"letter":"B","text":"Giant cell arteritis"},{"letter":"C","text":"Cluster headache"},{"letter":"D","text":"Trigeminal neuralgia"}],"correct":"B","testedConcept":"Giant cell (temporal) arteritis","cognitiveTask":"Interpretation","discriminator":">50 y + new temporal headache + jaw claudication + scalp tenderness + raised ESR.","whyCorrect":"Start high-dose prednisolone immediately; temporal artery biopsy within 2 weeks. Associated with polymyalgia rheumatica.","trapType":"Delaying steroids for biopsy — GCA risks irreversible blindness.","futureAlert":"Start high-dose prednisolone immediately; temporal artery biopsy within 2 weeks. Associated with polymyalgia rheumatica.","reviseTopic":"Internal Medicine","syllabusTopic":"Internal Medicine","correctRule":"Start high-dose prednisolone immediately; temporal artery biopsy within 2 weeks. Associated with polymyalgia rheumatica.","distractors":{"A":"Younger patients, aura, normal ESR.","C":"Young men, periorbital, autonomic features.","D":"Brief electric-shock facial pain, normal ESR."}},{"id":"GM-159","stem":"A 12-year-old girl has pedal oedema, periorbital puffiness and 4+ proteinuria. Initial treatment to reduce proteinuria?","options":[{"letter":"A","text":"Calcium channel blockers"},{"letter":"B","text":"Diuretic"},{"letter":"C","text":"Prednisolone"},{"letter":"D","text":"Protein restriction"}],"correct":"C","testedConcept":"Childhood nephrotic syndrome","cognitiveTask":"Interpretation","discriminator":"Child + nephrotic picture = minimal change disease until proven otherwise → steroid-responsive.","whyCorrect":"Prednisolone 60 mg/m²/day for 4–6 weeks then taper. Steroid-resistant → biopsy (FSGS).","trapType":"Diuretics treat the oedema, not the proteinuria.","futureAlert":"Prednisolone 60 mg/m²/day for 4–6 weeks then taper. Steroid-resistant → biopsy (FSGS).","reviseTopic":"Internal Medicine","syllabusTopic":"Internal Medicine","correctRule":"Prednisolone 60 mg/m²/day for 4–6 weeks then taper. Steroid-resistant → biopsy (FSGS).","distractors":{"A":"No antiproteinuric role (ACEi would be, not CCB).","B":"Symptomatic oedema relief only.","D":"Protein restriction is not recommended in children."}},{"id":"GM-160","stem":"A 21-year-old has painless gross haematuria 2 days after a sore throat; BP 170/110; dipstick ++ protein with dysmorphic RBCs. Diagnosis?","options":[{"letter":"A","text":"Diabetic nephropathy"},{"letter":"B","text":"IgA nephropathy"},{"letter":"C","text":"Minimal change"},{"letter":"D","text":"UTI"}],"correct":"B","testedConcept":"Synpharyngitic haematuria","cognitiveTask":"Interpretation","discriminator":"Haematuria within 1–3 days of a URTI = IgA nephropathy.","whyCorrect":"IgA: young males, mesangial IgA deposits, most common GN worldwide. PSGN: 1–3 w (throat) / 3–6 w (skin), low C3.","trapType":"Post-streptococcal GN causes haematuria 1–3 WEEKS after the sore throat (not an option here).","futureAlert":"IgA: young males, mesangial IgA deposits, most common GN worldwide. PSGN: 1–3 w (throat) / 3–6 w (skin), low C3.","reviseTopic":"Internal Medicine","syllabusTopic":"Internal Medicine","correctRule":"IgA: young males, mesangial IgA deposits, most common GN worldwide. PSGN: 1–3 w (throat) / 3–6 w (skin), low C3.","distractors":{"A":"Requires long-standing diabetes; no haematuria.","C":"Heavy proteinuria without haematuria or hypertension.","D":"Dysmorphic RBCs indicate glomerular, not lower urinary, origin."}},{"id":"GM-161","stem":"Most common type of emphysema in a chronic smoker?","options":[{"letter":"A","text":"Centriacinar"},{"letter":"B","text":"Panacinar"},{"letter":"C","text":"Paraseptal"},{"letter":"D","text":"Irregular"}],"correct":"A","testedConcept":"Emphysema subtypes","cognitiveTask":"Interpretation","discriminator":"Smoking → centriacinar (respiratory bronchiole), upper lobes.","whyCorrect":"Centriacinar: smokers, upper zones. Panacinar: A1AT, lower zones. Paraseptal: young, spontaneous pneumothorax.","trapType":"Panacinar is linked to α1-antitrypsin deficiency (lower lobes).","futureAlert":"Centriacinar: smokers, upper zones. Panacinar: A1AT, lower zones. Paraseptal: young, spontaneous pneumothorax.","reviseTopic":"Internal Medicine","syllabusTopic":"Internal Medicine","correctRule":"Centriacinar: smokers, upper zones. Panacinar: A1AT, lower zones. Paraseptal: young, spontaneous pneumothorax.","distractors":{"B":"A1AT deficiency.","C":"Subpleural bullae, pneumothorax.","D":"Scar-associated, usually incidental."}},{"id":"GM-162","stem":"A 60-year-old smoker has chronic productive cough, frequent infections, cyanosis, overweight and raised JVP. Underlying pathology?","options":[{"letter":"A","text":"Bronchiectasis"},{"letter":"B","text":"Centriacinar emphysema"},{"letter":"C","text":"Chronic bronchitis"},{"letter":"D","text":"A1AT deficiency"}],"correct":"C","testedConcept":"'Blue bloater' COPD","cognitiveTask":"Interpretation","discriminator":"Productive cough + cyanosis + obesity + cor pulmonale (raised JVP) = chronic bronchitis phenotype.","whyCorrect":"Chronic bronchitis: productive cough ≥3 months in 2 consecutive years. Reid index >0.4.","trapType":"Emphysema is the 'pink puffer' — thin, breathless, not cyanosed.","futureAlert":"Chronic bronchitis: productive cough ≥3 months in 2 consecutive years. Reid index >0.4.","reviseTopic":"Internal Medicine","syllabusTopic":"Internal Medicine","correctRule":"Chronic bronchitis: productive cough ≥3 months in 2 consecutive years. Reid index >0.4.","distractors":{"A":"Copious purulent sputum, clubbing, tram-tracks on CT.","B":"Pink puffer: thin, pursed lips, hyperinflation.","D":"Young, lower-lobe panacinar emphysema, liver disease."}},{"id":"GM-163","stem":"A healthcare worker's serology: HBsAg −, anti-HBs +, anti-HBc −. Interpretation?","options":[{"letter":"A","text":"Acute HBV"},{"letter":"B","text":"Chronic HBV"},{"letter":"C","text":"Successful vaccination"},{"letter":"D","text":"Resolved infection"}],"correct":"C","testedConcept":"Hepatitis B serology","cognitiveTask":"Interpretation","discriminator":"Anti-HBs ALONE (anti-HBc negative) = vaccine immunity — vaccine contains only HBsAg.","whyCorrect":"Anti-HBc = ever infected. IgM anti-HBc = acute. HBsAg >6 months = chronic. Anti-HBs = immune.","trapType":"Resolved natural infection also has anti-HBs, but ALSO anti-HBc.","futureAlert":"Anti-HBc = ever infected. IgM anti-HBc = acute. HBsAg >6 months = chronic. Anti-HBs = immune.","reviseTopic":"Internal Medicine","syllabusTopic":"Internal Medicine","correctRule":"Anti-HBc = ever infected. IgM anti-HBc = acute. HBsAg >6 months = chronic. Anti-HBs = immune.","distractors":{"A":"HBsAg + IgM anti-HBc would be positive.","B":"HBsAg positive for >6 months.","D":"Anti-HBc would be positive."}},{"id":"GM-164","stem":"A 16-year-old girl has short stature, webbed neck and primary amenorrhoea. Karyotype?","options":[{"letter":"A","text":"46,XX"},{"letter":"B","text":"45,X"},{"letter":"C","text":"47,XXY"},{"letter":"D","text":"47,XX,+21"}],"correct":"B","testedConcept":"Turner syndrome","cognitiveTask":"Interpretation","discriminator":"Short stature + webbed neck + primary amenorrhoea (streak ovaries) = 45,X.","whyCorrect":"Turner: coarctation, bicuspid aortic valve, horseshoe kidney, lymphoedema at birth. Treat with GH and oestrogen replacement.","trapType":"Noonan syndrome looks similar but has a normal karyotype.","futureAlert":"Turner: coarctation, bicuspid aortic valve, horseshoe kidney, lymphoedema at birth. Treat with GH and oestrogen replacement.","reviseTopic":"Internal Medicine","syllabusTopic":"Internal Medicine","correctRule":"Turner: coarctation, bicuspid aortic valve, horseshoe kidney, lymphoedema at birth. Treat with GH and oestrogen replacement.","distractors":{"A":"Normal female karyotype.","C":"Klinefelter (tall male, hypogonadism).","D":"Down syndrome."}},{"id":"GM-165","stem":"A 20-year-old athlete with exertional syncope has a harsh systolic murmur at the LSE that increases with Valsalva. Diagnosis?","options":[{"letter":"A","text":"Aortic stenosis"},{"letter":"B","text":"Mitral regurgitation"},{"letter":"C","text":"HOCM"},{"letter":"D","text":"VSD"}],"correct":"C","testedConcept":"Dynamic LVOT obstruction","cognitiveTask":"Interpretation","discriminator":"Murmur that INCREASES with Valsalva (↓ preload) = HOCM. Only HOCM and MVP louden with Valsalva.","whyCorrect":"HOCM: ↑ with Valsalva/standing, ↓ with squatting/handgrip. Leading cause of sudden death in young athletes. Avoid nitrates/diuretics; use β-blockers.","trapType":"Aortic stenosis gets SOFTER with Valsalva.","futureAlert":"HOCM: ↑ with Valsalva/standing, ↓ with squatting/handgrip. Leading cause of sudden death in young athletes. Avoid nitrates/diuretics; use β-blockers.","reviseTopic":"Internal Medicine","syllabusTopic":"Internal Medicine","correctRule":"HOCM: ↑ with Valsalva/standing, ↓ with squatting/handgrip. Leading cause of sudden death in young athletes. Avoid nitrates/diuretics; use β-blockers.","distractors":{"A":"Softer with Valsalva; older patients.","B":"Apical pansystolic, softer with Valsalva.","D":"Pansystolic at LLSE, not Valsalva-dependent increase."}},{"id":"GM-166","stem":"A 5-year-old boy has progressive weakness, difficulty climbing stairs, calf enlargement and Gowers' sign. Inheritance?","options":[{"letter":"A","text":"AD"},{"letter":"B","text":"AR"},{"letter":"C","text":"X-linked recessive"},{"letter":"D","text":"X-linked dominant"}],"correct":"C","testedConcept":"Duchenne muscular dystrophy","cognitiveTask":"Interpretation","discriminator":"Boy + proximal weakness + pseudohypertrophy of calves + Gowers' = DMD (dystrophin gene, Xp21).","whyCorrect":"DMD: frameshift deletion, absent dystrophin, CK very high, wheelchair by ~12. Becker: in-frame, milder.","trapType":"Choosing autosomal patterns — DMD affects boys because it is X-linked.","futureAlert":"DMD: frameshift deletion, absent dystrophin, CK very high, wheelchair by ~12. Becker: in-frame, milder.","reviseTopic":"Internal Medicine","syllabusTopic":"Internal Medicine","correctRule":"DMD: frameshift deletion, absent dystrophin, CK very high, wheelchair by ~12. Becker: in-frame, milder.","distractors":{"A":"Myotonic dystrophy is AD, not this picture.","B":"Limb-girdle/SMA are AR.","D":"Rare (e.g. Rett, vitamin D-resistant rickets)."}},{"id":"GM-167","stem":"A 12-year-old with hereditary spherocytosis has sudden severe pallor after a flu-like illness; Hb 10 → 5 g/dL; reticulocytes very low. Cause?","options":[{"letter":"A","text":"AIHA"},{"letter":"B","text":"Parvovirus B19"},{"letter":"C","text":"Folate deficiency"},{"letter":"D","text":"Splenic sequestration"}],"correct":"B","testedConcept":"Aplastic crisis","cognitiveTask":"Interpretation","discriminator":"Sudden Hb drop + LOW reticulocytes after a viral illness = parvovirus B19 halting erythropoiesis.","whyCorrect":"Parvovirus targets P antigen on erythroid precursors. Low retics = production failure; high retics = haemolysis/sequestration.","trapType":"Splenic sequestration also drops Hb, but reticulocytes are HIGH and the spleen enlarges.","futureAlert":"Parvovirus targets P antigen on erythroid precursors. Low retics = production failure; high retics = haemolysis/sequestration.","reviseTopic":"Internal Medicine","syllabusTopic":"Internal Medicine","correctRule":"Parvovirus targets P antigen on erythroid precursors. Low retics = production failure; high retics = haemolysis/sequestration.","distractors":{"A":"Haemolysis → high reticulocytes, positive DAT.","C":"Slow onset, megaloblastic picture.","D":"High reticulocytes, massive splenomegaly."}},{"id":"GM-168","stem":"A 65-year-old has bone pain (especially back), fatigue, recurrent infections and punched-out lytic skull lesions. Diagnosis?","options":[{"letter":"A","text":"Osteoporosis"},{"letter":"B","text":"Multiple myeloma"},{"letter":"C","text":"OA"},{"letter":"D","text":"Bone metastasis"}],"correct":"B","testedConcept":"Multiple myeloma","cognitiveTask":"Interpretation","discriminator":"Punched-out lytic lesions + infections (immunoparesis) + bone pain in an elderly patient.","whyCorrect":"CRAB: hyperCalcaemia, Renal failure, Anaemia, Bone lesions. Serum/urine electrophoresis (M-band, Bence Jones), bone marrow >10% plasma cells. Bone scan is falsely negative.","trapType":"Metastases also cause lytic lesions, but don't explain recurrent infections and are less 'punched-out'.","futureAlert":"CRAB: hyperCalcaemia, Renal failure, Anaemia, Bone lesions. Serum/urine electrophoresis (M-band, Bence Jones), bone marrow >10% plasma cells. Bone scan is falsely negative.","reviseTopic":"Internal Medicine","syllabusTopic":"Internal Medicine","correctRule":"CRAB: hyperCalcaemia, Renal failure, Anaemia, Bone lesions. Serum/urine electrophoresis (M-band, Bence Jones), bone marrow >10% plasma cells. Bone scan is falsely negative.","distractors":{"A":"Osteoporosis has no lytic lesions.","C":"Joint disease, no lytic skull lesions.","D":"Possible differential; infections favour myeloma."}},{"id":"GM-169","stem":"A 55-year-old on hydralazine develops arthralgia, fever and pleuritis without rash or renal involvement. Antibody?","options":[{"letter":"A","text":"Anti-dsDNA"},{"letter":"B","text":"Anti-centromere"},{"letter":"C","text":"Anti-Smith"},{"letter":"D","text":"Anti-histone"}],"correct":"D","testedConcept":"Drug-induced lupus","cognitiveTask":"Interpretation","discriminator":"Lupus features on hydralazine with SPARED kidneys/CNS = drug-induced lupus → anti-histone.","whyCorrect":"DIL drugs: SHIPP-E — Sulfonamides, Hydralazine, Isoniazid, Procainamide, Phenytoin, Etanercept. Resolves on stopping the drug.","trapType":"Anti-dsDNA and anti-Smith are specific for idiopathic SLE.","futureAlert":"DIL drugs: SHIPP-E — Sulfonamides, Hydralazine, Isoniazid, Procainamide, Phenytoin, Etanercept. Resolves on stopping the drug.","reviseTopic":"Internal Medicine","syllabusTopic":"Internal Medicine","correctRule":"DIL drugs: SHIPP-E — Sulfonamides, Hydralazine, Isoniazid, Procainamide, Phenytoin, Etanercept. Resolves on stopping the drug.","distractors":{"A":"SLE-specific; correlates with lupus nephritis.","B":"Limited systemic sclerosis (CREST).","C":"Most specific for SLE."}},{"id":"GM-170","stem":"A 35-year-old has nightly unilateral periorbital pain, red eye and nasal congestion — cluster headache. Acute treatment?","options":[{"letter":"A","text":"High-flow 100% oxygen"},{"letter":"B","text":"Oral ibuprofen"},{"letter":"C","text":"Oral propranolol"},{"letter":"D","text":"Oral amitriptyline"}],"correct":"A","testedConcept":"Acute cluster headache","cognitiveTask":"Interpretation","discriminator":"Acute attack = high-flow O₂ (12–15 L/min via non-rebreather) or SC/intranasal sumatriptan.","whyCorrect":"Acute: O₂ + triptan. Prophylaxis: verapamil (first-line), short steroid course, lithium.","trapType":"Propranolol and amitriptyline are MIGRAINE prophylaxis.","futureAlert":"Acute: O₂ + triptan. Prophylaxis: verapamil (first-line), short steroid course, lithium.","reviseTopic":"Internal Medicine","syllabusTopic":"Internal Medicine","correctRule":"Acute: O₂ + triptan. Prophylaxis: verapamil (first-line), short steroid course, lithium.","distractors":{"B":"Too slow and ineffective for cluster attacks.","C":"Migraine prophylaxis, not cluster.","D":"Tension-type/migraine prophylaxis."}},{"id":"GM-171","stem":"A 30-year-old has medullary thyroid carcinoma, hypercalcaemia from parathyroid hyperplasia, and episodic headaches with palpitations. Diagnosis?","options":[{"letter":"A","text":"MEN 1"},{"letter":"B","text":"MEN 2A"},{"letter":"C","text":"MEN 2B"},{"letter":"D","text":"Sporadic MTC"}],"correct":"B","testedConcept":"MEN 2A (Sipple syndrome)","cognitiveTask":"Interpretation","discriminator":"MTC + parathyroid + phaeochromocytoma (episodic headache/palpitations) = MEN 2A.","whyCorrect":"RET mutation → prophylactic thyroidectomy in carriers. Always exclude phaeo before any surgery.","trapType":"MEN 2B shares MTC and phaeo but has NO parathyroid disease; it has mucosal neuromas and marfanoid habitus.","futureAlert":"RET mutation → prophylactic thyroidectomy in carriers. Always exclude phaeo before any surgery.","reviseTopic":"Internal Medicine","syllabusTopic":"Internal Medicine","correctRule":"RET mutation → prophylactic thyroidectomy in carriers. Always exclude phaeo before any surgery.","distractors":{"A":"Pituitary, parathyroid, pancreas — no MTC.","C":"No hyperparathyroidism.","D":"Sporadic MTC doesn't explain parathyroid and phaeo features."}},{"id":"GM-172","stem":"A 22-year-old with 3 months' low fever has reduced left chest expansion, dull percussion, reduced vocal resonance on the left and trachea deviated right. Diagnosis?","options":[{"letter":"A","text":"Right lung collapse"},{"letter":"B","text":"Left pulmonary fibrosis"},{"letter":"C","text":"Left pneumothorax"},{"letter":"D","text":"Left pleural effusion"}],"correct":"D","testedConcept":"Chest signs","cognitiveTask":"Interpretation","discriminator":"Stony dull + reduced resonance + trachea pushed AWAY = effusion (here likely tuberculous given chronic fever).","whyCorrect":"Push away: effusion, tension pneumothorax. Pull towards: collapse, fibrosis, pneumonectomy. Hyper-resonant = pneumothorax.","trapType":"Collapse also gives dullness, but trachea is pulled TOWARDS the affected side.","futureAlert":"Push away: effusion, tension pneumothorax. Pull towards: collapse, fibrosis, pneumonectomy. Hyper-resonant = pneumothorax.","reviseTopic":"Internal Medicine","syllabusTopic":"Internal Medicine","correctRule":"Push away: effusion, tension pneumothorax. Pull towards: collapse, fibrosis, pneumonectomy. Hyper-resonant = pneumothorax.","distractors":{"A":"Right collapse would pull trachea right with right-sided signs.","B":"Fibrosis pulls trachea towards left; crackles present.","C":"Pneumothorax is hyper-resonant, not dull."}},{"id":"GM-173","stem":"A 28-year-old smoker collapses with sudden right chest pain while playing tennis; tachypnoeic, cyanosed, trachea deviated left, hyper-resonant right chest. Diagnosis?","options":[{"letter":"A","text":"Aortic dissection"},{"letter":"B","text":"MI"},{"letter":"C","text":"PE"},{"letter":"D","text":"Tension pneumothorax"}],"correct":"D","testedConcept":"Tension pneumothorax","cognitiveTask":"Interpretation","discriminator":"Hyper-resonance + trachea shifted AWAY + collapse/cyanosis = tension pneumothorax (likely ruptured apical bleb in young smoker).","whyCorrect":"Immediate needle decompression then chest drain; don't wait for imaging.","trapType":"PE causes sudden dyspnoea and collapse but doesn't shift the trachea or cause hyper-resonance.","futureAlert":"Immediate needle decompression then chest drain; don't wait for imaging.","reviseTopic":"Internal Medicine","syllabusTopic":"Internal Medicine","correctRule":"Immediate needle decompression then chest drain; don't wait for imaging.","distractors":{"A":"Tearing pain to back, unequal BPs, older hypertensive.","B":"Central crushing pain, ECG changes, no tracheal shift.","C":"Normal percussion, no tracheal deviation."}},{"id":"GM-174","stem":"A 12-year-old has progressive pain and swelling of the femoral mid-shaft; X-ray shows destructive lesion with onion-skin periosteal reaction. Diagnosis?","options":[{"letter":"A","text":"Osteosarcoma"},{"letter":"B","text":"Osteoid osteoma"},{"letter":"C","text":"Ewing sarcoma"},{"letter":"D","text":"Chondrosarcoma"}],"correct":"C","testedConcept":"Paediatric bone tumours","cognitiveTask":"Interpretation","discriminator":"Diaphysis + onion-skin periosteal reaction in a child = Ewing sarcoma (t(11;22), small round blue cells).","whyCorrect":"Ewing: diaphysis, onion-skin, may mimic infection (fever, raised ESR), CD99+. Osteosarcoma: metaphysis around knee.","trapType":"Osteosarcoma is also adolescent but metaphyseal with sunburst/Codman triangle.","futureAlert":"Ewing: diaphysis, onion-skin, may mimic infection (fever, raised ESR), CD99+. Osteosarcoma: metaphysis around knee.","reviseTopic":"Internal Medicine","syllabusTopic":"Internal Medicine","correctRule":"Ewing: diaphysis, onion-skin, may mimic infection (fever, raised ESR), CD99+. Osteosarcoma: metaphysis around knee.","distractors":{"A":"Metaphysis, sunburst, Codman triangle.","B":"Small lucent nidus, night pain relieved by NSAIDs.","D":"Older adults, pelvis/proximal femur."}},{"id":"GM-175","stem":"A 65-year-old with T2DM and CKD (eGFR 20) is admitted with severe dyspnoea while on metformin. Most serious adverse effect?","options":[{"letter":"A","text":"Hypoglycaemia"},{"letter":"B","text":"Weight gain"},{"letter":"C","text":"Lactic acidosis"},{"letter":"D","text":"Pancreatitis"}],"correct":"C","testedConcept":"Metformin-associated lactic acidosis","cognitiveTask":"Interpretation","discriminator":"Renal impairment → metformin accumulation → lactic acidosis (dyspnoea = Kussmaul compensation).","whyCorrect":"Metformin: reduce dose at eGFR <45, STOP at <30. Hold before contrast and surgery.","trapType":"Hypoglycaemia is a sulfonylurea/insulin problem — metformin alone rarely causes it.","futureAlert":"Metformin: reduce dose at eGFR <45, STOP at <30. Hold before contrast and surgery.","reviseTopic":"Internal Medicine","syllabusTopic":"Internal Medicine","correctRule":"Metformin: reduce dose at eGFR <45, STOP at <30. Hold before contrast and surgery.","distractors":{"A":"Rare with metformin monotherapy.","B":"Metformin is weight-neutral/loss.","D":"Linked to GLP-1 agonists/DPP-4 inhibitors."}},{"id":"GM-176","stem":"A 55-year-old smoker has an enlarged hilar node with blackish discolouration on biopsy. Cause?","options":[{"letter":"A","text":"Anthracotic pigment"},{"letter":"B","text":"Haemosiderosis"},{"letter":"C","text":"Lipochrome"},{"letter":"D","text":"Melanin"}],"correct":"A","testedConcept":"Exogenous pigments","cognitiveTask":"Interpretation","discriminator":"Inhaled carbon (smoke/coal) taken up by macrophages → black lymph nodes = anthracosis.","whyCorrect":"Exogenous: carbon (anthracosis), tattoo. Endogenous: lipofuscin (wear-and-tear, brown), haemosiderin (golden-brown, Prussian blue +), melanin.","trapType":"Melanin is also dark but is endogenous and lives in skin/melanocytes, not hilar nodes.","futureAlert":"Exogenous: carbon (anthracosis), tattoo. Endogenous: lipofuscin (wear-and-tear, brown), haemosiderin (golden-brown, Prussian blue +), melanin.","reviseTopic":"Internal Medicine","syllabusTopic":"Internal Medicine","correctRule":"Exogenous: carbon (anthracosis), tattoo. Endogenous: lipofuscin (wear-and-tear, brown), haemosiderin (golden-brown, Prussian blue +), melanin.","distractors":{"B":"Golden-brown iron pigment; Prussian blue positive.","C":"Lipofuscin is yellow-brown in ageing cells.","D":"Melanin is not found in hilar nodes of smokers."}},{"id":"GM-177","stem":"A 32-year-old's cortisol fails to suppress after overnight 1 mg dexamethasone. Interpretation?","options":[{"letter":"A","text":"Normal"},{"letter":"B","text":"Confirms Cushing's syndrome"},{"letter":"C","text":"Primary adrenal insufficiency"},{"letter":"D","text":"Confirms pituitary adenoma"}],"correct":"B","testedConcept":"Overnight low-dose dexamethasone test","cognitiveTask":"Interpretation","discriminator":"Failure to suppress = autonomous cortisol excess = Cushing's syndrome present.","whyCorrect":"Normal: cortisol <50 nmol/L (1.8 µg/dL) after 1 mg. Then ACTH: low → adrenal; high → pituitary or ectopic (HDDST/IPSS).","trapType":"Jumping to the CAUSE — the low-dose test doesn't localise.","futureAlert":"Normal: cortisol <50 nmol/L (1.8 µg/dL) after 1 mg. Then ACTH: low → adrenal; high → pituitary or ectopic (HDDST/IPSS).","reviseTopic":"Internal Medicine","syllabusTopic":"Internal Medicine","correctRule":"Normal: cortisol <50 nmol/L (1.8 µg/dL) after 1 mg. Then ACTH: low → adrenal; high → pituitary or ectopic (HDDST/IPSS).","distractors":{"A":"Normal people suppress.","C":"Insufficiency = LOW cortisol, tested by Synacthen.","D":"Pituitary source needs high-dose test/IPSS + MRI."}},{"id":"GM-178","stem":"A 74-year-old has a year of magnetic gait, urinary incontinence and progressive memory loss. Diagnosis?","options":[{"letter":"A","text":"Alzheimer's"},{"letter":"B","text":"Parkinson's"},{"letter":"C","text":"Normal pressure hydrocephalus"},{"letter":"D","text":"Vascular dementia"}],"correct":"C","testedConcept":"NPH triad","cognitiveTask":"Interpretation","discriminator":"'Wet, wobbly, wacky': incontinence + magnetic gait + dementia.","whyCorrect":"CT/MRI: ventriculomegaly out of proportion to atrophy. Large-volume LP tap test → VP shunt (reversible dementia).","trapType":"Parkinson's gives shuffling gait but with tremor/rigidity and incontinence appears late.","futureAlert":"CT/MRI: ventriculomegaly out of proportion to atrophy. Large-volume LP tap test → VP shunt (reversible dementia).","reviseTopic":"Internal Medicine","syllabusTopic":"Internal Medicine","correctRule":"CT/MRI: ventriculomegaly out of proportion to atrophy. Large-volume LP tap test → VP shunt (reversible dementia).","distractors":{"A":"Memory first; gait/continence preserved until late.","B":"Resting tremor, rigidity, bradykinesia.","D":"Stepwise decline, focal neurological signs."}},{"id":"GM-179","stem":"A 50-year-old has sudden electric shock-like right facial pain triggered by brushing teeth or chewing. First-line drug?","options":[{"letter":"A","text":"Gabapentin"},{"letter":"B","text":"Carbamazepine"},{"letter":"C","text":"Amitriptyline"},{"letter":"D","text":"Morphine"}],"correct":"B","testedConcept":"Trigeminal neuralgia","cognitiveTask":"Interpretation","discriminator":"Paroxysmal lancinating V2/V3 pain with trigger zones → carbamazepine.","whyCorrect":"Carbamazepine first-line (check HLA-B*1502 in Asians — SJS risk). Young patient/bilateral → MRI to exclude MS. Refractory → microvascular decompression.","trapType":"Gabapentin/amitriptyline are first-line for OTHER neuropathic pain, not trigeminal neuralgia.","futureAlert":"Carbamazepine first-line (check HLA-B*1502 in Asians — SJS risk). Young patient/bilateral → MRI to exclude MS. Refractory → microvascular decompression.","reviseTopic":"Internal Medicine","syllabusTopic":"Internal Medicine","correctRule":"Carbamazepine first-line (check HLA-B*1502 in Asians — SJS risk). Young patient/bilateral → MRI to exclude MS. Refractory → microvascular decompression.","distractors":{"A":"Second-line for TN.","C":"For other neuropathic pain; not first-line here.","D":"Opioids are ineffective for TN."}},{"id":"GM-180","stem":"Which condition most likely causes an exudative pleural effusion?","options":[{"letter":"A","text":"CHF"},{"letter":"B","text":"Cirrhosis"},{"letter":"C","text":"Pneumonia"},{"letter":"D","text":"Nephrotic syndrome"}],"correct":"C","testedConcept":"Transudate vs exudate","cognitiveTask":"Interpretation","discriminator":"Exudates come from inflamed/leaky pleura (infection, malignancy) — pneumonia → parapneumonic effusion.","whyCorrect":"Light's criteria (exudate if any): fluid/serum protein >0.5, fluid/serum LDH >0.6, fluid LDH >⅔ ULN serum.","trapType":"CHF is the most common effusion overall, but it is a transudate.","futureAlert":"Light's criteria (exudate if any): fluid/serum protein >0.5, fluid/serum LDH >0.6, fluid LDH >⅔ ULN serum.","reviseTopic":"Internal Medicine","syllabusTopic":"Internal Medicine","correctRule":"Light's criteria (exudate if any): fluid/serum protein >0.5, fluid/serum LDH >0.6, fluid LDH >⅔ ULN serum.","distractors":{"A":"↑ hydrostatic pressure → transudate.","B":"↓ oncotic pressure → transudate.","D":"↓ oncotic pressure → transudate."}},{"id":"GM-181","stem":"Initial management for osteoarthritis of the knees?","options":[{"letter":"A","text":"Weight loss"},{"letter":"B","text":"NSAIDs"},{"letter":"C","text":"Intra-articular injection"},{"letter":"D","text":"Knee replacement"}],"correct":"A","testedConcept":"Stepped care in OA","cognitiveTask":"Interpretation","discriminator":"Core first-line for all: education, exercise and weight loss.","whyCorrect":"OA ladder: weight loss + exercise → paracetamol/topical NSAID → oral NSAID + PPI → IA steroid → arthroplasty.","trapType":"NSAIDs relieve pain but come after core non-drug measures (and topical before oral).","futureAlert":"OA ladder: weight loss + exercise → paracetamol/topical NSAID → oral NSAID + PPI → IA steroid → arthroplasty.","reviseTopic":"Internal Medicine","syllabusTopic":"Internal Medicine","correctRule":"OA ladder: weight loss + exercise → paracetamol/topical NSAID → oral NSAID + PPI → IA steroid → arthroplasty.","distractors":{"B":"Adjunct, not initial.","C":"For flares/when other measures fail.","D":"End-stage disease only."}},{"id":"GM-182","stem":"A 35-year-old has 4 months of symmetrical small-joint hand arthritis sparing DIPs, with morning stiffness >1 hour. Drug to improve prognosis?","options":[{"letter":"A","text":"Celecoxib"},{"letter":"B","text":"Diclofenac"},{"letter":"C","text":"Methotrexate"},{"letter":"D","text":"Prednisolone"}],"correct":"C","testedConcept":"Disease-modifying therapy in RA","cognitiveTask":"Interpretation","discriminator":"'Improve prognosis and reduce complications' = DMARD → methotrexate (anchor drug).","whyCorrect":"Start MTX early (within 3 months) with folic acid; monitor LFTs/FBC; bridge with short steroid course.","trapType":"Steroids and NSAIDs control symptoms but don't prevent joint erosion long-term.","futureAlert":"Start MTX early (within 3 months) with folic acid; monitor LFTs/FBC; bridge with short steroid course.","reviseTopic":"Internal Medicine","syllabusTopic":"Internal Medicine","correctRule":"Start MTX early (within 3 months) with folic acid; monitor LFTs/FBC; bridge with short steroid course.","distractors":{"A":"Symptomatic only.","B":"Symptomatic only.","D":"Bridging therapy; long-term use harmful, not disease-modifying alone."}},{"id":"GM-183","stem":"A 45-year-old has symmetrical small-joint hand pain with morning stiffness >1 h and a history of mucocutaneous lesions. Best investigation to confirm?","options":[{"letter":"A","text":"X-ray hands"},{"letter":"B","text":"ESR"},{"letter":"C","text":"Anti-CCP"},{"letter":"D","text":"ANA"}],"correct":"D","testedConcept":"SLE arthritis vs RA","cognitiveTask":"Interpretation","discriminator":"Inflammatory polyarthritis PLUS mucocutaneous lesions (oral ulcers, malar rash) points to SLE → ANA.","whyCorrect":"ANA is the screening test for SLE (~95% sensitive); confirm with anti-dsDNA/anti-Smith. SLE arthritis is non-erosive (Jaccoud's).","trapType":"The joint pattern alone looks like RA → anti-CCP; the mucocutaneous history is the twist.","futureAlert":"ANA is the screening test for SLE (~95% sensitive); confirm with anti-dsDNA/anti-Smith. SLE arthritis is non-erosive (Jaccoud's).","reviseTopic":"Internal Medicine","syllabusTopic":"Internal Medicine","correctRule":"ANA is the screening test for SLE (~95% sensitive); confirm with anti-dsDNA/anti-Smith. SLE arthritis is non-erosive (Jaccoud's).","distractors":{"A":"Erosions support RA; SLE is non-erosive.","B":"Non-specific inflammatory marker.","C":"Specific for RA; doesn't explain mucocutaneous lesions."}},{"id":"GM-184","stem":"A 25-year-old with MS has diplopia with impaired left eye adduction and right eye nystagmus on right gaze. Structure affected?","options":[{"letter":"A","text":"MLF"},{"letter":"B","text":"Optic nerve"},{"letter":"C","text":"Oculomotor nerve"},{"letter":"D","text":"Abducens nerve"}],"correct":"A","testedConcept":"Internuclear ophthalmoplegia","cognitiveTask":"Interpretation","discriminator":"Failed adduction of one eye + nystagmus of the abducting eye = INO → lesion of the ipsilateral (left) MLF.","whyCorrect":"Young + bilateral INO = MS; elderly + unilateral = stroke. Lesion side = side of weak adduction.","trapType":"CN III palsy also blocks adduction, but with ptosis, 'down and out' eye and dilated pupil; convergence is preserved in INO.","futureAlert":"Young + bilateral INO = MS; elderly + unilateral = stroke. Lesion side = side of weak adduction.","reviseTopic":"Internal Medicine","syllabusTopic":"Internal Medicine","correctRule":"Young + bilateral INO = MS; elderly + unilateral = stroke. Lesion side = side of weak adduction.","distractors":{"B":"Optic neuritis causes visual loss and pain, not diplopia.","C":"Ptosis, mydriasis, eye down and out.","D":"Failure of abduction."}},{"id":"GM-185","stem":"A 30-year-old has ptosis and diplopia that worsen by evening and improve with rest. Next step in management?","options":[{"letter":"A","text":"Pyridostigmine"},{"letter":"B","text":"3,4-Diaminopyridine"},{"letter":"C","text":"Plasma exchange"},{"letter":"D","text":"Cyclophosphamide"}],"correct":"A","testedConcept":"Myasthenia gravis","cognitiveTask":"Interpretation","discriminator":"Fatigable ocular weakness = MG → first-line symptomatic acetylcholinesterase inhibitor.","whyCorrect":"MG: anti-AChR antibodies; CT chest for thymoma. Pyridostigmine → steroids/azathioprine → thymectomy; crisis → IVIG/PLEX.","trapType":"Plasma exchange is for myasthenic CRISIS, not stable ocular disease.","futureAlert":"MG: anti-AChR antibodies; CT chest for thymoma. Pyridostigmine → steroids/azathioprine → thymectomy; crisis → IVIG/PLEX.","reviseTopic":"Internal Medicine","syllabusTopic":"Internal Medicine","correctRule":"MG: anti-AChR antibodies; CT chest for thymoma. Pyridostigmine → steroids/azathioprine → thymectomy; crisis → IVIG/PLEX.","distractors":{"B":"Used for Lambert–Eaton syndrome.","C":"Crisis/pre-operative only.","D":"Not standard first-line immunosuppression."}},{"id":"GM-186","stem":"A 24-year-old has ascending weakness over days after a respiratory infection with absent reflexes. Diagnosis?","options":[{"letter":"A","text":"MS"},{"letter":"B","text":"Myasthenia gravis"},{"letter":"C","text":"GBS"},{"letter":"D","text":"Muscular dystrophy"}],"correct":"C","testedConcept":"Guillain–Barré syndrome","cognitiveTask":"Interpretation","discriminator":"Post-infectious + ascending + AREFLEXIA = acute demyelinating polyneuropathy.","whyCorrect":"CSF: albuminocytological dissociation. Monitor FVC (ventilate if <15–20 mL/kg). Treat with IVIG or plasma exchange — NOT steroids.","trapType":"Myasthenia causes weakness but reflexes are preserved and it is fatigable, not ascending.","futureAlert":"CSF: albuminocytological dissociation. Monitor FVC (ventilate if <15–20 mL/kg). Treat with IVIG or plasma exchange — NOT steroids.","reviseTopic":"Internal Medicine","syllabusTopic":"Internal Medicine","correctRule":"CSF: albuminocytological dissociation. Monitor FVC (ventilate if <15–20 mL/kg). Treat with IVIG or plasma exchange — NOT steroids.","distractors":{"A":"UMN signs, hyperreflexia.","B":"Fatigable, ocular/bulbar, reflexes normal.","D":"Chronic progressive from childhood."}},{"id":"GM-187","stem":"A 30-year-old has well-demarcated silvery-scaled plaques on elbows and knees; removing scales causes pinpoint bleeding. Sign?","options":[{"letter":"A","text":"Auspitz sign"},{"letter":"B","text":"Koebner phenomenon"},{"letter":"C","text":"Nikolsky sign"},{"letter":"D","text":"Darier's sign"}],"correct":"A","testedConcept":"Psoriasis signs","cognitiveTask":"Interpretation","discriminator":"Pinpoint bleeding on scale removal (dilated dermal capillaries) = Auspitz.","whyCorrect":"Psoriasis: extensor plaques, nail pitting, onycholysis, psoriatic arthritis.","trapType":"Koebner is also psoriasis, but it means lesions appearing at sites of trauma.","futureAlert":"Psoriasis: extensor plaques, nail pitting, onycholysis, psoriatic arthritis.","reviseTopic":"Internal Medicine","syllabusTopic":"Internal Medicine","correctRule":"Psoriasis: extensor plaques, nail pitting, onycholysis, psoriatic arthritis.","distractors":{"B":"New lesions at injury sites.","C":"Skin shears with lateral pressure — pemphigus vulgaris, SSSS, TEN.","D":"Urtication on rubbing — mastocytosis."}},{"id":"GM-188","stem":"A 6-month-old has intensely itchy, red, dry, scaly patches on the cheeks and extensor limbs. Diagnosis?","options":[{"letter":"A","text":"Seborrhoeic dermatitis"},{"letter":"B","text":"Eczema"},{"letter":"C","text":"Psoriasis"},{"letter":"D","text":"Tinea corporis"}],"correct":"B","testedConcept":"Infantile atopic eczema","cognitiveTask":"Interpretation","discriminator":"Infant + INTENSE itch + cheeks and extensors = atopic eczema (flexural in older children).","whyCorrect":"Treat with emollients + topical steroids for flares. Atopic march → asthma, allergic rhinitis.","trapType":"Seborrhoeic dermatitis (cradle cap) is greasy, yellow and NOT itchy.","futureAlert":"Treat with emollients + topical steroids for flares. Atopic march → asthma, allergic rhinitis.","reviseTopic":"Internal Medicine","syllabusTopic":"Internal Medicine","correctRule":"Treat with emollients + topical steroids for flares. Atopic march → asthma, allergic rhinitis.","distractors":{"A":"Scalp/napkin area, greasy, non-itchy.","C":"Rare in infants; silvery plaques.","D":"Annular lesion with central clearing."}},{"id":"GM-189","stem":"A 22-year-old is convinced her normal-looking nose is severely deformed and checks it in the mirror for hours daily. Diagnosis?","options":[{"letter":"A","text":"Schizophrenia"},{"letter":"B","text":"Body dysmorphic disorder"},{"letter":"C","text":"Anorexia nervosa"},{"letter":"D","text":"GAD"}],"correct":"B","testedConcept":"Body dysmorphic disorder","cognitiveTask":"Interpretation","discriminator":"Preoccupation with a perceived flaw in a SPECIFIC feature + repetitive checking.","whyCorrect":"BDD is an obsessive-compulsive related disorder → SSRIs + CBT. Cosmetic surgery rarely helps.","trapType":"Anorexia also involves body image, but centres on weight/shape with low BMI.","futureAlert":"BDD is an obsessive-compulsive related disorder → SSRIs + CBT. Cosmetic surgery rarely helps.","reviseTopic":"Internal Medicine","syllabusTopic":"Internal Medicine","correctRule":"BDD is an obsessive-compulsive related disorder → SSRIs + CBT. Cosmetic surgery
