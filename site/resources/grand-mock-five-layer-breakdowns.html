rarely helps.","distractors":{"A":"Hallucinations, delusions, disorganisation.","C":"Weight-focused with restricted intake.","D":"Diffuse worry across many domains."}},{"id":"GM-190","stem":"During halothane and succinylcholine anaesthesia, a 25-year-old develops severe rigidity, temperature 42 °C and tachycardia. Immediate treatment?","options":[{"letter":"A","text":"IV atropine"},{"letter":"B","text":"IM hydrocortisone"},{"letter":"C","text":"IV midazolam"},{"letter":"D","text":"IV dantrolene"}],"correct":"D","testedConcept":"Malignant hyperthermia","cognitiveTask":"Interpretation","discriminator":"Volatile agent + succinylcholine + rigidity + hyperthermia = MH (RYR1 mutation) → dantrolene.","whyCorrect":"Stop triggers, hyperventilate with 100% O₂, dantrolene 2.5 mg/kg IV repeated, active cooling, treat hyperkalaemia.","trapType":"Midazolam treats agitation/seizures but not RyR-mediated calcium release.","futureAlert":"Stop triggers, hyperventilate with 100% O₂, dantrolene 2.5 mg/kg IV repeated, active cooling, treat hyperkalaemia.","reviseTopic":"Internal Medicine","syllabusTopic":"Internal Medicine","correctRule":"Stop triggers, hyperventilate with 100% O₂, dantrolene 2.5 mg/kg IV repeated, active cooling, treat hyperkalaemia.","distractors":{"A":"Treats bradycardia; worsens tachycardia.","B":"No role.","C":"Doesn't block sarcoplasmic calcium release."}},{"id":"GM-191","stem":"A 25-year-old has nocturnal itch with papules and linear burrows in finger webs and wrists. First-line treatment?","options":[{"letter":"A","text":"Oral fluconazole"},{"letter":"B","text":"Topical permethrin 5%"},{"letter":"C","text":"Topical corticosteroids"},{"letter":"D","text":"Oral acyclovir"}],"correct":"B","testedConcept":"Scabies","cognitiveTask":"Interpretation","discriminator":"Night itch + burrows in web spaces = Sarcoptes scabiei → permethrin 5%.","whyCorrect":"Apply neck down, wash off after 8–12 h, repeat in 7 days; treat all close contacts and wash bedding. Crusted scabies → oral ivermectin.","trapType":"Steroids reduce the itch but leave the mites alive.","futureAlert":"Apply neck down, wash off after 8–12 h, repeat in 7 days; treat all close contacts and wash bedding. Crusted scabies → oral ivermectin.","reviseTopic":"Internal Medicine","syllabusTopic":"Internal Medicine","correctRule":"Apply neck down, wash off after 8–12 h, repeat in 7 days; treat all close contacts and wash bedding. Crusted scabies → oral ivermectin.","distractors":{"A":"Antifungal.","C":"Symptomatic only, may worsen infestation.","D":"Antiviral."}},{"id":"GM-192","stem":"A 30-year-old has an itchy circular red trunk patch with raised scaly border and central clearing; KOH shows septate branching hyphae. Treatment?","options":[{"letter":"A","text":"Topical clotrimazole"},{"letter":"B","text":"Topical hydrocortisone"},{"letter":"C","text":"Oral erythromycin"},{"letter":"D","text":"Oral acyclovir"}],"correct":"A","testedConcept":"Tinea corporis","cognitiveTask":"Interpretation","discriminator":"Annular lesion + active edge + hyphae on KOH = dermatophyte → topical azole.","whyCorrect":"Localised tinea → topical azole/terbinafine for 2–4 weeks. Extensive, scalp or nail → oral terbinafine/griseofulvin.","trapType":"Hydrocortisone alone worsens it ('tinea incognito').","futureAlert":"Localised tinea → topical azole/terbinafine for 2–4 weeks. Extensive, scalp or nail → oral terbinafine/griseofulvin.","reviseTopic":"Internal Medicine","syllabusTopic":"Internal Medicine","correctRule":"Localised tinea → topical azole/terbinafine for 2–4 weeks. Extensive, scalp or nail → oral terbinafine/griseofulvin.","distractors":{"B":"Steroid masks and spreads fungal infection.","C":"Antibacterial.","D":"Antiviral."}},{"id":"GM-193","stem":"A 55-year-old has chest pain with ST elevation in I, aVL, V5 and V6. Which artery?","options":[{"letter":"A","text":"Left circumflex"},{"letter":"B","text":"LAD"},{"letter":"C","text":"RCA"},{"letter":"D","text":"PDA"}],"correct":"A","testedConcept":"STEMI territory localisation","cognitiveTask":"Interpretation","discriminator":"I, aVL, V5–V6 = LATERAL wall = left circumflex.","whyCorrect":"Septal V1–V2 (LAD), anterior V3–V4 (LAD), lateral I/aVL/V5–V6 (LCx), inferior II/III/aVF (RCA mostly), posterior V7–V9 / ST depression V1–V3.","trapType":"LAD causes anterior (V1–V4) changes; the high lateral diagonal branch can involve I/aVL but not this full lateral pattern.","futureAlert":"Septal V1–V2 (LAD), anterior V3–V4 (LAD), lateral I/aVL/V5–V6 (LCx), inferior II/III/aVF (RCA mostly), posterior V7–V9 / ST depression V1–V3.","reviseTopic":"Internal Medicine","syllabusTopic":"Internal Medicine","correctRule":"Septal V1–V2 (LAD), anterior V3–V4 (LAD), lateral I/aVL/V5–V6 (LCx), inferior II/III/aVF (RCA mostly), posterior V7–V9 / ST depression V1–V3.","distractors":{"B":"Anterior/septal leads.","C":"Inferior leads.","D":"Inferior/posterior wall."}},{"id":"GM-194","stem":"A 68-year-old has exertional dyspnoea, orthopnoea, PND, basal crackles, raised JVP, displaced apex and reduced EF. Diagnosis?","options":[{"letter":"A","text":"Hyperthyroid heart disease"},{"letter":"B","text":"Dilated cardiomyopathy"},{"letter":"C","text":"MI"},{"letter":"D","text":"Constrictive pericarditis"}],"correct":"B","testedConcept":"Heart failure with reduced EF","cognitiveTask":"Interpretation","discriminator":"Displaced apex (dilated LV) + reduced EF + congestive signs = dilated cardiomyopathy.","whyCorrect":"DCM causes: ischaemic, alcohol, viral myocarditis, peripartum, doxorubicin, genetic. Treat HFrEF: ACEi/ARNI + β-blocker + MRA + SGLT2i.","trapType":"Constrictive pericarditis gives raised JVP but normal-sized heart, preserved EF and Kussmaul sign.","futureAlert":"DCM causes: ischaemic, alcohol, viral myocarditis, peripartum, doxorubicin, genetic. Treat HFrEF: ACEi/ARNI + β-blocker + MRA + SGLT2i.","reviseTopic":"Internal Medicine","syllabusTopic":"Internal Medicine","correctRule":"DCM causes: ischaemic, alcohol, viral myocarditis, peripartum, doxorubicin, genetic. Treat HFrEF: ACEi/ARNI + β-blocker + MRA + SGLT2i.","distractors":{"A":"Hyperthyroid heart disease: AF, high-output state, thyroid signs.","C":"Acute chest pain and ECG/troponin changes not described.","D":"Normal heart size, pericardial knock, preserved EF."}},{"id":"GM-195","stem":"A 25-year-old has haematuria and flank pain, sickle cells on smear and childhood painful episodes. Underlying defect?","options":[{"letter":"A","text":"AR β-globin mutation"},{"letter":"B","text":"AD α-globin mutation"},{"letter":"C","text":"Acquired Hb mutation"},{"letter":"D","text":"B12 deficiency"}],"correct":"A","testedConcept":"Sickle cell disease","cognitiveTask":"Interpretation","discriminator":"Glu → Val point mutation at position 6 of β-globin, autosomal recessive.","whyCorrect":"Renal papillary necrosis → haematuria/flank pain; also hyposthenuria. Hydroxyurea increases HbF.","trapType":"α-globin defects cause α-thalassaemia, not sickling.","futureAlert":"Renal papillary necrosis → haematuria/flank pain; also hyposthenuria. Hydroxyurea increases HbF.","reviseTopic":"Internal Medicine","syllabusTopic":"Internal Medicine","correctRule":"Renal papillary necrosis → haematuria/flank pain; also hyposthenuria. Hydroxyurea increases HbF.","distractors":{"B":"Alpha thalassaemia (and it is AR, not AD).","C":"It is inherited, not acquired.","D":"Causes macrocytic anaemia, not sickling."}},{"id":"GM-196","stem":"A 45-year-old has fatigue, early satiety, massive splenomegaly and WBC 100,000/µL. Characteristic cytogenetic abnormality?","options":[{"letter":"A","text":"t(15;17)"},{"letter":"B","text":"t(9;22)"},{"letter":"C","text":"t(8;14)"},{"letter":"D","text":"t(14;18)"}],"correct":"B","testedConcept":"Chronic myeloid leukaemia","cognitiveTask":"Interpretation","discriminator":"Massive splenomegaly + very high WBC (myeloid left shift) = CML → Philadelphia chromosome t(9;22) BCR-ABL.","whyCorrect":"CML: low LAP score, basophilia. Treat with imatinib (tyrosine kinase inhibitor).","trapType":"Mixing translocations: each one maps to a specific malignancy.","futureAlert":"CML: low LAP score, basophilia. Treat with imatinib (tyrosine kinase inhibitor).","reviseTopic":"Internal Medicine","syllabusTopic":"Internal Medicine","correctRule":"CML: low LAP score, basophilia. Treat with imatinib (tyrosine kinase inhibitor).","distractors":{"A":"APL (AML-M3), treated with ATRA.","C":"Burkitt lymphoma (c-MYC).","D":"Follicular lymphoma (BCL-2)."}},{"id":"GM-197","stem":"Serology: HBsAg +, anti-HBs −, HBeAg +, IgM anti-HBc +. Interpretation?","options":[{"letter":"A","text":"Resolved acute infection"},{"letter":"B","text":"Chronic inactive HBV"},{"letter":"C","text":"Acute HBV with high infectivity"},{"letter":"D","text":"Successful vaccination"}],"correct":"C","testedConcept":"Acute hepatitis B","cognitiveTask":"Interpretation","discriminator":"IgM anti-HBc = ACUTE; HBeAg = active replication/high infectivity.","whyCorrect":"HBeAg = high viral replication. IgM anti-HBc = acute (also flares). Window period: only IgM anti-HBc positive.","trapType":"HBsAg positive could be chronic — the IgM anti-HBc is what makes it acute.","futureAlert":"HBeAg = high viral replication. IgM anti-HBc = acute (also flares). Window period: only IgM anti-HBc positive.","reviseTopic":"Internal Medicine","syllabusTopic":"Internal Medicine","correctRule":"HBeAg = high viral replication. IgM anti-HBc = acute (also flares). Window period: only IgM anti-HBc positive.","distractors":{"A":"HBsAg would be negative with anti-HBs positive.","B":"IgG anti-HBc, HBeAg negative, low DNA.","D":"Only anti-HBs positive."}},{"id":"GM-198","stem":"A 25-year-old has multiple painful genital vesicles and shallow ulcers, tender inguinal nodes and fever. First-line treatment?","options":[{"letter":"A","text":"Oral acyclovir"},{"letter":"B","text":"Topical clotrimazole"},{"letter":"C","text":"Oral azithromycin"},{"letter":"D","text":"IM benzathine penicillin"}],"correct":"A","testedConcept":"Primary genital herpes (HSV-2)","cognitiveTask":"Interpretation","discriminator":"PAINFUL vesicles → shallow ulcers + systemic features = HSV.","whyCorrect":"Painful ulcers: herpes, chancroid (H. ducreyi). Painless: syphilis, LGV, granuloma inguinale. Tzanck smear: multinucleated giant cells.","trapType":"Syphilis ulcer (chancre) is PAINLESS → benzathine penicillin.","futureAlert":"Painful ulcers: herpes, chancroid (H. ducreyi). Painless: syphilis, LGV, granuloma inguinale. Tzanck smear: multinucleated giant cells.","reviseTopic":"Internal Medicine","syllabusTopic":"Internal Medicine","correctRule":"Painful ulcers: herpes, chancroid (H. ducreyi). Painless: syphilis, LGV, granuloma inguinale. Tzanck smear: multinucleated giant cells.","distractors":{"B":"Antifungal for candidiasis.","C":"Chancroid/chlamydia/LGV.","D":"Syphilis (painless chancre)."}},{"id":"GM-199","stem":"A 25-year-old has a painless enlarging neck node, fever, drenching night sweats and weight loss; biopsy shows Reed–Sternberg cells. Diagnosis?","options":[{"letter":"A","text":"NHL"},{"letter":"B","text":"Hodgkin lymphoma"},{"letter":"C","text":"TB lymphadenitis"},{"letter":"D","text":"Metastatic carcinoma"}],"correct":"B","testedConcept":"Hodgkin lymphoma","cognitiveTask":"Interpretation","discriminator":"Reed–Sternberg cells (owl-eye, CD15+/CD30+) are diagnostic.","whyCorrect":"Bimodal age, contiguous spread, alcohol-induced node pain. Nodular sclerosis most common. Treat with ABVD ± radiotherapy.","trapType":"B symptoms occur in NHL and TB too — the RS cell decides it.","futureAlert":"Bimodal age, contiguous spread, alcohol-induced node pain. Nodular sclerosis most common. Treat with ABVD ± radiotherapy.","reviseTopic":"Internal Medicine","syllabusTopic":"Internal Medicine","correctRule":"Bimodal age, contiguous spread, alcohol-induced node pain. Nodular sclerosis most common. Treat with ABVD ± radiotherapy.","distractors":{"A":"No RS cells; non-contiguous spread, extranodal.","C":"Caseating granulomas, not RS cells.","D":"Carcinoma cells, older patients."}},{"id":"GM-200","stem":"An RTA patient needs emergency transfusion without cross-match and can receive any of the four blood groups. Patient's blood group?","options":[{"letter":"A","text":"AB negative"},{"letter":"B","text":"AB positive"},{"letter":"C","text":"O negative"},{"letter":"D","text":"O positive"}],"correct":"B","testedConcept":"Universal recipient","cognitiveTask":"Interpretation","discriminator":"AB+ has A, B and Rh(D) antigens and no anti-A/anti-B antibodies → can receive red cells of any group.","whyCorrect":"Universal red cell donor: O−. Universal red cell recipient: AB+. For plasma it reverses: AB is universal plasma donor.","trapType":"O negative is the universal DONOR — it's what you give when the group is unknown.","futureAlert":"Universal red cell donor: O−. Universal red cell recipient: AB+. For plasma it reverses: AB is universal plasma donor.","reviseTopic":"Internal Medicine","syllabusTopic":"Internal Medicine","correctRule":"Universal red cell donor: O−. Universal red cell recipient: AB+. For plasma it reverses: AB is universal plasma donor.","distractors":{"A":"AB− can receive any ABO group but only Rh-negative blood.","C":"Universal donor; can only receive O−.","D":"Can receive only O+ or O−."}}]};
const KEY = "mcq-progress-" + DATA.slug;
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];

// ---- state ----
let state = { sel:{}, rev:{} };
try { const raw = localStorage.getItem(KEY); if (raw) state = Object.assign({sel:{},rev:{}}, JSON.parse(raw)); } catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

// ---- render ----
function optText(o){ return o.text; }
function build(){
  document.title = DATA.title;
  $("#title").textContent = DATA.subject || "MCQ Set";
  $("#subtitle").textContent = DATA.chapter || "";
  $("#introTitle").textContent = DATA.subject || "Practice Set";
  $("#introSub").textContent = (DATA.chapter||"") + " — " + DATA.questions.length + " single-best-answer questions. Select an option, then reveal to see the explanation and trap.";
  const total = DATA.questions.length;
  $("#total").textContent = total; $("#total2").textContent = total;

  const list = $("#list"); list.innerHTML = "";
  DATA.questions.forEach((q, i) => {
    const card = document.createElement("article");
    card.className = "q"; card.id = "q"+i;
    const revealed = !!state.rev[q.id];
    const chosen = state.sel[q.id] || null;

    const head = document.createElement("div"); head.className="q-head";
    head.innerHTML = `<div class="q-num">${i+1}</div>`;
    const stem = document.createElement("p"); stem.className="q-stem"; stem.textContent = q.stem;
    head.appendChild(stem);
    card.appendChild(head);

    const meta = document.createElement("div"); meta.className="q-meta";
    meta.innerHTML = `<span class="tag">${esc(q.cognitiveTask)}</span><span class="tag">${esc(q.syllabusTopic)}</span>`;
    card.appendChild(meta);

    const opts = document.createElement("div"); opts.className="opts"; opts.setAttribute("role","radiogroup");
    opts.setAttribute("aria-label","Question "+(i+1)+" options");
    q.options.forEach(o => {
      const b = document.createElement("button");
      b.className = "opt"; b.type="button"; b.dataset.letter=o.letter;
      b.setAttribute("role","radio"); b.setAttribute("aria-checked","false");
      const badge = document.createElement("span"); badge.className="badge"; badge.textContent=o.letter;
      const tx = document.createElement("span"); tx.textContent = o.text;
      b.appendChild(badge); b.appendChild(tx);
      if (!revealed && chosen===o.letter) b.classList.add("sel");
      if (revealed){
        b.disabled = true;
        if (o.letter===q.correct) b.classList.add("correct");
        else if (chosen===o.letter) b.classList.add("wrong");
        else b.classList.add("dim");
      }
      b.addEventListener("click", ()=>onSelect(q, o.letter, i));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    const actions = document.createElement("div"); actions.className="q-actions";
    const rb = document.createElement("button"); rb.className="reveal-btn"; rb.textContent = revealed? "Revealed" : "Reveal answer";
    if (revealed){ rb.disabled=true; }
    else rb.addEventListener("click", ()=>onReveal(q, i));
    actions.appendChild(rb);
    if (revealed){
      const v = document.createElement("span"); v.className="verdict "+(chosen===q.correct?"ok":"no");
      v.textContent = chosen===q.correct ? "✓ Correct" : (chosen? "✗ Your answer: "+chosen+" — correct: "+q.correct : "Correct: "+q.correct);
      actions.appendChild(v);
    }
    card.appendChild(actions);

    // explanation
    const ex = document.createElement("div"); ex.className="explain"+(revealed?" show":"");
    ex.appendChild(buildExplain(q, chosen));
    card.appendChild(ex);

    list.appendChild(card);
  });
  updateStats();
}

function buildExplain(q, chosen){
  const wrap = document.createElement("div");
  const h = document.createElement("h4"); h.textContent="Explanation"; wrap.appendChild(h);
  const f = (k,v,cls)=>{
    if (!v) return;
    const d=document.createElement("div"); d.className="field";
    const kk=document.createElement("div"); kk.className="k"; kk.textContent=k;
    const vv=document.createElement("div"); vv.className="v"+(cls?" "+cls:""); vv.textContent=v;
    d.appendChild(kk); d.appendChild(vv); wrap.appendChild(d);
  };
  const correctText = (q.options.find(o=>o.letter===q.correct)||{}).text || "";
  f("Correct answer", q.correct + ") " + correctText);
  f("Why correct", q.whyCorrect);
  f("Discriminator", q.discriminator);
  f("Trap type", q.trapType);
  f("Future alert", q.futureAlert, "alert");
  f("Revise topic", q.reviseTopic);
  f("Syllabus topic", q.syllabusTopic);
  f("Correct rule", q.correctRule);

  const dt = document.createElement("div"); dt.className="distract"; dt.style.marginTop="12px";
  q.options.forEach(o=>{
    const row=document.createElement("div"); row.className="row"+(o.letter===q.correct?" correct":"");
    const dl=document.createElement("div"); dl.className="dl"; dl.textContent=o.letter;
    const dv=document.createElement("div"); dv.className="dv";
    dv.textContent = (o.letter===q.correct) ? "Correct answer." : (q.distractors[o.letter]||"");
    row.appendChild(dl); row.appendChild(dv); dt.appendChild(row);
  });
  wrap.appendChild(dt);
  return wrap;
}

function onSelect(q, letter, i){
  if (state.rev[q.id]) return;
  state.sel[q.id] = letter; save();
  // update UI for this card only
  const card = $("#q"+i);
  $$(".opt", card).forEach(b=>{
    const on = b.dataset.letter===letter;
    b.classList.toggle("sel", on);
    b.setAttribute("aria-checked", on?"true":"false");
  });
  updateStats();
}
function onReveal(q, i){
  state.rev[q.id] = true; save();
  const card = $("#q"+i);
  const chosen = state.sel[q.id] || null;
  $$(".opt", card).forEach(b=>{
    b.disabled=true;
    const L=b.dataset.letter;
    if (L===q.correct) b.classList.add("correct");
    else if (chosen===L) b.classList.add("wrong");
    else b.classList.add("dim");
  });
  const rb = $(".reveal-btn", card); rb.disabled=true; rb.textContent="Revealed";
  const v=document.createElement("span"); v.className="verdict "+(chosen===q.correct?"ok":"no");
  v.textContent = chosen===q.correct ? "✓ Correct" : (chosen? "✗ Your answer: "+chosen+" — correct: "+q.correct : "Correct: "+q.correct);
  $(".q-actions", card).appendChild(v);
  $(".explain", card).classList.add("show");
  updateStats();
}
function revealAll(){
  DATA.questions.forEach((q,i)=>{ state.rev[q.id]=true; });
  save(); build();
}
function resetAll(){
  if (!confirm("Reset all answers and progress for this set?")) return;
  state={sel:{},rev:{}}; save(); build();
}
function updateStats(){
  const total = DATA.questions.length;
  const answered = Object.keys(state.sel).length;
  const revealed = Object.keys(state.rev).length;
  let correct=0; DATA.questions.forEach(q=>{ if(state.rev[q.id] && state.sel[q.id]===q.correct) correct++; });
  $("#ans").textContent = answered;
  $("#score").textContent = correct;
  const pct = total? Math.round((revealed/total)*100):0;
  $("#bar").style.width = pct+"%";
  const banner = $("#banner");
  if (revealed===total && total>0){
    banner.style.display="flex";
    $("#bannerScore").textContent = correct + " / " + total;
  } else banner.style.display="none";
}
function esc(s){ return (s||"").replace(/[&<>]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

$("#revealAll").addEventListener("click", revealAll);
$("#reset").addEventListener("click", resetAll);
$("#bannerReset").addEventListener("click", resetAll);

build();
</script>
</body>
</html>
