 survives ~120 days before splenic removal.","whyCorrect":"HbA1c reflects ~3 months because of the 120-day lifespan; falsely low in haemolysis.","trapType":"Mixing with platelet (7–10 d) or neutrophil (hours) lifespans.","futureAlert":"HbA1c reflects ~3 months because of the 120-day lifespan; falsely low in haemolysis.","reviseTopic":"Applied Physiology","syllabusTopic":"Applied Physiology","correctRule":"HbA1c reflects ~3 months because of the 120-day lifespan; falsely low in haemolysis.","distractors":{"A":"Too short — implies haemolysis.","B":"Too short.","C":"Too short; 90 days is often confused with the HbA1c window."}},{"id":"GM-57","stem":"Which causes a LEFT shift of the O₂–Hb dissociation curve?","options":[{"letter":"A","text":"Increased temperature"},{"letter":"B","text":"Increased 2,3-BPG"},{"letter":"C","text":"Acidosis"},{"letter":"D","text":"Alkalosis"}],"correct":"D","testedConcept":"Oxygen–haemoglobin dissociation curve","cognitiveTask":"Interpretation","discriminator":"Alkalosis (↓H⁺) increases Hb's O₂ affinity → left shift.","whyCorrect":"Right shift (CADET face Right): CO₂, Acid, 2,3-DPG, Exercise, Temperature. Left: opposite + HbF + CO + methaemoglobin.","trapType":"A, B and C all shift RIGHT — the odd one out is the answer.","futureAlert":"Right shift (CADET face Right): CO₂, Acid, 2,3-DPG, Exercise, Temperature. Left: opposite + HbF + CO + methaemoglobin.","reviseTopic":"Applied Physiology","syllabusTopic":"Applied Physiology","correctRule":"Right shift (CADET face Right): CO₂, Acid, 2,3-DPG, Exercise, Temperature. Left: opposite + HbF + CO + methaemoglobin.","distractors":{"A":"Heat shifts right (more O₂ unloading).","B":"2,3-BPG shifts right.","C":"Acidosis shifts right (Bohr effect)."}},{"id":"GM-58","stem":"Pancreatic lipase requires which of the following for optimal activity?","options":[{"letter":"A","text":"Bile salts"},{"letter":"B","text":"Enterokinase"},{"letter":"C","text":"Intrinsic factor"},{"letter":"D","text":"Gastric acid"}],"correct":"A","testedConcept":"Fat digestion","cognitiveTask":"Interpretation","discriminator":"Bile salts emulsify fat, increasing surface area for lipase (with colipase anchoring it).","whyCorrect":"Fat digestion: bile salts (emulsify + micelles) + lipase/colipase. Lack of bile → steatorrhoea.","trapType":"Enterokinase activates trypsinogen, not lipase.","futureAlert":"Fat digestion: bile salts (emulsify + micelles) + lipase/colipase. Lack of bile → steatorrhoea.","reviseTopic":"Applied Physiology","syllabusTopic":"Applied Physiology","correctRule":"Fat digestion: bile salts (emulsify + micelles) + lipase/colipase. Lack of bile → steatorrhoea.","distractors":{"B":"Enterokinase converts trypsinogen to trypsin.","C":"Intrinsic factor is for B12 absorption.","D":"Gastric acid inactivates pancreatic lipase — bicarbonate neutralisation is needed."}},{"id":"GM-59","stem":"The mitral valve is best auscultated at:","options":[{"letter":"A","text":"Right 2nd ICS"},{"letter":"B","text":"Left 2nd ICS"},{"letter":"C","text":"Left 5th ICS, midclavicular line"},{"letter":"D","text":"Left 4th ICS, sternal edge"}],"correct":"C","testedConcept":"Auscultation areas","cognitiveTask":"Interpretation","discriminator":"Mitral area = apex = left 5th ICS, midclavicular line.","whyCorrect":"All Physicians Take Money: Aortic R2, Pulmonary L2, Tricuspid L4/L5 LSE, Mitral L5 MCL.","trapType":"Left 4th ICS at sternal edge is the tricuspid area.","futureAlert":"All Physicians Take Money: Aortic R2, Pulmonary L2, Tricuspid L4/L5 LSE, Mitral L5 MCL.","reviseTopic":"Applied Physiology","syllabusTopic":"Applied Physiology","correctRule":"All Physicians Take Money: Aortic R2, Pulmonary L2, Tricuspid L4/L5 LSE, Mitral L5 MCL.","distractors":{"A":"Aortic area.","B":"Pulmonary area.","D":"Tricuspid area."}},{"id":"GM-60","stem":"Which part of the nephron is impermeable to water?","options":[{"letter":"A","text":"PCT"},{"letter":"B","text":"Descending limb of loop of Henle"},{"letter":"C","text":"Ascending limb of loop of Henle"},{"letter":"D","text":"Collecting duct"}],"correct":"C","testedConcept":"Water handling along the nephron","cognitiveTask":"Interpretation","discriminator":"The thick ascending limb reabsorbs NaCl (NKCC2) but has no aquaporins → the 'diluting segment'.","whyCorrect":"Descending: water out, solute stays. Ascending: solute out, water stays. Loop diuretics block NKCC2 here.","trapType":"Collecting duct is impermeable WITHOUT ADH but becomes permeable with ADH.","futureAlert":"Descending: water out, solute stays. Ascending: solute out, water stays. Loop diuretics block NKCC2 here.","reviseTopic":"Applied Physiology","syllabusTopic":"Applied Physiology","correctRule":"Descending: water out, solute stays. Ascending: solute out, water stays. Loop diuretics block NKCC2 here.","distractors":{"A":"PCT reabsorbs ~65% of water (AQP1).","B":"Descending limb is highly water-permeable.","D":"Collecting duct is water-permeable under ADH (AQP2)."}},{"id":"GM-61","stem":"Which lipoprotein carries out reverse cholesterol transport?","options":[{"letter":"A","text":"Chylomicrons"},{"letter":"B","text":"VLDL"},{"letter":"C","text":"LDL"},{"letter":"D","text":"HDL"}],"correct":"D","testedConcept":"Lipoprotein functions","cognitiveTask":"Interpretation","discriminator":"HDL collects cholesterol from tissues (via LCAT, ABCA1) and returns it to the liver.","whyCorrect":"Chylomicrons: dietary TG. VLDL: hepatic TG. LDL: cholesterol to tissues ('bad'). HDL: tissues to liver ('good').","trapType":"LDL moves cholesterol the opposite way — liver to tissues.","futureAlert":"Chylomicrons: dietary TG. VLDL: hepatic TG. LDL: cholesterol to tissues ('bad'). HDL: tissues to liver ('good').","reviseTopic":"Biochemistry","syllabusTopic":"Biochemistry","correctRule":"Chylomicrons: dietary TG. VLDL: hepatic TG. LDL: cholesterol to tissues ('bad'). HDL: tissues to liver ('good').","distractors":{"A":"Chylomicrons carry dietary fat from gut.","B":"VLDL carries endogenous TG from liver.","C":"LDL delivers cholesterol to peripheral tissues."}},{"id":"GM-62","stem":"A patient on long-term fat-free parenteral nutrition develops dermatitis, hair loss and thrombocytopenia. Deficiency of?","options":[{"letter":"A","text":"Linoleic and linolenic acid"},{"letter":"B","text":"Oleic and palmitic acid"},{"letter":"C","text":"Stearic and arachidic acid"},{"letter":"D","text":"Cholesterol and phospholipids"}],"correct":"A","testedConcept":"Essential fatty acid deficiency","cognitiveTask":"Interpretation","discriminator":"Fat-free TPN + scaly dermatitis + alopecia + thrombocytopenia = EFA deficiency.","whyCorrect":"Essential: linoleic (ω-6) and α-linolenic (ω-3). Prevent with lipid emulsion in TPN.","trapType":"Choosing other fatty acids — the body can make them.","futureAlert":"Essential: linoleic (ω-6) and α-linolenic (ω-3). Prevent with lipid emulsion in TPN.","reviseTopic":"Biochemistry","syllabusTopic":"Biochemistry","correctRule":"Essential: linoleic (ω-6) and α-linolenic (ω-3). Prevent with lipid emulsion in TPN.","distractors":{"B":"Oleic and palmitic acid are synthesised endogenously.","C":"Saturated fatty acids are non-essential.","D":"Cholesterol and phospholipids are synthesised by the body."}},{"id":"GM-63","stem":"Most characteristic feature of kwashiorkor?","options":[{"letter":"A","text":"Severe wasting with fat loss"},{"letter":"B","text":"Bilateral pitting oedema"},{"letter":"C","text":"Muscle hypertrophy"},{"letter":"D","text":"Normal albumin"}],"correct":"B","testedConcept":"Kwashiorkor vs marasmus","cognitiveTask":"Interpretation","discriminator":"Protein deficiency → low albumin → OEDEMA, the defining sign.","whyCorrect":"Kwashiorkor: oedema, flaky-paint dermatosis, fatty liver, flag sign hair, ↓ albumin. Marasmus: 'skin and bones', no oedema.","trapType":"Severe wasting is marasmus (energy deficiency).","futureAlert":"Kwashiorkor: oedema, flaky-paint dermatosis, fatty liver, flag sign hair, ↓ albumin. Marasmus: 'skin and bones', no oedema.","reviseTopic":"Biochemistry","syllabusTopic":"Biochemistry","correctRule":"Kwashiorkor: oedema, flaky-paint dermatosis, fatty liver, flag sign hair, ↓ albumin. Marasmus: 'skin and bones', no oedema.","distractors":{"A":"That is marasmus.","C":"Muscle wasting, not hypertrophy, occurs.","D":"Albumin is low — that causes the oedema."}},{"id":"GM-64","stem":"A chronic alcoholic has confusion, ataxia and ophthalmoplegia, then memory loss with confabulation. Which vitamin?","options":[{"letter":"A","text":"Thiamine"},{"letter":"B","text":"Niacin"},{"letter":"C","text":"Pyridoxine"},{"letter":"D","text":"Cobalamin"}],"correct":"A","testedConcept":"Wernicke–Korsakoff syndrome","cognitiveTask":"Interpretation","discriminator":"Triad (confusion, ataxia, ophthalmoplegia) → Korsakoff (amnesia + confabulation) = B1 deficiency.","whyCorrect":"Give IV thiamine BEFORE glucose in alcoholics to avoid precipitating Wernicke's.","trapType":"Niacin deficiency (pellagra) also causes dementia in alcoholics but with dermatitis and diarrhoea.","futureAlert":"Give IV thiamine BEFORE glucose in alcoholics to avoid precipitating Wernicke's.","reviseTopic":"Biochemistry","syllabusTopic":"Biochemistry","correctRule":"Give IV thiamine BEFORE glucose in alcoholics to avoid precipitating Wernicke's.","distractors":{"B":"Niacin → pellagra (dermatitis, diarrhoea, dementia).","C":"B6 → peripheral neuropathy, seizures, sideroblastic anaemia.","D":"B12 → megaloblastic anaemia, SACD of the cord."}},{"id":"GM-65","stem":"Major rate-limiting enzyme of the Krebs cycle?","options":[{"letter":"A","text":"Citrate synthase"},{"letter":"B","text":"Aconitase"},{"letter":"C","text":"Isocitrate dehydrogenase"},{"letter":"D","text":"Succinate dehydrogenase"}],"correct":"C","testedConcept":"Rate-limiting enzymes","cognitiveTask":"Interpretation","discriminator":"Isocitrate dehydrogenase — activated by ADP, inhibited by ATP/NADH.","whyCorrect":"Glycolysis: PFK-1. TCA: isocitrate DH. Gluconeogenesis: F-1,6-bisphosphatase. Cholesterol: HMG-CoA reductase. Urea: CPS-I.","trapType":"Citrate synthase is the first enzyme and regulated, but not the main rate-limiting step.","futureAlert":"Glycolysis: PFK-1. TCA: isocitrate DH. Gluconeogenesis: F-1,6-bisphosphatase. Cholesterol: HMG-CoA reductase. Urea: CPS-I.","reviseTopic":"Biochemistry","syllabusTopic":"Biochemistry","correctRule":"Glycolysis: PFK-1. TCA: isocitrate DH. Gluconeogenesis: F-1,6-bisphosphatase. Cholesterol: HMG-CoA reductase. Urea: CPS-I.","distractors":{"A":"Regulated, but not the principal rate-limiting step.","B":"Aconitase is not a control point.","D":"Succinate DH is also complex II; not rate-limiting."}},{"id":"GM-66","stem":"In MSUD (neurotoxicity, poor development, burnt-sugar urine), which amino acid is most responsible for neurotoxicity?","options":[{"letter":"A","text":"Leucine"},{"letter":"B","text":"Phenylalanine"},{"letter":"C","text":"Tyrosine"},{"letter":"D","text":"Methionine"}],"correct":"A","testedConcept":"Maple syrup urine disease","cognitiveTask":"Interpretation","discriminator":"Branched-chain α-ketoacid dehydrogenase defect → leucine (and its ketoacid) is the main neurotoxin.","whyCorrect":"MSUD branched chains: 'I Love Vermont' maple syrup — Isoleucine, Leucine, Valine. Needs thiamine as a cofactor.","trapType":"Phenylalanine causes neurotoxicity in PKU, a different disorder.","futureAlert":"MSUD branched chains: 'I Love Vermont' maple syrup — Isoleucine, Leucine, Valine. Needs thiamine as a cofactor.","reviseTopic":"Biochemistry","syllabusTopic":"Biochemistry","correctRule":"MSUD branched chains: 'I Love Vermont' maple syrup — Isoleucine, Leucine, Valine. Needs thiamine as a cofactor.","distractors":{"B":"Phenylalanine → PKU (musty odour).","C":"Tyrosine accumulates in tyrosinaemia.","D":"Methionine relates to homocystinuria."}},{"id":"GM-67","stem":"A 50-year-old has severe RUQ pain radiating to the right shoulder, fever and jaundice. Ultrasound shows gallstones and a thickened gallbladder wall. Most likely diagnosis?","options":[{"letter":"A","text":"Biliary colic"},{"letter":"B","text":"Acute cholecystitis"},{"letter":"C","text":"Cholangitis"},{"letter":"D","text":"Acute pancreatitis"}],"correct":"B","testedConcept":"Gallstone disease spectrum","cognitiveTask":"Interpretation","discriminator":"Ultrasound evidence of gallbladder inflammation (thickened wall + stones) with fever points to acute cholecystitis.","whyCorrect":"Colic: pain only. Cholecystitis: pain + fever + Murphy's ± mild jaundice (Mirizzi). Cholangitis: Charcot's triad + dilated CBD. Pancreatitis: epigastric pain to back + raised lipase.","trapType":"Pain + fever + jaundice is also Charcot's triad (cholangitis), which would show a dilated CBD on ultrasound rather than GB wall thickening.","futureAlert":"Colic: pain only. Cholecystitis: pain + fever + Murphy's ± mild jaundice (Mirizzi). Cholangitis: Charcot's triad + dilated CBD. Pancreatitis: epigastric pain to back + raised lipase.","reviseTopic":"Surgery","syllabusTopic":"Surgery","correctRule":"Colic: pain only. Cholecystitis: pain + fever + Murphy's ± mild jaundice (Mirizzi). Cholangitis: Charcot's triad + dilated CBD. Pancreatitis: epigastric pain to back + raised lipase.","distractors":{"A":"Biliary colic has no fever or wall thickening.","C":"Cholangitis would show CBD dilatation/stone; the scan here describes the gallbladder.","D":"Pancreatitis pain is epigastric radiating to the back."}},{"id":"GM-68","stem":"A 45-year-old with PUD has sudden severe epigastric pain, board-like rigidity and free air under the diaphragm. Complication?","options":[{"letter":"A","text":"Gastric outlet obstruction"},{"letter":"B","text":"Perforated peptic ulcer"},{"letter":"C","text":"Upper GI bleed"},{"letter":"D","text":"Penetration into pancreas"}],"correct":"B","testedConcept":"Perforated peptic ulcer","cognitiveTask":"Interpretation","discriminator":"Pneumoperitoneum (free air) + generalised peritonitis = perforation.","whyCorrect":"Erect CXR for free air → resuscitate → laparotomy/laparoscopic omental (Graham) patch.","trapType":"Posterior penetration into the pancreas causes back pain but no free air.","futureAlert":"Erect CXR for free air → resuscitate → laparotomy/laparoscopic omental (Graham) patch.","reviseTopic":"Surgery","syllabusTopic":"Surgery","correctRule":"Erect CXR for free air → resuscitate → laparotomy/laparoscopic omental (Graham) patch.","distractors":{"A":"GOO: projectile vomiting, succussion splash, hypokalaemic alkalosis.","C":"Bleeding: haematemesis/melaena, not free air.","D":"Penetration: back pain, raised amylase, no pneumoperitoneum."}},{"id":"GM-69","stem":"A 70-year-old has 2 weeks of progressive confusion and mild left weakness after a minor fall 3 weeks ago. CT shows a crescent-shaped collection over the right hemisphere. Diagnosis?","options":[{"letter":"A","text":"Epidural haematoma"},{"letter":"B","text":"Acute subdural"},{"letter":"C","text":"Chronic subdural"},{"letter":"D","text":"SAH"}],"correct":"C","testedConcept":"Chronic subdural haematoma","cognitiveTask":"Interpretation","discriminator":"Elderly + trivial fall weeks earlier + slow fluctuating confusion + crescent = chronic SDH (bridging vein tear).","whyCorrect":"Crescent (crosses sutures) = subdural; lens/biconvex (stops at sutures) = extradural. Chronic SDH → burr-hole drainage.","trapType":"The source says 'hyperdense' (which fits acute), but the 3-week timeline makes it chronic; chronic SDH is usually hypodense.","futureAlert":"Crescent (crosses sutures) = subdural; lens/biconvex (stops at sutures) = extradural. Chronic SDH → burr-hole drainage.","reviseTopic":"Surgery","syllabusTopic":"Surgery","correctRule":"Crescent (crosses sutures) = subdural; lens/biconvex (stops at sutures) = extradural. Chronic SDH → burr-hole drainage.","distractors":{"A":"EDH is lens-shaped, follows high-energy trauma with lucid interval and rapid decline.","B":"Acute SDH presents within 72 h of significant trauma.","D":"SAH: thunderclap headache, blood in sulci/cisterns."}},{"id":"GM-70","stem":"A 45-year-old alcoholic has epigastric pain radiating to the back, vomiting, low fever and bluish flank discolouration. Most suggestive of?","options":[{"letter":"A","text":"Acute cholecystitis"},{"letter":"B","text":"Severe acute pancreatitis"},{"letter":"C","text":"Ruptured AAA"},{"letter":"D","text":"Perforated DU"}],"correct":"B","testedConcept":"Grey Turner's sign","cognitiveTask":"Interpretation","discriminator":"Alcohol + epigastric pain to back + flank bruising = haemorrhagic (severe) pancreatitis.","whyCorrect":"Grey Turner = flank; Cullen = periumbilical — both signal retroperitoneal haemorrhage, severe pancreatitis.","trapType":"Ruptured AAA can cause flank bruising but presents with shock and pulsatile mass in older men, without alcohol/vomiting context.","futureAlert":"Grey Turner = flank; Cullen = periumbilical — both signal retroperitoneal haemorrhage, severe pancreatitis.","reviseTopic":"Surgery","syllabusTopic":"Surgery","correctRule":"Grey Turner = flank; Cullen = periumbilical — both signal retroperitoneal haemorrhage, severe pancreatitis.","distractors":{"A":"Cholecystitis: RUQ pain, Murphy's sign, no flank bruising.","C":"AAA rupture: elderly, collapse, pulsatile mass.","D":"Perforated DU: board-like rigidity and free air."}},{"id":"GM-71","stem":"A 40-year-old has throbbing perianal pain, fever and a tender fluctuant swelling near the anal verge. Immediate management?","options":[{"letter":"A","text":"Oral antibiotics alone"},{"letter":"B","text":"Sitz baths and analgesia"},{"letter":"C","text":"Incision and drainage"},{"letter":"D","text":"Topical steroids"}],"correct":"C","testedConcept":"Perianal abscess","cognitiveTask":"Interpretation","discriminator":"Fluctuant = pus collection → needs drainage.","whyCorrect":"'Where there is pus, let it out.' Antibiotics only for cellulitis, diabetes or immunosuppression.","trapType":"Antibiotics alone don't penetrate an abscess cavity.","futureAlert":"'Where there is pus, let it out.' Antibiotics only for cellulitis, diabetes or immunosuppression.","reviseTopic":"Surgery","syllabusTopic":"Surgery","correctRule":"'Where there is pus, let it out.' Antibiotics only for cellulitis, diabetes or immunosuppression.","distractors":{"A":"Inadequate without drainage.","B":"Supportive only; delays definitive treatment.","D":"Steroids worsen infection."}},{"id":"GM-72","stem":"A 28-year-old has recurrent RLQ pain, diarrhoea, weight loss and an RIF mass; colonoscopy shows skip lesions, transmural inflammation and non-caseating granulomas. Most characteristic complication?","options":[{"letter":"A","text":"Toxic megacolon"},{"letter":"B","text":"Pseudopolyps"},{"letter":"C","text":"Bloody diarrhoea"},{"letter":"D","text":"Fistula formation"}],"correct":"D","testedConcept":"Crohn's disease","cognitiveTask":"Interpretation","discriminator":"TRANSMURAL inflammation is what lets Crohn's tunnel through to form fistulae.","whyCorrect":"Crohn's: skip lesions, cobblestone, granulomas, fistulae, strictures, perianal disease. UC: continuous, mucosal, rectum up, toxic megacolon, PSC.","trapType":"Toxic megacolon, pseudopolyps and bloody diarrhoea are classic for ulcerative colitis.","futureAlert":"Crohn's: skip lesions, cobblestone, granulomas, fistulae, strictures, perianal disease. UC: continuous, mucosal, rectum up, toxic megacolon, PSC.","reviseTopic":"Surgery","syllabusTopic":"Surgery","correctRule":"Crohn's: skip lesions, cobblestone, granulomas, fistulae, strictures, perianal disease. UC: continuous, mucosal, rectum up, toxic megacolon, PSC.","distractors":{"A":"Toxic megacolon is characteristic of UC.","B":"Pseudopolyps are characteristic of UC.","C":"Bloody diarrhoea is typical of UC."}},{"id":"GM-73","stem":"A 45-year-old with recurrent UTIs has flank pain and fever; imaging shows a staghorn calculus; urine grows Proteus mirabilis. Stone composition?","options":[{"letter":"A","text":"Calcium oxalate"},{"letter":"B","text":"Uric acid"},{"letter":"C","text":"Struvite"},{"letter":"D","text":"Cystine"}],"correct":"C","testedConcept":"Infection (struvite) stones","cognitiveTask":"Interpretation","discriminator":"Urease-producing Proteus → alkaline urine → magnesium ammonium phosphate (struvite) → staghorn.","whyCorrect":"Struvite: urease organisms, alkaline urine, staghorn, coffin-lid crystals → PCNL + treat infection.","trapType":"Calcium oxalate is the most common stone overall, but not the infection/staghorn stone.","futureAlert":"Struvite: urease organisms, alkaline urine, staghorn, coffin-lid crystals → PCNL + treat infection.","reviseTopic":"Surgery","syllabusTopic":"Surgery","correctRule":"Struvite: urease organisms, alkaline urine, staghorn, coffin-lid crystals → PCNL + treat infection.","distractors":{"A":"Most common stone overall; not linked to Proteus.","B":"Uric acid stones form in acidic urine, radiolucent (gout, tumour lysis).","D":"Cystine stones: hexagonal crystals, inherited cystinuria, young patients."}},{"id":"GM-74","stem":"A 35-year-old has painless bright red rectal bleeding and a soft reducible swelling at the anal margin. Type of haemorrhoid?","options":[{"letter":"A","text":"Internal"},{"letter":"B","text":"External"},{"letter":"C","text":"Thrombosed external"},{"letter":"D","text":"Strangulated internal"}],"correct":"A","testedConcept":"Internal vs external haemorrhoids","cognitiveTask":"Interpretation","discriminator":"PAINLESS bleeding + prolapse that reduces = internal haemorrhoid (above dentate line, visceral innervation).","whyCorrect":"Internal grades: I bleed only; II prolapse, reduce spontaneously; III manual reduction; IV irreducible. External: below dentate line, painful when thrombosed.","trapType":"'Swelling at the anal margin' tempts external, but external haemorrhoids are painful and don't bleed painlessly with reduction.","futureAlert":"Internal grades: I bleed only; II prolapse, reduce spontaneously; III manual reduction; IV irreducible. External: below dentate line, painful when thrombosed.","reviseTopic":"Surgery","syllabusTopic":"Surgery","correctRule":"Internal grades: I bleed only; II prolapse, reduce spontaneously; III manual reduction; IV irreducible. External: below dentate line, painful when thrombosed.","distractors":{"B":"External haemorrhoids are covered by sensitive anoderm — painful.","C":"Thrombosed external: acute, very painful, bluish lump.","D":"Strangulated: irreducible, severely painful, dusky."}},{"id":"GM-75","stem":"A 40-year-old with a treated perianal abscess has persistent purulent discharge from a small opening near the anal verge. Diagnosis?","options":[{"letter":"A","text":"Anal fissure"},{"letter":"B","text":"Recurrent abscess"},{"letter":"C","text":"Fistula-in-ano"},{"letter":"D","text":"Thrombosed haemorrhoid"}],"correct":"C","testedConcept":"Fistula-in-ano","cognitiveTask":"Interpretation","discriminator":"Chronic discharge from an external opening after an abscess = fistula connecting anal canal to skin.","whyCorrect":"~1/3 of perianal abscesses lead to fistulae. Goodsall's rule predicts the tract. Treat with fistulotomy or seton.","trapType":"Recurrent abscess presents with pain and swelling, not a persistent draining opening.","futureAlert":"~1/3 of perianal abscesses lead to fistulae. Goodsall's rule predicts the tract. Treat with fistulotomy or seton.","reviseTopic":"Surgery","syllabusTopic":"Surgery","correctRule":"~1/3 of perianal abscesses lead to fistulae. Goodsall's rule predicts the tract. Treat with fistulotomy or seton.","distractors":{"A":"Fissure: pain on defecation, posterior midline tear, no discharge tract.","B":"Abscess: acute painful fluctuant swelling.","D":"Thrombosed haemorrhoid: painful bluish lump, no discharging opening."}},{"id":"GM-76","stem":"A 72-year-old has PSA 18 ng/mL and a hard nodular prostate on DRE. Investigation to confirm diagnosis?","options":[{"letter":"A","text":"Repeat PSA"},{"letter":"B","text":"TRUS-guided prostate biopsy"},{"letter":"C","text":"Bone scan"},{"letter":"D","text":"CT abdomen/pelvis"}],"correct":"B","testedConcept":"Diagnosis of prostate cancer","cognitiveTask":"Interpretation","discriminator":"'Confirm' = tissue diagnosis → biopsy (Gleason grading).","whyCorrect":"Raised PSA/abnormal DRE → mpMRI → targeted (TRUS/transperineal) biopsy → stage with bone scan/CT if high risk.","trapType":"Bone scan and CT are for STAGING once cancer is confirmed.","futureAlert":"Raised PSA/abnormal DRE → mpMRI → targeted (TRUS/transperineal) biopsy → stage with bone scan/CT if high risk.","reviseTopic":"Surgery","syllabusTopic":"Surgery","correctRule":"Raised PSA/abnormal DRE → mpMRI → targeted (TRUS/transperineal) biopsy → stage with bone scan/CT if high risk.","distractors":{"A":"Repeating PSA delays diagnosis with a hard nodular gland already present.","C":"Bone scan stages metastases; doesn't confirm cancer.","D":"CT stages nodal spread; doesn't confirm cancer."}},{"id":"GM-77","stem":"Which is a surgical airway?","options":[{"letter":"A","text":"Orotracheal intubation"},{"letter":"B","text":"Nasotracheal intubation"},{"letter":"C","text":"Cricothyrotomy"},{"letter":"D","text":"Bag-mask ventilation"}],"correct":"C","testedConcept":"Definitive and surgical airways","cognitiveTask":"Interpretation","discriminator":"Surgical airway = an incision through the neck (cricothyroid membrane).","whyCorrect":"'Can't intubate, can't oxygenate' → surgical cricothyrotomy. Children <12 y → needle cricothyrotomy.","trapType":"Intubation is a DEFINITIVE airway, but not a surgical one.","futureAlert":"'Can't intubate, can't oxygenate' → surgical cricothyrotomy. Children <12 y → needle cricothyrotomy.","reviseTopic":"Surgery","syllabusTopic":"Surgery","correctRule":"'Can't intubate, can't oxygenate' → surgical cricothyrotomy. Children <12 y → needle cricothyrotomy.","distractors":{"A":"Definitive, non-surgical.","B":"Definitive, non-surgical.","D":"Basic airway support — not definitive or surgical."}},{"id":"GM-78","stem":"Most common cause of obstructive shock among the options?","options":[{"letter":"A","text":"Massive MI"},{"letter":"B","text":"Cardiac tamponade"},{"letter":"C","text":"Severe sepsis"},{"letter":"D","text":"Anaphylaxis"}],"correct":"B","testedConcept":"Classification of shock","cognitiveTask":"Interpretation","discriminator":"Obstructive shock = mechanical block to filling/outflow — tamponade, tension pneumothorax, massive PE.","whyCorrect":"Hypovolaemic (blood/fluid loss), cardiogenic (pump), obstructive (tamponade/tension/PE), distributive (sepsis/anaphylaxis/neurogenic).","trapType":"Massive MI causes cardiogenic (pump failure) shock, not obstructive.","futureAlert":"Hypovolaemic (blood/fluid loss), cardiogenic (pump), obstructive (tamponade/tension/PE), distributive (sepsis/anaphylaxis/neurogenic).","reviseTopic":"Surgery","syllabusTopic":"Surgery","correctRule":"Hypovolaemic (blood/fluid loss), cardiogenic (pump), obstructive (tamponade/tension/PE), distributive (sepsis/anaphylaxis/neurogenic).","distractors":{"A":"MI → cardiogenic shock.","C":"Sepsis → distributive shock.","D":"Anaphylaxis → distributive shock."}},{"id":"GM-79","stem":"A 65-year-old has sudden painless massive lower GI bleeding; colonoscopy shows sigmoid diverticula with active bleeding from one. Diagnosis?","options":[{"letter":"A","text":"Diverticulitis"},{"letter":"B","text":"Colorectal cancer"},{"letter":"C","text":"Ischaemic colitis"},{"letter":"D","text":"Bleeding diverticulosis"}],"correct":"D","testedConcept":"Diverticular bleeding","cognitiveTask":"Interpretation","discriminator":"PAINLESS massive bleed from a diverticulum = diverticulosis (vasa recta rupture).","whyCorrect":"Diverticulosis bleeds; diverticulitis inflames. Most common cause of massive LGIB in the elderly.","trapType":"Diverticulitis is painful with fever and rarely bleeds massively.","futureAlert":"Diverticulosis bleeds; diverticulitis inflames. Most common cause of massive LGIB in the elderly.","reviseTopic":"Surgery","syllabusTopic":"Surgery","correctRule":"Diverticulosis bleeds; diverticulitis inflames. Most common cause of massive LGIB in the elderly.","distractors":{"A":"Diverticulitis: LIF pain, fever, raised WBC, minimal bleeding.","B":"Cancer: occult/slow bleeding, change in bowel habit.","C":"Ischaemic colitis: crampy pain then bloody diarrhoea."}},{"id":"GM-80","stem":"Most common cause of distributive shock?","options":[{"letter":"A","text":"Sepsis"},{"letter":"B","text":"Hypovolaemia"},{"letter":"C","text":"Pleural effusion"},{"letter":"D","text":"Allergy"}],"correct":"A","testedConcept":"Distributive shock","cognitiveTask":"Interpretation","discriminator":"Sepsis is by far the most common cause of vasodilatory (distributive) shock.","whyCorrect":"Septic shock: hypotension needing vasopressors to keep MAP ≥65 + lactate >2 despite fluids. Norepinephrine first-line.","trapType":"Allergy (anaphylaxis) is distributive too, but far less common.","futureAlert":"Septic shock: hypotension needing vasopressors to keep MAP ≥65 + lactate >2 despite fluids. Norepinephrine first-line.","reviseTopic":"Surgery","syllabusTopic":"Surgery","correctRule":"Septic shock: hypotension needing vasopressors to keep MAP ≥65 + lactate >2 despite fluids. Norepinephrine first-line.","distractors":{"B":"Hypovolaemia is its own category of shock.","C":"Pleural effusion is not a shock cause (tension pneumothorax would be obstructive).","D":"Anaphylaxis is distributive but less common than sepsis."}},{"id":"GM-81","stem":"A 55-year-old has iron-deficiency anaemia and an RIF mass; colonoscopy shows an ulcerated caecal lesion. Most common histology?","options":[{"letter":"A","text":"SCC"},{"letter":"B","text":"Adenocarcinoma"},{"letter":"C","text":"Carcinoid"},{"letter":"D","text":"Lymphoma"}],"correct":"B","testedConcept":"Right-sided colon cancer","cognitiveTask":"Interpretation","discriminator":">95% of colorectal cancers are adenocarcinoma; right-sided ones present with occult bleeding/anaemia and a mass.","whyCorrect":"Right colon: anaemia, mass, late obstruction. Left colon: altered bowel habit, obstruction, PR blood.","trapType":"Carcinoid is classically appendiceal/ileal but rare as a caecal ulcerating mass.","futureAlert":"Right colon: anaemia, mass, late obstruction. Left colon: altered bowel habit, obstruction, PR blood.","reviseTopic":"Surgery","syllabusTopic":"Surgery","correctRule":"Right colon: anaemia, mass, late obstruction. Left colon: altered bowel habit, obstruction, PR blood.","distractors":{"A":"SCC arises in the anal canal, not the caecum.","C":"Carcinoids are rare and usually small, appendix/ileum.","D":"Colonic lymphoma is uncommon."}},{"id":"GM-82","stem":"A 45-year-old returns 4 weeks after acute pancreatitis with persistent pain, an epigastric mass and raised amylase; CT shows a fluid collection with a well-defined wall. Complication?","options":[{"letter":"A","text":"Pseudocyst"},{"letter":"B","text":"Pancreatic abscess"},{"letter":"C","text":"Walled-off necrosis"},{"letter":"D","text":"Splenic vein thrombosis"}],"correct":"A","testedConcept":"Revised Atlanta classification of collections","cognitiveTask":"Interpretation","discriminator":"≥4 weeks + well-defined wall + persistently raised amylase = pseudocyst (wall of granulation/fibrous tissue, not epithelium).","whyCorrect":"<4 w: acute peripancreatic fluid collection. ≥4 w: pseudocyst (fluid only) or WON (necrotic debris). Drain if symptomatic/>6 cm (endoscopic cystgastrostomy).","trapType":"Walled-off necrosis also forms at ≥4 weeks but follows necrotising pancreatitis and contains solid debris.","futureAlert":"<4 w: acute peripancreatic fluid collection. ≥4 w: pseudocyst (fluid only) or WON (necrotic debris). Drain if symptomatic/>6 cm (endoscopic cystgastrostomy).","reviseTopic":"Surgery","syllabusTopic":"Surgery","correctRule":"<4 w: acute peripancreatic fluid collection. ≥4 w: pseudocyst (fluid only) or WON (necrotic debris). Drain if symptomatic/>6 cm (endoscopic cystgastrostomy).","distractors":{"B":"Abscess: fever, sepsis, gas in collection.","C":"WON contains solid necrotic material and follows necrotising disease.","D":"Splenic vein thrombosis causes gastric varices, not a mass."}},{"id":"GM-83","stem":"A 65-year-old has nocturia and hesitancy; DRE shows a smooth, rubbery, symmetrically enlarged prostate with preserved median sulcus. Diagnosis?","options":[{"letter":"A","text":"Carcinoma"},{"letter":"B","text":"BPH"},{"letter":"C","text":"Acute prostatitis"},{"letter":"D","text":"Prostatic abscess"}],"correct":"B","testedConcept":"BPH on DRE","cognitiveTask":"Interpretation","discriminator":"Smooth + rubbery + symmetrical + sulcus preserved = benign.","whyCorrect":"BPH arises in the transition zone; cancer in the peripheral zone (palpable on DRE). Treat BPH with α-blocker ± 5α-reductase inhibitor.","trapType":"Carcinoma is hard, nodular, irregular with obliterated sulcus.","futureAlert":"BPH arises in the transition zone; cancer in the peripheral zone (palpable on DRE). Treat BPH with α-blocker ± 5α-reductase inhibitor.","reviseTopic":"Surgery","syllabusTopic":"Surgery","correctRule":"BPH arises in the transition zone; cancer in the peripheral zone (palpable on DRE). Treat BPH with α-blocker ± 5α-reductase inhibitor.","distractors":{"A":"Cancer: hard, nodular, asymmetric.","C":"Prostatitis: exquisitely tender, boggy, febrile.","D":"Abscess: fluctuant, tender, septic."}},{"id":"GM-84","stem":"A 40-year-old has a 7×7 cm left upper quadrant breast lump with no axillary nodes. Likely diagnosis?","options":[{"letter":"A","text":"Phyllodes tumour"},{"letter":"B","text":"Duct ectasia"},{"letter":"C","text":"Fibrocystic disease"},{"letter":"D","text":"Paget's disease"}],"correct":"A","testedConcept":"Phyllodes tumour","cognitiveTask":"Interpretation","discriminator":"Large (>5 cm), rapidly growing, mobile lump in 40s without nodal spread (spreads haematogenously) = phyllodes.","whyCorrect":"Phyllodes: leaf-like stroma, 'giant fibroadenoma', treat by wide local excision with ≥1 cm margins; axillary clearance not needed.","trapType":"Fibroadenoma is similar but smaller and in younger women.","futureAlert":"Phyllodes: leaf-like stroma, 'giant fibroadenoma', treat by wide local excision with ≥1 cm margins; axillary clearance not needed.","reviseTopic":"Surgery","syllabusTopic":"Surgery","correctRule":"Phyllodes: leaf-like stroma, 'giant fibroadenoma', treat by wide local excision with ≥1 cm margins; axillary clearance not needed.","distractors":{"B":"Duct ectasia: nipple discharge/retraction in perimenopause, not a large mass.","C":"Fibrocystic change: cyclical pain, lumpy breasts, not a 7 cm discrete mass.","D":"Paget's: eczematous nipple change."}},{"id":"GM-85","stem":"Which polyp is most likely to harbour malignancy?","options":[{"letter":"A","text":"Hamartomatous"},{"letter":"B","text":"Inflammatory"},{"letter":"C","text":"Tubular adenoma"},{"letter":"D","text":"Villous adenoma"}],"correct":"D","testedConcept":"Malignant potential of colorectal polyps","cognitiveTask":"Interpretation","discriminator":"Villous architecture carries the highest cancer risk (~40%).","whyCorrect":"Malignancy risk ↑ with size >2 cm, villous histology, high-grade dysplasia, sessile shape. Villous adenoma may cause hypokalaemia.","trapType":"Tubular adenomas are the most COMMON adenoma but lowest risk.","futureAlert":"Malignancy risk ↑ with size >2 cm, villous histology, high-grade dysplasia, sessile shape. Villous adenoma may cause hypokalaemia.","reviseTopic":"Surgery","syllabusTopic":"Surgery","correctRule":"Malignancy risk ↑ with size >2 cm, villous histology, high-grade dysplasia, sessile shape. Villous adenoma may cause hypokalaemia.","distractors":{"A":"Hamartomatous (Peutz–Jeghers, juvenile) — low individual risk.","B":"Inflammatory pseudopolyps — no malignant potential.","C":"Tubular — common but least malignant adenoma."}},{"id":"GM-86","stem":"A cirrhotic admitted with haematemesis has multiple areas of punctate erythema on OGD. Best step to prevent rebleeding?","options":[{"letter":"A","text":"Antacids"},{"letter":"B","text":"Omeprazole"},{"letter":"C","text":"Propranolol"},{"letter":"D","text":"Ranitidine"}],"correct":"C","testedConcept":"Portal hypertensive gastropathy","cognitiveTask":"Interpretation","discriminator":"Punctate erythema/mosaic pattern in cirrhosis = portal hypertensive gastropathy — a portal pressure problem, not an acid problem.","whyCorrect":"PHG and varices: non-selective β-blocker (propranolol/carvedilol) reduces portal pressure and rebleeding.","trapType":"Choosing an acid-suppressant because the bleed is 'gastric'.","futureAlert":"PHG and varices: non-selective β-blocker (propranolol/carvedilol) reduces portal pressure and rebleeding.","reviseTopic":"Surgery","syllabusTopic":"Surgery","correctRule":"PHG and varices: non-selective β-blocker (propranolol/carvedilol) reduces portal pressure and rebleeding.","distractors":{"A":"Antacids don't lower portal pressure.","B":"PPIs treat peptic ulceration, not PHG.","D":"H2 blockers don't affect portal pressure."}},{"id":"GM-87","stem":"A 52-year-old with chronic liver disease has haematemesis and melaena, pulse 110, BP 100/70, jaundice, confusion and flapping tremor. Most appropriate treatment?","options":[{"letter":"A","text":"IV omeprazole"},{"letter":"B","text":"IV terlipressin"},{"letter":"C","text":"IV vitamin K"},{"letter":"D","text":"Oral propranolol"}],"correct":"B","testedConcept":"Acute variceal haemorrhage","cognitiveTask":"Interpretation","discriminator":"Decompensated CLD + upper GI bleed = presumed variceal bleed → vasoactive drug (terlipressin) immediately.","whyCorrect":"Variceal bleed: resuscitate → terlipressin + IV antibiotics (ceftriaxone) → endoscopic band ligation within 12 h → TIPS if refractory.","trapType":"Propranolol is for prevention, not acute bleeding (worsens hypotension).","futureAlert":"Variceal bleed: resuscitate → terlipressin + IV antibiotics (ceftriaxone) → endoscopic band ligation within 12 h → TIPS if refractory.","reviseTopic":"Surgery","syllabusTopic":"Surgery","correctRule":"Variceal bleed: resuscitate → terlipressin + IV antibiotics (ceftriaxone) → endoscopic band ligation within 12 h → TIPS if refractory.","distractors":{"A":"PPI is for ulcer bleeds; not first priority in variceal bleed.","C":"Vitamin K doesn't correct coagulopathy from liver synthetic failure.","D":"β-blockers are for primary/secondary prophylaxis, contraindicated in active shock."}},{"id":"GM-88","stem":"Most common carcinoma associated with MEN IIA?","options":[{"letter":"A","text":"Follicular"},{"letter":"B","text":"Medullary"},{"letter":"C","text":"Papillary"},{"letter":"D","text":"Sarcoma"}],"correct":"B","testedConcept":"MEN 2 syndromes","cognitiveTask":"Interpretation","discriminator":"MEN 2A (RET mutation) = medullary thyroid carcinoma (~100%) + phaeochromocytoma + parathyroid hyperplasia.","whyCorrect":"MEN1: 3 Ps (pituitary, parathyroid, pancreas). MEN2A: MTC, phaeo, parathyroid. MEN2B: MTC, phaeo, mucosal neuromas, marfanoid.","trapType":"Papillary is the most common thyroid cancer overall, but not in MEN.","futureAlert":"MEN1: 3 Ps (pituitary, parathyroid, pancreas). MEN2A: MTC, phaeo, parathyroid. MEN2B: MTC, phaeo, mucosal neuromas, marfanoid.","reviseTopic":"Surgery","syllabusTopic":"Surgery","correctRule":"MEN1: 3 Ps (pituitary, parathyroid, pancreas). MEN2A: MTC, phaeo, parathyroid. MEN2B: MTC, phaeo, mucosal neuromas, marfanoid.","distractors":{"A":"Follicular is not part of MEN.","C":"Papillary is not part of MEN.","D":"Sarcoma is not associated with MEN 2A."}},{"id":"GM-89","stem":"Best technique to localise a parathyroid adenoma?","options":[{"letter":"A","text":"CT"},{"letter":"B","text":"MRI"},{"letter":"C","text":"Radionuclide scan"},{"letter":"D","text":"Ultrasonography"}],"correct":"C","testedConcept":"Pre-operative parathyroid localisation","cognitiveTask":"Interpretation","discriminator":"Tc-99m sestamibi scan is taken up and retained by hyperfunctioning parathyroid tissue.","whyCorrect":"Localisation: sestamibi ± SPECT-CT + neck US → minimally invasive parathyroidectomy. Localisation isn't for diagnosis (that's biochemical).","trapType":"Ultrasound is often done together with it but is less sensitive for ectopic glands.","futureAlert":"Localisation: sestamibi ± SPECT-CT + neck US → minimally invasive parathyroidectomy. Localisation isn't for diagnosis (that's biochemical).","reviseTopic":"Surgery","syllabusTopic":"Surgery","correctRule":"Localisation: sestamibi ± SPECT-CT + neck US → minimally invasive parathyroidectomy. Localisation isn't for diagnosis (that's biochemical).","distractors":{"A":"CT (4D-CT) is second-line.","B":"MRI is reserved for re-operative/difficult cases.","D":"US is complementary, operator-dependent and misses mediastinal glands."}},{"id":"GM-90","stem":"Commonest site of a thyroglossal cyst?","options":[{"letter":"A","text":"Foramen caecum"},{"letter":"B","text":"Thyroid cartilage"},{"letter":"C","text":"Hyoid bone"},{"letter":"D","text":"Floor of mouth"}],"correct":"C","testedConcept":"Thyroglossal duct cyst","cognitiveTask":"Interpretation","discriminator":"Most occur at or just below the hyoid bone (subhyoid), in the midline.","whyCorrect":"Midline neck lump moving with tongue protrusion and swallowing. Treat with Sistrunk's operation (excise central hyoid).","trapType":"Foramen caecum is the ORIGIN of the duct, not the commonest cyst site.","futureAlert":"Midline neck lump moving with tongue protrusion and swallowing. Treat with Sistrunk's operation (excise central hyoid).","reviseTopic":"Surgery","syllabusTopic":"Surgery","correctRule":"Midline neck lump moving with tongue protrusion and swallowing. Treat with Sistrunk's operation (excise central hyoid).","distractors":{"A":"Origin point; cysts rarely sit there (lingual).","B":"Less common (thyrohyoid region).","D":"Suprahyoid/sublingual cysts are less common."}},{"id":"GM-91","stem":"A 65-year-old has a non-healing foul-smelling ulcer over an old burn scar that has recently enlarged and become painful. Histology?","options":[{"letter":"A","text":"BCC"},{"letter":"B","text":"SCC"},{"letter":"C","text":"Melanoma"},{"letter":"D","text":"Adenocarcinoma"}],"correct":"B","testedConcept":"Marjolin's ulcer","cognitiveTask":"Interpretation","discriminator":"Malignant change in a chronic scar/burn = Marjolin's ulcer = squamous cell carcinoma.","whyCorrect":"Marjolin's: slow-growing, painless initially, no lymph spread early (scar lacks lymphatics). Biopsy any non-healing ulcer in a scar.","trapType":"BCC is the most common skin cancer overall, but not in scars.","futureAlert":"Marjolin's: slow-growing, painless initially, no lymph spread early (scar lacks lymphatics). Biopsy any non-healing ulcer in a scar.","reviseTopic":"Surgery","syllabusTopic":"Surgery","correctRule":"Marjolin's: slow-growing, painless initially, no lymph spread early (scar lacks lymphatics). Biopsy any non-healing ulcer in a scar.","distractors":{"A":"BCC arises in sun-exposed skin, not burn scars.","C":"Melanoma arises from melanocytes/naevi.","D":"Adenocarcinoma is glandular, not cutaneous scar origin."}},{"id":"GM-92","stem":"Most common causative agent of UTI?","options":[{"letter":"A","text":"E. coli"},{"letter":"B","text":"Klebsiella"},{"letter":"C","text":"Proteus"},{"letter":"D","text":"Staphylococcus"}],"correct":"A","testedConcept":"UTI microbiology","cognitiveTask":"Interpretation","discriminator":"Uropathogenic E. coli (P-fimbriae) causes ~80% of community UTIs.","whyCorrect":"KEEPS: Klebsiella, E. coli, Enterococcus, Proteus, S. saprophyticus.","trapType":"Staph saprophyticus is the second most common in young women.","futureAlert":"KEEPS: Klebsiella, E. coli, Enterococcus, Proteus, S. saprophyticus.","reviseTopic":"Surgery","syllabusTopic":"Surgery","correctRule":"KEEPS: Klebsiella, E. coli, Enterococcus, Proteus, S. saprophyticus.","distractors":{"B":"Klebsiella — less common, often nosocomial.","C":"Proteus — associated with struvite stones.","D":"S. saprophyticus causes UTIs in young sexually active women but less often than E. coli."}},{"id":"GM-93","stem":"A trauma patient has severe respiratory distress, hypotension, absent right breath sounds and trachea deviated left. Immediate management?","options":[{"letter":"A","text":"Chest X-ray"},{"letter":"B","text":"Endotracheal intubation"},{"letter":"C","text":"Needle decompression, right 2nd ICS"},{"letter":"D","text":"Pericardiocentesis"}],"correct":"C","testedConcept":"Tension pneumothorax","cognitiveTask":"Interpretation","discriminator":"Clinical diagnosis — shock + absent breath sounds + tracheal shift AWAY → decompress immediately.","whyCorrect":"Needle decompression (2nd ICS MCL; ATLS now prefers 4th/5th ICS anterior to mid-axillary in adults) → chest drain.","trapType":"Waiting for a chest X-ray — tension is a clinical diagnosis and delay is fatal.","futureAlert":"Needle decompression (2nd ICS MCL; ATLS now prefers 4th/5th ICS anterior to mid-axillary in adults) → chest drain.","reviseTopic":"Surgery","syllabusTopic":"Surgery","correctRule":"Needle decompression (2nd ICS MCL; ATLS now prefers 4th/5th ICS anterior to mid-axillary in adults) → chest drain.","distractors":{"A":"Imaging delays life-saving treatment.","B":"Positive-pressure ventilation worsens tension.","D":"Pericardiocentesis treats tamponade (muffled sounds, raised JVP, normal breath sounds)."}},{"id":"GM-94","stem":"A 6-year-old with acute otitis media develops severe headache, nausea, photophobia, high fever and neck stiffness after 3 days. Diagnosis?","options":[{"letter":"A","text":"Cerebellar abscess"},{"letter":"B","text":"Extradural abscess"},{"letter":"C","text":"Meningitis"},{"letter":"D","text":"Sigmoid sinus thrombosis"}],"correct":"C","testedConcept":"Otogenic meningitis","cognitiveTask":"Interpretation","discriminator":"Neck stiffness + photophobia + fever = meningism.","whyCorrect":"Commonest intracranial complication of otitis media = meningitis. LP after CT if signs of raised ICP.","trapType":"Abscesses evolve over weeks with focal signs.","futureAlert":"Commonest intracranial complication of otitis media = meningitis. LP after CT if signs of raised ICP.","reviseTopic":"Surgery","syllabusTopic":"Surgery","correctRule":"Commonest intracranial complication of otitis media = meningitis. LP after CT if signs of raised ICP.","distractors":{"A":"Cerebellar abscess: ataxia, nystagmus, slower evolution.","B":"Extradural abscess: often silent, localised headache.","D":"Sinus thrombosis: picket-fence fever, Griesinger's sign."}},{"id":"GM-95","stem":"Most characteristic finding of a second-degree (partial-thickness) burn?","options":[{"letter":"A","text":"Dry, leathery, insensate"},{"letter":"B","text":"Erythema without blisters"},{"letter":"C","text":"Blisters, severe pain, moist skin"},{"letter":"D","text":"Charred skin with muscle visible"}],"correct":"C","testedConcept":"Burn depth","cognitiveTask":"Interpretation","discriminator":"Partial thickness = blistering + pain (nerve endings intact) + moist, blanching base.","whyCorrect":"1st: red, painful, no blisters. 2nd: blisters, painful. 3rd: white/leathery, painless. 4th: muscle/bone.","trapType":"Erythema without blisters is first-degree (superficial).","futureAlert":"1st: red, painful, no blisters. 2nd: blisters, painful. 3rd: white/leathery, painless. 4th: muscle/bone.","reviseTopic":"Surgery","syllabusTopic":"Surgery","correctRule":"1st: red, painful, no blisters. 2nd: blisters, painful. 3rd: white/leathery, painless. 4th: muscle/bone.","distractors":{"A":"Full thickness (3rd degree).","B":"Superficial (1st degree, e.g. sunburn).","D":"4th degree."}},{"id":"GM-96","stem":"Most common cause of massive lower GI bleeding?","options":[{"letter":"A","text":"Angiodysplasia"},{"letter":"B","text":"Diverticulosis"},{"letter":"C","text":"Ischaemic colitis"},{"letter":"D","text":"Colon cancer"}],"correct":"B","testedConcept":"Causes of LGIB","cognitiveTask":"Interpretation","discriminator":"Diverticulosis is the leading cause of MASSIVE painless LGIB in adults.","whyCorrect":"Massive LGIB: diverticulosis > angiodysplasia. Investigate with CT angiography/colonoscopy; exclude upper GI source first.","trapType":"Angiodysplasia is second and more often causes recurrent low-grade bleeding.","futureAlert":"Massive LGIB: diverticulosis > angiodysplasia. Investigate with CT angiography/colonoscopy; exclude upper GI source first.","reviseTopic":"Surgery","syllabusTopic":"Surgery","correctRule":"Massive LGIB: diverticulosis > angiodysplasia. Investigate with CT angiography/colonoscopy; exclude upper GI source first.","distractors":{"A":"Second most common; usually intermittent.","C":"Ischaemic colitis: painful, rarely massive.","D":"Cancer: occult/chronic bleeding."}},{"id":"GM-97","stem":"A 49-year-old with recurrent renal stones has pepper-pot (salt-and-pepper) lytic lesions on skull X-ray. Condition?","options":[{"letter":"A","text":"Paget disease"},{"letter":"B","text":"Hyperthyroidism"},{"letter":"C","text":"Hyperparathyroidism"},{"letter":"D","text":"Osteogenesis imperfecta"}],"correct":"C","testedConcept":"Primary hyperparathyroidism","cognitiveTask":"Interpretation","discriminator":"Stones + salt-and-pepper skull = PTH-driven bone resorption and hypercalciuria.","whyCorrect":"Bones, stones, abdominal groans, psychic moans. Also subperiosteal resorption of phalanges, brown tumours (osteitis fibrosa cystica).","trapType":"Paget's also changes the skull, but gives cotton-wool appearance and high ALP with normal calcium.","futureAlert":"Bones, stones, abdominal groans, psychic moans. Also subperiosteal resorption of phalanges, brown tumours (osteitis fibrosa cystica).","reviseTopic":"Surgery","syllabusTopic":"Surgery","correctRule":"Bones, stones, abdominal groans, psychic moans. Also subperiosteal resorption of phalanges, brown tumours (osteitis fibrosa cystica).","distractors":{"A":"Paget's: cotton-wool skull, enlarged bones, normal calcium.","B":"Hyperthyroidism causes osteoporosis, not salt-and-pepper skull.","D":"OI: blue sclerae, fractures, Wormian bones."}},{"id":"GM-98","stem":"Most common type of renal stone?","options":[{"letter":"A","text":"Uric acid"},{"letter":"B","text":"Calcium oxalate"},{"letter":"C","text":"Cystine"},{"letter":"D","text":"Struvite"}],"correct":"B","testedConcept":"Renal stone epidemiology","cognitiveTask":"Interpretation","discriminator":"Calcium oxalate makes up ~75–80% of stones.","whyCorrect":"Calcium oxalate: radio-opaque, envelope/dumbbell crystals. Prevention: fluids, normal calcium diet, low salt/oxalate, thiazide for hypercalciuria.","trapType":"Struvite is most common in staghorn/infection context only.","futureAlert":"Calcium oxalate: radio-opaque, envelope/dumbbell crystals. Prevention: fluids, normal calcium diet, low salt/oxalate, thiazide for hypercalciuria.","reviseTopic":"Surgery","syllabusTopic":"Surgery","correctRule":"Calcium oxalate: radio-opaque, envelope/dumbbell crystals. Prevention: fluids, normal calcium diet, low salt/oxalate, thiazide for hypercalciuria.","distractors":{"A":"Uric acid ~5–10%, radiolucent.","C":"Cystine ~1%.","D":"Struvite ~10–15%."}},{"id":"GM-99","stem":"A 50-year-old obese multiparous woman with chronic constipation has a painful irreducible swelling just above the umbilicus. Diagnosis?","options":[{"letter":"A","text":"Umbilical hernia"},{"letter":"B","text":"Paraumbilical hernia"},{"letter":"C","text":"Epigastric hernia"},{"letter":"D","text":"Incisional hernia"}],"correct":"B","testedConcept":"Paraumbilical hernia","cognitiveTask":"Interpretation","discriminator":"Adult obese multiparous woman + defect just above (or below) the umbilicus through the linea alba = paraumbilical.","whyCorrect":"Paraumbilical hernias have a narrow neck → high risk of irreducibility and strangulation → repair (mesh/Mayo).","trapType":"True umbilical hernia is through the umbilical scar itself, typically in infants.","futureAlert":"Paraumbilical hernias have a narrow neck → high risk of irreducibility and strangulation → repair (mesh/Mayo).","reviseTopic":"Surgery","syllabusTopic":"Surgery","correctRule":"Paraumbilical hernias have a narrow neck → high risk of irreducibility and strangulation → repair (mesh/Mayo).","distractors":{"A":"True umbilical hernia: infants, through the umbilicus itself, often self-resolving.","C":"Epigastric hernia: higher up in the midline between xiphoid and umbilicus, usually small fat-containing.","D":"Incisional hernia requires a previous surgical scar."}},{"id":"GM-100","stem":"After an RTA a 30-year-old opens eyes only to pain, makes incomprehensible sounds and withdraws limbs to pain. GCS?","options":[{"letter":"A","text":"6"},{"letter":"B","text":"7"},{"letter":"C","text":"8"},{"letter":"D","text":"9"}],"correct":"C","testedConcept":"Glasgow Coma Scale","cognitiveTask":"Interpretation","discriminator":"E2 (to pain) + V2 (incomprehensible sounds) + M4 (withdraws) = 8.","whyCorrect":"E4 V5 M6. GCS ≤8 → intubate. Motor: 6 obeys, 5 localises, 4 withdraws, 3 flexion, 2 extension, 1 none.","trapType":"Scoring 'withdrawal' as M3 (that is abnormal flexion/decorticate).","futureAlert":"E4 V5 M6. GCS ≤8 → intubate. Motor: 6 obeys, 5 localises, 4 withdraws, 3 flexion, 2 extension, 1 none.","reviseTopic":"Surgery","syllabusTopic":"Surgery","correctRule":"E4 V5 M6. GCS ≤8 → intubate. Motor: 6 obeys, 5 localises, 4 withdraws, 3 flexion, 2 extension, 1 none.","distractors":{"A":"Undercounts two components.","B":"Undercounts motor (M3 = abnormal flexion).","D":"Overcounts — would need localising (M5) or confused words (V4)."}},{"id":"GM-101","stem":"A 35-year-old has sudden severe right flank pain radiating to the groin with microscopic haematuria. Investigation of choice?","options":[{"letter":"A","text":"X-ray KUB"},{"letter":"B","text":"IVU"},{"letter":"C","text":"Non-contrast CT KUB"},{"letter":"D","text":"Ultrasound"}],"correct":"C","testedConcept":"Imaging in renal colic","cognitiveTask":"Interpretation","discriminator":"NCCT KUB detects ~99% of stones (including radiolucent uric acid), size and location.","whyCorrect":"Renal colic: NCCT KUB within 24 h. Stones <5 mm usually pass. Infected obstructed kidney → urgent nephrostomy/stent.","trapType":"Ultrasound is first-line in pregnancy and children only.","futureAlert":"Renal colic: NCCT KUB within 24 h. Stones <5 mm usually pass. Infected obstructed kidney → urgent nephrostomy/stent.","reviseTopic":"Surgery","syllabusTopic":"Surgery","correctRule":"Renal colic: NCCT KUB within 24 h. Stones <5 mm usually pass. Infected obstructed kidney → urgent nephrostomy/stent.","distractors":{"A":"KUB misses radiolucent and small stones.","B":"IVU is obsolete and needs contrast.","D":"US is less sensitive for ureteric stones."}},{"id":"GM-102","stem":"Most sensitive and specific key investigation for acute pancreatitis?","options":[{"letter":"A","text":"Serum amylase"},{"letter":"B","text":"Serum lipase"},{"letter":"C","text":"Abdominal ultrasound"},{"letter":"D","text":"Plain AXR"}],"correct":"B","testedConcept":"Pancreatitis biochemistry","cognitiveTask":"Interpretation","discriminator":"Lipase is more specific and stays raised longer (8–14 days) than amylase.","whyCorrect":"Diagnosis: 2 of 3 — typical pain, lipase/amylase >3× ULN, imaging. Ultrasound is for finding gallstones (cause), not diagnosis.","trapType":"Amylase is classic and faster but less specific (raised in parotitis, perforation, ischaemia).","futureAlert":"Diagnosis: 2 of 3 — typical pain, lipase/amylase >3× ULN, imaging. Ultrasound is for finding gallstones (cause), not diagnosis.","reviseTopic":"Surgery","syllabusTopic":"Surgery","correctRule":"Diagnosis: 2 of 3 — typical pain, lipase/amylase >3× ULN, imaging. Ultrasound is for finding gallstones (cause), not diagnosis.","distractors":{"A":"Less specific; normalises within 3–5 days.","C":"US finds gallstones; pancreas often obscured by gas.","D":"AXR is non-specific (sentinel loop)."}},{"id":"GM-103","stem":"A 40-year-old obese woman with RUQ pain, fever and nausea catches her breath on deep RUQ palpation (positive Murphy's). Condition?","options":[{"letter":"A","text":"Appendicitis"},{"letter":"B","text":"Acute cholecystitis"},{"letter":"C","text":"Pancreatitis"},{"letter":"D","text":"Perforated PU"}],"correct":"B","testedConcept":"Murphy's sign","cognitiveTask":"Interpretation","discriminator":"Inspiratory arrest on RUQ palpation = inflamed gallbladder hitting the examiner's hand.","whyCorrect":"Fat, female, fertile, forty. Murphy's sign is negative on the left side (no comparison needed for biliary colic).","trapType":"Pancreatitis also causes upper abdominal pain, but Murphy's is gallbladder-specific.","futureAlert":"Fat, female, fertile, forty. Murphy's sign is negative on the left side (no comparison needed for biliary colic).","reviseTopic":"Surgery","syllabusTopic":"Surgery","correctRule":"Fat, female, fertile, forty. Murphy's sign is negative on the left side (no comparison needed for biliary colic).","distractors":{"A":"Appendicitis: RIF, McBurney's/Rovsing's sign.","C":"Pancreatitis: epigastric pain radiating to back.","D":"Perforation: board-like rigidity, free air."}},{"id":"GM-104","stem":"A 65-year-old has progressive painless jaundice and a smooth, non-tender, palpable gallbladder. According to Courvoisier's law, diagnosis?","options":[{"letter":"A","text":"Impacted stone in cystic duct"},{"letter":"B","text":"Chronic pancreatitis"},{"letter":"C","text":"Acute cholecystitis"},{"letter":"D","text":"Pancreatic head carcinoma"}],"correct":"D","testedConcept":"Courvoisier's law","cognitiveTask":"Interpretation","discriminator":"Painless jaundice + palpable non-tender gallbladder → not stones → malignant distal CBD obstruction (pancreatic head).","whyCorrect":"Courvoisier: palpable GB + jaundice is unlikely to be gallstones. Workup: CT pancreas protocol, CA 19-9, ERCP/EUS.","trapType":"Gallstones scar the gallbladder (fibrosed, can't distend) — so palpable GB argues against them.","futureAlert":"Courvoisier: palpable GB + jaundice is unlikely to be gallstones. Workup: CT pancreas protocol, CA 19-9, ERCP/EUS.","reviseTopic":"Surgery","syllabusTopic":"Surgery","correctRule":"Courvoisier: palpable GB + jaundice is unlikely to be gallstones. Workup: CT pancreas protocol, CA 19-9, ERCP/EUS.","distractors":{"A":"Cystic duct stones don't cause jaundice (except Mirizzi) and are painful.","B":"Chronic pancreatitis causes pain and a fibrosed system.","C":"Cholecystitis is painful with tender GB."}},{"id":"GM-105","stem":"A 2-year-old with 2 days of acute watery diarrhoea and profuse vomiting is drowsy and unable to drink. Optimal treatment?","options":[{"letter":"A","text":"ORS"},{"letter":"B","text":"IV Ringer's lactate"},{"letter":"C","text":"IV antibiotics"},{"letter":"D","text":"Reassurance"}],"correct":"B","testedConcept":"Severe dehydration (WHO Plan C)","cognitiveTask":"Interpretation","discriminator":"Lethargy + unable to drink = severe dehydration → IV fluids.","whyCorrect":"Plan C: RL 100 mL/kg — <12 months: 30 mL/kg over 1 h then 70 over 5 h; ≥12 months: 30 mL/kg over 30 min then 70 over 2.5 h.","trapType":"ORS is ideal for some dehydration, but a drowsy child who can't drink can't take it.","futureAlert":"Plan C: RL 100 mL/kg — <12 months: 30 mL/kg over 1 h then 70 over 5 h; ≥12 months: 30 mL/kg over 30 min then 70 over 2.5 h.","reviseTopic":"Surgery","syllabusTopic":"Surgery","correctRule":"Plan C: RL 100 mL/kg — <12 months: 30 mL/kg over 1 h then 70 over 5 h; ≥12 months: 30 mL/kg over 30 min then 70 over 2.5 h.","distractors":{"A":"Cannot drink — oral route fails.","C":"Watery diarrhoea is usually viral; antibiotics not indicated.","D":"Dangerous in severe dehydration."}},{"id":"GM-106","stem":"A breech-delivered neonate has a right claw hand plus ipsilateral miosis and ptosis. Diagnosis?","options":[{"letter":"A","text":"Erb's palsy"},{"letter":"B","text":"Klumpke's palsy"},{"letter":"C","text":"Axillary nerve injury"},{"letter":"D","text":"Radial nerve injury"}],"correct":"B","testedConcept":"Lower brachial plexus injury","cognitiveTask":"Interpretation","discriminator":"Claw hand (C8–T1) + Horner's (T1 sympathetic) = Klumpke's.","whyCorrect":"Erb's: C5–6, shoulder dystocia/lateral neck traction. Klumpke's: C8–T1, arm hyper-abduction (breech/arm pull). Horner's indicates T1 root avulsion.","trapType":"Erb's palsy is the more common birth palsy but gives 'waiter's tip' (C5–C6).","futureAlert":"Erb's: C5–6, shoulder dystocia/lateral neck traction. Klumpke's: C8–T1, arm hyper-abduction (breech/arm pull). Horner's indicates T1 root avulsion.","reviseTopic":"Surgery","syllabusTopic":"Surgery","correctRule":"Erb's: C5–6, shoulder dystocia/lateral neck traction. Klumpke's: C8–T1, arm hyper-abduction (breech/arm pull). Horner's indicates T1 root avulsion.","distractors":{"A":"Erb's spares the hand intrinsics and doesn't give Horner's.","C":"Axillary: deltoid weakness only.","D":"Radial: wrist drop, no Horner's."}},{"id":"GM-107","stem":"A singer is planned for total thyroidectomy. Most important complication to include in written consent?","options":[{"letter":"A","text":"Hoarseness"},{"letter":"B","text":"Shortness of breath"},{"letter":"C","text":"Recurrence"},{"letter":"D","text":"Dysphagia"}],"correct":"A","testedConcept":"Nerve injury in thyroid surgery","cognitiveTask":"Interpretation","discriminator":"For a professional voice user, recurrent or external branch of superior laryngeal nerve injury → voice change is the career-relevant risk.","whyCorrect":"Thyroidectomy risks: RLN palsy (hoarseness), EBSLN (loss of high pitch), hypocalcaemia, haematoma (airway), hypothyroidism.","trapType":"Breathlessness from bilateral RLN palsy is serious but rare; the patient-specific risk is voice.","futureAlert":"Thyroidectomy risks: RLN palsy (hoarseness), EBSLN (loss of high pitch), hypocalcaemia, haematoma (airway), hypothyroidism.","reviseTopic":"Surgery","syllabusTopic":"Surgery","correctRule":"Thyroidectomy risks: RLN palsy (hoarseness), EBSLN (loss of high pitch), hypocalcaemia, haematoma (airway), hypothyroidism.","distractors":{"B":"Bilateral RLN injury/haematoma — rare.","C":"Recurrence is not relevant after total thyroidectomy.","D":"Transient dysphagia is minor."}},{"id":"GM-108","stem":"During short saphenous vein surgery for varicose veins, which nerve is particularly at risk?","options":[{"letter":"A","text":"Sural"},{"letter":"B","text":"Popliteal"},{"letter":"C","text":"Tibial"},{"letter":"D","text":"Femoral"}],"correct":"A","testedConcept":"Nerves near the saphenous veins","cognitiveTask":"Interpretation","discriminator":"The sural nerve runs alongside the short saphenous vein on the back of the calf.","whyCorrect":"SSV → sural nerve (lateral foot numbness). GSV → saphenous nerve (medial leg numbness). SPJ surgery also risks common peroneal nerve.","trapType":"Saphenous nerve accompanies the GREAT saphenous vein.","futureAlert":"SSV → sural nerve (lateral foot numbness). GSV → saphenous nerve (medial leg numbness). SPJ surgery also risks common peroneal nerve.","reviseTopic":"Surgery","syllabusTopic":"Surgery","correctRule":"SSV → sural nerve (lateral foot numbness). GSV → saphenous nerve (medial leg numbness). SPJ surgery also risks common peroneal nerve.","distractors":{"B":"There is no 'popliteal nerve' at risk; the tibial/common peroneal lie deeper in the fossa.","C":"Tibial nerve lies deep in the popliteal fossa.","D":"Femoral nerve is in the groin."}},{"id":"GM-109","stem":"A 23-year-old with mitral valve disease and poor medication compliance has sudden severe pain, coldness, numbness and weakness of the left hand and forearm for 2 hours. Cause?","options":[{"letter":"A","text":"Chronic venous insufficiency"},{"letter":"B","text":"DVT"},{"letter":"C","text":"Acute limb ischaemia"},{"letter":"D","text":"Intermittent claudication"}],"correct":"C","testedConcept":"Embolic acute limb ischaemia","cognitiveTask":"Interpretation","discriminator":"Sudden 6 Ps (pain, pallor, pulselessness, perishing cold, paraesthesia, paralysis) in mitral disease (AF/LA thrombus) = embolism.","whyCorrect":"Acute limb ischaemia: IV heparin immediately → embolectomy (Fogarty). Sensory/motor loss = threatened limb, urgent.","trapType":"Claudication is chronic and exertional, not sudden at rest.","futureAlert":"Acute limb ischaemia: IV heparin immediately → embolectomy (Fogarty). Sensory/motor loss = threatened limb, urgent.","reviseTopic":"Surgery","syllabusTopic":"Surgery","correctRule":"Acute limb ischaemia: IV heparin immediately → embolectomy (Fogarty). Sensory/motor loss = threatened limb, urgent.","distractors":{"A":"Venous insufficiency: chronic oedema, pigmentation, ulcers.","B":"DVT: swollen warm limb, pulses present.","D":"Claudication: exercise-induced, relieved by rest, chronic."}},{"id":"GM-110","stem":"A pedestrian hit by a car is hypotensive and tachycardic with cold clammy extremities. Type of shock?","options":[{"letter":"A","text":"Hypovolaemic"},{"letter":"B","text":"Spinal"},{"letter":"C","text":"Neurogenic"},{"letter":"D","text":"Cardiogenic"}],"correct":"A","testedConcept":"Shock in trauma","cognitiveTask":"Interpretation","discriminator":"Tachycardia + cold peripheries = compensatory vasoconstriction → haemorrhagic (hypovolaemic).","whyCorrect":"In trauma, hypotension = bleeding until proven otherwise. Sites: chest, abdomen, pelvis, long bones, external ('on the floor and four more').","trapType":"Neurogenic shock gives hypotension with BRADYCARDIA and WARM peripheries.","futureAlert":"In trauma, hypotension = bleeding until proven otherwise. Sites: chest, abdomen, pelvis, long bones, external ('on the floor and four more').","reviseTopic":"Surgery","syllabusTopic":"Surgery","correctRule":"In trauma, hypotension = bleeding until proven otherwise. Sites: chest, abdomen, pelvis, long bones, external ('on the floor and four more').","distractors":{"B":"'Spinal shock' is loss of reflexes below a cord injury, not circulatory shock.","C":"Neurogenic: bradycardia, warm skin.","D":"Cardiogenic: raised JVP, pulmonary oedema."}},{"id":"GM-111","stem":"Most important next step in a patient with pelvic trauma in shock after initial resuscitation?","options":[{"letter":"A","text":"Spinal board"},{"letter":"B","text":"Immobilisation"},{"letter":"C","text":"Pelvic binder"},{"letter":"D","text":"External pelvic fixator"}],"correct":"C","testedConcept":"Haemorrhage control in pelvic fracture","cognitiveTask":"Interpretation","discriminator":"A binder at the greater trochanters reduces pelvic volume and tamponades venous bleeding — quick and non-invasive.","whyCorrect":"Unstable pelvis: binder → blood products → angioembolisation (arterial) or preperitoneal packing → ex-fix.","trapType":"External fixation is definitive but slower and done in theatre after temporary stabilisation.","futureAlert":"Unstable pelvis: binder → blood products → angioembolisation (arterial) or preperitoneal packing → ex-fix.","reviseTopic":"Surgery","syllabusTopic":"Surgery","correctRule":"Unstable pelvis: binder → blood products → angioembolisation (arterial) or preperitoneal packing → ex-fix.","distractors":{"A":"Spinal board is for transport, not haemorrhage control.","B":"General immobilisation doesn't close the pelvic ring.","D":"Ex-fix comes after binder, in theatre."}},{"id":"GM-112","stem":"After a deep laceration behind the knee, a 40-year-old cannot plantar-flex the foot and has sole numbness. Which nerve?","options":[{"letter":"A","text":"Common peroneal"},{"letter":"B","text":"Tibial"},{"letter":"C","text":"Sural"},{"letter":"D","text":"Femoral"}],"correct":"B","testedConcept":"Tibial nerve injury","cognitiveTask":"Interpretation","discriminator":"Plantar-flexion loss + sole anaesthesia = tibial nerve (popliteal fossa).","whyCorrect":"Tibial: can't stand on toes, sole numb, lost ankle jerk. Common peroneal: foot drop, dorsum numb.","trapType":"Common peroneal is the most commonly injured leg nerve, but causes foot DROP.","futureAlert":"Tibial: can't stand on toes, sole numb, lost ankle jerk. Common peroneal: foot drop, dorsum numb.","reviseTopic":"Surgery","syllabusTopic":"Surgery","correctRule":"Tibial: can't stand on toes, sole numb, lost ankle jerk. Common peroneal: foot drop, dorsum numb.","distractors":{"A":"Foot drop and dorsal foot numbness.","C":"Purely sensory, lateral foot.","D":"Knee extension, anterior thigh."}},{"id":"GM-113","stem":"After a high-speed motorcycle collision, a hypotensive tachycardic patient's FAST shows fluid in the pericardial window. Diagnosis?","options":[{"letter":"A","text":"Haemothorax"},{"letter":"B","text":"Cardiac tamponade"},{"letter":"C","text":"Ruptured liver"},{"letter":"D","text":"Ruptured spleen"}],"correct":"B","testedConcept":"FAST windows","cognitiveTask":"Interpretation","discriminator":"Fluid in the PERICARDIAL (subxiphoid) view + shock = tamponade.","whyCorrect":"Beck's triad: hypotension, raised JVP, muffled sounds. Treat: pericardiocentesis as bridge → thoracotomy.","trapType":"Liver/spleen rupture show fluid in Morison's or splenorenal pouches, not the pericardium.","futureAlert":"Beck's triad: hypotension, raised JVP, muffled sounds. Treat: pericardiocentesis as bridge → thoracotomy.","reviseTopic":"Surgery","syllabusTopic":"Surgery","correctRule":"Beck's triad: hypotension, raised JVP, muffled sounds. Treat: pericardiocentesis as bridge → thoracotomy.","distractors":{"A":"Haemothorax is seen in pleural windows (eFAST).","C":"Liver: Morison's pouch.","D":"Spleen: splenorenal recess."}},{"id":"GM-114","stem":"A 60-year-old obese woman has a chronic shallow ulcer above the medial malleolus with hyperpigmented, indurated, swollen skin. Diagnosis?","options":[{"letter":"A","text":"Arterial"},{"letter":"B","text":"Diabetic neuropathic"},{"letter":"C","text":"Venous ulcer"},{"letter":"D","text":"Tuberculosis"}],"correct":"C","testedConcept":"Leg ulcer types","cognitiveTask":"Interpretation","discriminator":"Gaiter area (medial malleolus) + shallow + haemosiderin pigmentation + lipodermatosclerosis = venous.","whyCorrect":"Venous: check ABPI >0.8, then compression bandaging. Arterial: distal, painful, cold, absent pulses. Neuropathic: pressure points, painless.","trapType":"Arterial ulcers are deep, punched-out, painful, on toes/pressure points.","futureAlert":"Venous: check ABPI >0.8, then compression bandaging. Arterial: distal, painful, cold, absent pulses. Neuropathic: pressure points, painless.","reviseTopic":"Surgery","syllabusTopic":"Surgery","correctRule":"Venous: check ABPI >0.8, then compression bandaging. Arterial: distal, painful, cold, absent pulses. Neuropathic: pressure points, painless.","distractors":{"A":"Arterial: lateral/toes, punched out, pale.","B":"Neuropathic: plantar pressure points, painless.","D":"TB ulcers: undermined edges, rare in this site."}},{"id":"GM-115","stem":"Predominant cell in the first 6–24 hours of acute inflammation?","options":[{"letter":"A","text":"Macrophages"},{"letter":"B","text":"Neutrophils"},{"letter":"C","text":"Eosinophils"},{"letter":"D","text":"Lymphocytes"}],"correct":"B","testedConcept":"Cell sequence in acute inflammation","cognitiveTask":"Interpretation","discriminator":"Neutrophils dominate 6–24 h; replaced by monocytes/macrophages at 24–48 h.","whyCorrect":"Exceptions: Pseudomonas → neutrophils for days; viral → lymphocytes first; allergy/parasite → eosinophils.","trapType":"Macrophages are the 'chief' cell later, and of chronic inflammation.","futureAlert":"Exceptions: Pseudomonas → neutrophils for days; viral → lymphocytes first; allergy/parasite → eosinophils.","reviseTopic":"Pathology","syllabusTopic":"Pathology","correctRule":"Exceptions: Pseudomonas → neutrophils for days; viral → lymphocytes first; allergy/parasite → eosinophils.","distractors":{"A":"Arrive at 24–48 h.","C":"Allergic/parasitic responses.","D":"Chronic or viral inflammation."}},{"id":"GM-116","stem":"A 30-year-old with chronic cough, low fever and night sweats has a lymph node with friable cheese-like material and granulomas. Type of necrosis?","options":[{"letter":"A","text":"Coagulative"},{"letter":"B","text":"Liquefactive"},{"letter":"C","text":"Caseous"},{"letter":"D","text":"Fat"}],"correct":"C","testedConcept":"Caseous necrosis","cognitiveTask":"Interpretation","discriminator":"'Cheese-like' + granuloma = caseous (TB).","whyCorrect":"Coagulative: infarcts (except brain). Liquefactive: brain, abscess. Caseous: TB, fungi. Fat: pancreatitis, breast trauma. Fibrinoid: vasculitis.","trapType":"Coagulative is the most common necrosis overall (infarcts).","futureAlert":"Coagulative: infarcts (except brain). Liquefactive: brain, abscess. Caseous: TB, fungi. Fat: pancreatitis, breast trauma. Fibrinoid: vasculitis.","reviseTopic":"Pathology","syllabusTopic":"Pathology","correctRule":"Coagulative: infarcts (except brain). Liquefactive: brain, abscess. Caseous: TB, fungi. Fat: pancreatitis, breast trauma. Fibrinoid: vasculitis.","distractors":{"A":"Coagulative preserves tissue outline (MI, renal infarct).","B":"Liquefactive: pus, brain infarcts.","D":"Fat necrosis: chalky saponification."}},{"id":"GM-117","stem":"A 65-year-old smoker has high fever, productive cough with rust-coloured sputum, pleuritic pain and lobar consolidation. Organism?","options":[{"letter":"A","text":"S. pneumoniae"},{"letter":"B","text":"S. aureus"},{"letter":"C","text":"Mycoplasma"},{"letter":"D","text":"Klebsiella"}],"correct":"A","testedConcept":"Lobar pneumonia","cognitiveTask":"Interpretation","discriminator":"Rusty sputum + entire-lobe consolidation = pneumococcus.","whyCorrect":"Lobar stages: congestion → red hepatisation → grey hepatisation → resolution.","trapType":"Klebsiella also causes lobar pneumonia but with 'red currant jelly' sputum in alcoholics/diabetics.","futureAlert":"Lobar stages: congestion → red hepatisation → grey hepatisation → resolution.","reviseTopic":"Pathology","syllabusTopic":"Pathology","correctRule":"Lobar stages: congestion → red hepatisation → grey hepatisation → resolution.","distractors":{"B":"S. aureus: post-influenza, cavitating/abscesses.","C":"Mycoplasma: atypical, patchy, young people, mild.","D":"Klebsiella: currant-jelly sputum, upper lobes, alcoholics."}},{"id":"GM-118","stem":"In a chronic smoker, bronchial ciliated columnar epithelium is replaced by stratified squamous epithelium. Adaptive change?","options":[{"letter":"A","text":"Hyperplasia"},{"letter":"B","text":"Metaplasia"},{"letter":"C","text":"Dysplasia"},{"letter":"D","text":"Anaplasia"}],"correct":"B","testedConcept":"Cellular adaptation","cognitiveTask":"Interpretation","discriminator":"One mature cell type replaced by ANOTHER mature cell type = metaplasia (reversible).","whyCorrect":"Squamous metaplasia in smokers; Barrett's (squamous → columnar) in reflux. Metaplasia can progress to dysplasia → carcinoma.","trapType":"Dysplasia is disordered growth with atypia — pre-malignant, not a cell-type switch.","futureAlert":"Squamous metaplasia in smokers; Barrett's (squamous → columnar) in reflux. Metaplasia can progress to dysplasia → carcinoma.","reviseTopic":"Pathology","syllabusTopic":"Pathology","correctRule":"Squamous metaplasia in smokers; Barrett's (squamous → columnar) in reflux. Metaplasia can progress to dysplasia → carcinoma.","distractors":{"A":"Hyperplasia = more cells of the same type.","C":"Dysplasia = atypical disordered cells.","D":"Anaplasia = undifferentiated malignant cells."}},{"id":"GM-119","stem":"A non-healing ulcer biopsy shows activated macrophages with abundant pink cytoplasm surrounded by lymphocytes. Most characteristic cell?","options":[{"letter":"A","text":"Neutrophils"},{"letter":"B","text":"Eosinophils"},{"letter":"C","text":"Epithelioid cells"},{"letter":"D","text":"Plasma cells"}],"correct":"C","testedConcept":"Granulomatous inflammation","cognitiveTask":"Interpretation","discriminator":"Activated macrophages with pink cytoplasm (epithelium-like) = epithelioid cells — defining cell of a granuloma.","whyCorrect":"Granuloma = epithelioid macrophages ± Langhans giant cells + lymphocyte cuff (± caseation in TB).","trapType":"Lymphocytes form the rim, but they aren't the characteristic cell.","futureAlert":"Granuloma = epithelioid macrophages ± Langhans giant cells + lymphocyte cuff (± caseation in TB).","reviseTopic":"Pathology","syllabusTopic":"Pathology","correctRule":"Granuloma = epithelioid macrophages ± Langhans giant cells + lymphocyte cuff (± caseation in TB).","distractors":{"A":"Acute inflammation.","B":"Allergy/parasites.","D":"Chronic inflammation generally, not granuloma-defining."}},{"id":"GM-120","stem":"A 32-year-old with glomerulonephritis has pedal oedema. Mechanism?","options":[{"letter":"A","text":"Complement activation"},{"letter":"B","text":"Decreased plasma oncotic pressure"},{"letter":"C","text":"Increased hydrostatic pressure"},{"letter":"D","text":"Histamine release"}],"correct":"C","testedConcept":"Oedema in nephritic syndrome","cognitiveTask":"Interpretation","discriminator":"Glomerulonephritis (nephritic) → ↓ GFR → Na⁺ and water retention → ↑ hydrostatic pressure.","whyCorrect":"Nephritic: haematuria, HTN, oliguria, oedema from salt retention. Nephrotic: >3.5 g/day proteinuria, hypoalbuminaemia, low oncotic pressure.","trapType":"Low oncotic pressure is the mechanism of NEPHROTIC syndrome (heavy proteinuria).","futureAlert":"Nephritic: haematuria, HTN, oliguria, oedema from salt retention. Nephrotic: >3.5 g/day proteinuria, hypoalbuminaemia, low oncotic pressure.","reviseTopic":"Pathology","syllabusTopic":"Pathology","correctRule":"Nephritic: haematuria, HTN, oliguria, oedema from salt retention. Nephrotic: >3.5 g/day proteinuria, hypoalbuminaemia, low oncotic pressure.","distractors":{"A":"Complement activation causes the glomerular injury, not the oedema directly.","B":"That fits nephrotic syndrome.","D":"Histamine causes allergic oedema (urticaria/angioedema)."}},{"id":"GM-121","stem":"A chronic alcoholic's liver biopsy shows hepatocytes with large clear vacuoles pushing the nucleus to the periphery. Reversible injury type?","options":[{"letter":"A","text":"Nuclear degeneration"},{"letter":"B","text":"Fatty change"},{"letter":"C","text":"Coagulative necrosis"},{"letter":"D","text":"Apoptosis"}],"correct":"B","testedConcept":"Steatosis","cognitiveTask":"Interpretation","discriminator":"Large clear vacuoles displacing the nucleus = macrovesicular fatty change (triglyceride accumulation).","whyCorrect":"Alcohol → ↑ NADH → ↑ fatty acid synthesis, ↓ oxidation → steatosis (reversible with abstinence).","trapType":"Necrosis and apoptosis are irreversible.","futureAlert":"Alcohol → ↑ NADH → ↑ fatty acid synthesis, ↓ oxidation → steatosis (reversible with abstinence).","reviseTopic":"Pathology","syllabusTopic":"Pathology","correctRule":"Alcohol → ↑ NADH → ↑ fatty acid synthesis, ↓ oxidation → steatosis (reversible with abstinence).","distractors":{"A":"Nuclear changes (pyknosis, karyorrhexis) indicate irreversible injury.","C":"Irreversible.","D":"Irreversible programmed cell death."}},{"id":"GM-122","stem":"In acute pancreatitis, chalky-white deposits form in peripancreatic fat from fatty acids binding calcium. Process?","options":[{"letter":"A","text":"Calcification"},{"letter":"B","text":"Saponification"},{"letter":"C","text":"Coagulation"},{"letter":"D","text":"Liquefaction"}],"correct":"B","testedConcept":"Enzymatic fat necrosis","cognitiveTask":"Interpretation","discriminator":"Fatty acids + calcium = soap formation = saponification.","whyCorrect":"Saponification consumes calcium → hypocalcaemia is a poor prognostic sign in pancreatitis.","trapType":"It is a type of dystrophic calcification, but the specific name of the process is saponification.","futureAlert":"Saponification consumes calcium → hypocalcaemia is a poor prognostic sign in pancreatitis.","r
