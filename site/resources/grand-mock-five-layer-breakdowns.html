<html lang="en" data-sv-map="zephyr">
<head>
<meta charset="utf-8" />

<title>Grand Mock — Five Layer Breakdowns | 200 MCQs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef1f4; --surface:#ffffff; --ink:#1c2b33; --muted:#5b6b73;
    --line:#e2e8ec; --line-strong:#cdd6db;
    --accent:#0e7c7b; --accent-weak:#e3f3f2; --accent-ink:#0a5655;
    --correct:#15803d; --correct-bg:#ecfdf3; --correct-line:#86efac;
    --wrong:#b91c1c; --wrong-bg:#fef2f2; --wrong-line:#fca5a5;
    --warn:#b45309; --warn-bg:#fff7ed;
    --radius:12px; --radius-sm:9px;
    --shadow:0 1px 2px rgba(16,32,40,.06), 0 1px 3px rgba(16,32,40,.05);
    --sans:'Inter',system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    --serif:'Playfair Display',Georgia,'Times New Roman',serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--sans);
    font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:840px; margin:0 auto; padding:0 18px 96px;}
  /* Top bar */
  header.bar{
    position:sticky; top:0; z-index:20; background:rgba(255,255,255,.92);
    backdrop-filter:saturate(140%) blur(8px); border-bottom:1px solid var(--line);
  }
  .bar-inner{max-width:840px; margin:0 auto; padding:12px 18px; display:flex; align-items:center; gap:14px;}
  .bar h1{font-family:var(--serif); font-weight:700; font-size:18px; margin:0; letter-spacing:.2px; line-height:1.2;}
  .bar .sub{font-size:12px; color:var(--muted); margin-top:2px;}
  .bar .spacer{flex:1}
  .stat{font-size:12.5px; color:var(--muted); white-space:nowrap;}
  .stat b{color:var(--ink); font-weight:600;}
  .progress{height:6px; background:var(--line); border-radius:99px; overflow:hidden; margin-top:8px;}
  .progress > i{display:block; height:100%; width:0%; background:linear-gradient(90deg,var(--accent),#13a89f); transition:width .35s ease;}
  .tools{display:flex; gap:8px;}
  button.tool{
    font-family:var(--sans); font-size:12.5px; font-weight:600; cursor:pointer;
    border:1px solid var(--line-strong); background:#fff; color:var(--ink);
    padding:7px 12px; border-radius:8px; transition:.15s;
  }
  button.tool:hover{border-color:var(--accent); color:var(--accent-ink);}
  button.tool.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  button.tool.primary:hover{background:#0c6a69; color:#fff;}

  /* Intro */
  .intro{padding:26px 0 8px;}
  .intro h2{font-family:var(--serif); font-size:26px; margin:0 0 6px;}
  .intro p{color:var(--muted); margin:0; max-width:62ch;}

  /* Question card */
  .q{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
     padding:20px 20px 18px; margin:18px 0; box-shadow:var(--shadow); scroll-margin-top:84px;}
  .q-head{display:flex; align-items:flex-start; gap:12px;}
  .q-num{flex:none; width:30px; height:30px; border-radius:50%; background:var(--accent-weak);
         color:var(--accent-ink); font-weight:700; font-size:14px; display:flex; align-items:center; justify-content:center;}
  .q-stem{font-size:16.5px; font-weight:500; margin:0; line-height:1.5;}
  .q-meta{margin:10px 0 0 42px; font-size:12px; color:var(--muted); display:flex; gap:8px; flex-wrap:wrap;}
  .tag{display:inline-block; background:#f1f4f6; border:1px solid var(--line); border-radius:99px; padding:2px 9px; font-size:11.5px; color:#41525b;}
  .opts{margin:14px 0 0 42px; display:flex; flex-direction:column; gap:9px;}
  .opt{
    display:flex; align-items:flex-start; gap:11px; width:100%; text-align:left;
    font-family:var(--sans); font-size:15.5px; color:var(--ink); cursor:pointer;
    background:#fff; border:1.5px solid var(--line); border-radius:var(--radius-sm);
    padding:11px 13px; transition:.12s; line-height:1.45;
  }
  .opt:hover{border-color:var(--accent); background:#fafdfd;}
  .opt:focus-visible{outline:3px solid var(--accent-weak); outline-offset:1px;}
  .opt .badge{flex:none; width:24px; height:24px; border-radius:50%; border:1.5px solid var(--line-strong);
             color:var(--muted); font-weight:700; font-size:13px; display:flex; align-items:center; justify-content:center; background:#fff;}
  .opt.sel{border-color:var(--accent); background:var(--accent-weak);}
  .opt.sel .badge{background:var(--accent); border-color:var(--accent); color:#fff;}
  .opt.correct{border-color:var(--correct-line); background:var(--correct-bg);}
  .opt.correct .badge{background:var(--correct); border-color:var(--correct); color:#fff;}
  .opt.wrong{border-color:var(--wrong-line); background:var(--wrong-bg);}
  .opt.wrong .badge{background:var(--wrong); border-color:var(--wrong); color:#fff;}
  .opt.dim{opacity:.62;}

  .q-actions{margin:14px 0 0 42px; display:flex; gap:10px; align-items:center;}
  .reveal-btn{font-family:var(--sans); font-size:13.5px; font-weight:600; cursor:pointer;
     border:1px solid var(--accent); background:var(--accent); color:#fff; padding:8px 16px; border-radius:8px;}
  .reveal-btn:hover{background:#0c6a69;}
  .reveal-btn[disabled]{opacity:.5; cursor:default;}
  .verdict{font-size:13.5px; font-weight:700; padding:3px 0;}
  .verdict.ok{color:var(--correct);} .verdict.no{color:var(--wrong);}

  /* Explanation */
  .explain{margin:14px 0 0 42px; border-top:1px dashed var(--line-strong); padding-top:14px; display:none;}
  .explain.show{display:block;}
  .explain h4{font-family:var(--serif); font-size:15px; margin:0 0 10px; color:var(--accent-ink);}
  .field{display:grid; grid-template-columns:148px 1fr; gap:6px 12px; margin:0 0 9px; font-size:14px;}
  .field .k{color:var(--muted); font-weight:600; font-size:12.5px; padding-top:1px;}
  .field .v{color:var(--ink);}
  .field .v.alert{color:var(--warn);}
  .distract{margin:10px 0 0; border:1px solid var(--line); border-radius:var(--radius-sm); overflow:hidden;}
  .distract .row{display:grid; grid-template-columns:34px 1fr; gap:0; border-top:1px solid var(--line);}
  .distract .row:first-child{border-top:none;}
  .distract .dl{background:#f6f8f9; color:var(--muted); font-weight:700; font-size:13px; padding:9px 10px; text-align:center; border-right:1px solid var(--line);}
  .distract .dv{padding:9px 12px; font-size:13.5px; color:#33424a;}
  .distract .row.correct .dl{background:var(--correct-bg); color:var(--correct);}
  .distract .row.correct .dv{color:var(--correct); font-weight:600;}

  /* Score banner */
  .banner{position:sticky; bottom:14px; max-width:840px; margin:22px auto 0; background:var(--ink); color:#fff;
          border-radius:12px; padding:14px 18px; display:flex; align-items:center; gap:14px; box-shadow:0 8px 24px rgba(16,32,40,.18);}
  .banner .big{font-family:var(--serif); font-size:24px; font-weight:700;}
  .banner .lbl{font-size:13px; opacity:.8;}
  .banner button{margin-left:auto;}

  footer.foot{margin-top:30px; text-align:center; color:var(--muted); font-size:12px;}

  @media (max-width:560px){
    .field{grid-template-columns:1fr; gap:1px 0;}
    .field .k{margin-top:6px;}
    .opts,.q-meta,.q-actions,.explain{margin-left:0;}
    .bar .sub{display:none;}
  }
</style>

<script>
const DATA = {"slug":"Grand-Mock-Five-Layer-Breakdowns","subject":"Grand Mock — Five Layer Breakdowns","chapter":"200 MCQs","title":"Grand Mock — Five Layer Breakdowns | 200 MCQs","questions":[{"id":"GM-1","stem":"A 58-year-old male with hypertension and diabetes is started on enalapril. A few weeks later he complains of a persistent dry cough and facial swelling. Which mediator is primarily responsible for this side effect?","options":[{"letter":"A","text":"Angiotensin II"},{"letter":"B","text":"Bradykinin"},{"letter":"C","text":"Aldosterone"},{"letter":"D","text":"Renin"}],"correct":"B","testedConcept":"ACE inhibitor–induced cough and angioedema","cognitiveTask":"Interpretation","discriminator":"Dry cough + facial swelling on an ACE inhibitor = bradykinin accumulation, because ACE (kininase II) normally breaks bradykinin down.","whyCorrect":"ACEi side effects from bradykinin = cough + angioedema. Switch to an ARB (losartan), which spares bradykinin.","trapType":"Picking angiotensin II because ACE inhibitors 'act on' it — reduced angiotensin II explains the BP drop, not the cough.","futureAlert":"ACEi side effects from bradykinin = cough + angioedema. Switch to an ARB (losartan), which spares bradykinin.","reviseTopic":"Clinical Pharmacology","syllabusTopic":"Clinical Pharmacology","correctRule":"ACEi side effects from bradykinin = cough + angioedema. Switch to an ARB (losartan), which spares bradykinin.","distractors":{"A":"Angiotensin II levels fall on ACEi; that causes vasodilation and lower BP, not cough or swelling.","C":"Aldosterone falls on ACEi, causing hyperkalaemia — not cough or angioedema.","D":"Renin rises (loss of negative feedback) but has no role in cough or angioedema."}},{"id":"GM-2","stem":"A 45-year-old with Type 1 diabetes wants to control postprandial glucose spikes. Which insulin is most appropriate immediately before a meal?","options":[{"letter":"A","text":"Insulin glargine"},{"letter":"B","text":"Regular insulin"},{"letter":"C","text":"Insulin lispro"},{"letter":"D","text":"NPH insulin"}],"correct":"C","testedConcept":"Rapid-acting (prandial) insulin analogues","cognitiveTask":"Interpretation","discriminator":"'Immediately before a meal' = onset in 5–15 min, which only rapid-acting analogues (lispro, aspart, glulisine) deliver.","whyCorrect":"Bolus at mealtime = lispro/aspart/glulisine (0–15 min pre-meal); basal = glargine/detemir/degludec.","trapType":"Choosing regular insulin because it is 'short-acting' — it needs 30–45 min before eating.","futureAlert":"Bolus at mealtime = lispro/aspart/glulisine (0–15 min pre-meal); basal = glargine/detemir/degludec.","reviseTopic":"Clinical Pharmacology","syllabusTopic":"Clinical Pharmacology","correctRule":"Bolus at mealtime = lispro/aspart/glulisine (0–15 min pre-meal); basal = glargine/detemir/degludec.","distractors":{"A":"Glargine is a peakless 24-h basal insulin; it cannot cover a meal spike.","B":"Regular insulin onset is 30–60 min, so it must be given ~30 min before the meal, not immediately.","D":"NPH is intermediate-acting (onset 1–2 h, peak 4–10 h) — too slow for prandial control."}},{"id":"GM-3","stem":"A 35-year-old on standard ATT (isoniazid, rifampicin, pyrazinamide, ethambutol) develops decreased visual acuity and red-green colour confusion after two months. Which drug is responsible?","options":[{"letter":"A","text":"Isoniazid"},{"letter":"B","text":"Rifampicin"},{"letter":"C","text":"Pyrazinamide"},{"letter":"D","text":"Ethambutol"}],"correct":"D","testedConcept":"Ethambutol optic (retrobulbar) neuritis","cognitiveTask":"Interpretation","discriminator":"Red-green colour blindness + reduced acuity on ATT is the signature of ethambutol.","whyCorrect":"E = Eyes. Check baseline visual acuity and colour vision; stop ethambutol if vision changes.","trapType":"Isoniazid can cause optic neuritis rarely, but its classic toxicity is peripheral neuropathy.","futureAlert":"E = Eyes. Check baseline visual acuity and colour vision; stop ethambutol if vision changes.","reviseTopic":"Clinical Pharmacology","syllabusTopic":"Clinical Pharmacology","correctRule":"E = Eyes. Check baseline visual acuity and colour vision; stop ethambutol if vision changes.","distractors":{"A":"Isoniazid → peripheral neuropathy (B6 deficiency) and hepatitis; not classic colour-vision loss.","B":"Rifampicin → orange secretions, hepatitis, enzyme induction, flu-like syndrome.","C":"Pyrazinamide → hepatotoxicity and hyperuricaemia/gout."}},{"id":"GM-4","stem":"Which drug is relatively contraindicated in a patient with angina and a history of migraine?","options":[{"letter":"A","text":"Amlodipine"},{"letter":"B","text":"Metoprolol"},{"letter":"C","text":"Nitroglycerin"},{"letter":"D","text":"Verapamil"}],"correct":"C","testedConcept":"Nitrate-induced headache via cerebral vasodilation","cognitiveTask":"Interpretation","discriminator":"Nitrates dilate meningeal/cerebral vessels and reliably trigger throbbing headache — a migraine sufferer is the worst candidate.","whyCorrect":"Angina + migraine: prefer beta-blocker (propranolol/metoprolol) or verapamil — both also prevent migraine. Avoid nitrates.","trapType":"Picking metoprolol because beta-blockers have 'contraindications' — but beta-blockers are actually migraine prophylaxis.","futureAlert":"Angina + migraine: prefer beta-blocker (propranolol/metoprolol) or verapamil — both also prevent migraine. Avoid nitrates.","reviseTopic":"Clinical Pharmacology","syllabusTopic":"Clinical Pharmacology","correctRule":"Angina + migraine: prefer beta-blocker (propranolol/metoprolol) or verapamil — both also prevent migraine. Avoid nitrates.","distractors":{"A":"Amlodipine is an acceptable antianginal; flushing/headache are milder and it is not specifically contraindicated.","B":"Beta-blockers treat angina AND prevent migraine — an ideal choice, not a contraindication.","D":"Verapamil is used for migraine/cluster prophylaxis and angina — beneficial here."}},{"id":"GM-5","stem":"A 20-year-old with severe acute asthma (cannot complete sentences) remains severe after oxygen, nebulised salbutamol and IV corticosteroids. Most appropriate next drug?","options":[{"letter":"A","text":"Oral montelukast"},{"letter":"B","text":"IV propranolol"},{"letter":"C","text":"Inhaled sodium cromoglycate"},{"letter":"D","text":"IV magnesium sulfate"}],"correct":"D","testedConcept":"Escalation in acute severe asthma","cognitiveTask":"Interpretation","discriminator":"Failure of first-line (O₂ + SABA + steroids) in an acute attack → IV MgSO₄ (2 g over 20 min) as bronchodilator add-on.","whyCorrect":"Acute severe asthma ladder: O₂ → SABA + ipratropium → steroids → IV MgSO₄ → IV aminophylline/salbutamol → ICU/intubation.","trapType":"Choosing a controller drug (montelukast, cromoglycate) — they have no role in rescuing an acute attack.","futureAlert":"Acute severe asthma ladder: O₂ → SABA + ipratropium → steroids → IV MgSO₄ → IV aminophylline/salbutamol → ICU/intubation.","reviseTopic":"Clinical Pharmacology","syllabusTopic":"Clinical Pharmacology","correctRule":"Acute severe asthma ladder: O₂ → SABA + ipratropium → steroids → IV MgSO₄ → IV aminophylline/salbutamol → ICU/intubation.","distractors":{"A":"Montelukast is a maintenance leukotriene antagonist; onset too slow and not used in acute rescue.","B":"Propranolol (non-selective β-blocker) causes bronchospasm — dangerous in asthma.","C":"Cromoglycate is a prophylactic mast-cell stabiliser; useless once an attack is underway."}},{"id":"GM-6","stem":"A patient receiving a rapid IV vancomycin infusion develops sudden flushing of the face and upper body (Red Man syndrome). Primary cause?","options":[{"letter":"A","text":"IgE-mediated allergy"},{"letter":"B","text":"Histamine release"},{"letter":"C","text":"Kidney damage"},{"letter":"D","text":"Liver toxicity"}],"correct":"B","testedConcept":"Red Man syndrome — infusion-rate reaction","cognitiveTask":"Interpretation","discriminator":"Linked to RAPID infusion = direct, non-immunological mast-cell degranulation releasing histamine.","whyCorrect":"Prevent by infusing over ≥60 min and pre-treating with antihistamines; it is not a reason to label the patient 'vancomycin allergic'.","trapType":"Calling it an IgE allergy — it is anaphylactoid, needs no prior sensitisation and is not a true allergy.","futureAlert":"Prevent by infusing over ≥60 min and pre-treating with antihistamines; it is not a reason to label the patient 'vancomycin allergic'.","reviseTopic":"Clinical Pharmacology","syllabusTopic":"Clinical Pharmacology","correctRule":"Prevent by infusing over ≥60 min and pre-treating with antihistamines; it is not a reason to label the patient 'vancomycin allergic'.","distractors":{"A":"IgE allergy requires prior sensitisation; Red Man is rate-related and occurs on first dose.","C":"Nephrotoxicity is a vancomycin side effect but causes rising creatinine, not acute flushing.","D":"Vancomycin is not meaningfully hepatotoxic, and liver injury doesn't cause flushing."}},{"id":"GM-7","stem":"A patient on IV heparin receives an overdose and bleeds heavily. Specific antidote?","options":[{"letter":"A","text":"Vitamin K"},{"letter":"B","text":"Protamine sulfate"},{"letter":"C","text":"Fresh frozen plasma"},{"letter":"D","text":"Tranexamic acid"}],"correct":"B","testedConcept":"Heparin reversal","cognitiveTask":"Interpretation","discriminator":"Protamine is strongly basic (positive) and binds the acidic (negative) heparin, neutralising it.","whyCorrect":"Heparin → protamine (1 mg per ~100 units). Warfarin → vitamin K ± PCC/FFP. Dabigatran → idarucizumab.","trapType":"Swapping heparin and warfarin antidotes — vitamin K reverses warfarin.","futureAlert":"Heparin → protamine (1 mg per ~100 units). Warfarin → vitamin K ± PCC/FFP. Dabigatran → idarucizumab.","reviseTopic":"Clinical Pharmacology","syllabusTopic":"Clinical Pharmacology","correctRule":"Heparin → protamine (1 mg per ~100 units). Warfarin → vitamin K ± PCC/FFP. Dabigatran → idarucizumab.","distractors":{"A":"Vitamin K reverses warfarin by restoring factors II, VII, IX, X; no effect on heparin.","C":"FFP supplies clotting factors but does not neutralise heparin; not a specific antidote.","D":"Tranexamic acid is an antifibrinolytic; does not reverse heparin's antithrombin effect."}},{"id":"GM-8","stem":"A patient presents after an intentional paracetamol overdose. Specific antidote of choice?","options":[{"letter":"A","text":"Naloxone"},{"letter":"B","text":"N-acetylcysteine"},{"letter":"C","text":"Flumazenil"},{"letter":"D","text":"Protamine sulfate"}],"correct":"B","testedConcept":"Paracetamol (acetaminophen) poisoning","cognitiveTask":"Interpretation","discriminator":"Toxic metabolite NAPQI is detoxified by glutathione; NAC replenishes glutathione.","whyCorrect":"Paracetamol → NAC (most effective within 8 h, use the treatment nomogram). Opioid → naloxone. Benzodiazepine → flumazenil. Heparin → protamine.","trapType":"Mixing up toxin–antidote pairs that sit side by side in the options.","futureAlert":"Paracetamol → NAC (most effective within 8 h, use the treatment nomogram). Opioid → naloxone. Benzodiazepine → flumazenil. Heparin → protamine.","reviseTopic":"Clinical Pharmacology","syllabusTopic":"Clinical Pharmacology","correctRule":"Paracetamol → NAC (most effective within 8 h, use the treatment nomogram). Opioid → naloxone. Benzodiazepine → flumazenil. Heparin → protamine.","distractors":{"A":"Naloxone reverses opioids.","C":"Flumazenil reverses benzodiazepines.","D":"Protamine reverses heparin."}},{"id":"GM-9","stem":"A 55-year-old with Type 2 diabetes is prescribed empagliflozin. Primary mechanism of action?","options":[{"letter":"A","text":"Inhibits DPP-4"},{"letter":"B","text":"Activates GLP-1 receptors"},{"letter":"C","text":"Inhibits SGLT2 in the proximal renal tubule"},{"letter":"D","text":"Activates PPAR-gamma"}],"correct":"C","testedConcept":"SGLT2 inhibitors (-gliflozins)","cognitiveTask":"Interpretation","discriminator":"The '-gliflozin' suffix = SGLT2 inhibitor → glycosuria by blocking glucose reabsorption in the PCT.","whyCorrect":"Gliflozins: glycosuria, weight loss, CV/renal benefit; side effects UTI/genital mycotic infection, euglycaemic DKA.","trapType":"Confusing suffixes: -gliptin (DPP-4), -glutide (GLP-1), -glitazone (PPAR-γ).","futureAlert":"Gliflozins: glycosuria, weight loss, CV/renal benefit; side effects UTI/genital mycotic infection, euglycaemic DKA.","reviseTopic":"Clinical Pharmacology","syllabusTopic":"Clinical Pharmacology","correctRule":"Gliflozins: glycosuria, weight loss, CV/renal benefit; side effects UTI/genital mycotic infection, euglycaemic DKA.","distractors":{"A":"DPP-4 inhibitors are sitagliptin/vildagliptin (-gliptins).","B":"GLP-1 agonists are liraglutide/semaglutide (-glutides), given by injection.","D":"PPAR-γ agonists are pioglitazone/rosiglitazone (-glitazones)."}},{"id":"GM-10","stem":"All of the following regarding theophylline are true EXCEPT:","options":[{"letter":"A","text":"Narrow spectrum (narrow therapeutic index)"},{"letter":"B","text":"Inhibits PDE"},{"letter":"C","text":"Effect increased by adenosine"},{"letter":"D","text":"Can cause coma"}],"correct":"C","testedConcept":"Theophylline pharmacology","cognitiveTask":"Interpretation","discriminator":"Theophylline is an adenosine-receptor ANTAGONIST, so adenosine opposes rather than enhances its effect.","whyCorrect":"Theophylline: non-selective PDE inhibitor + adenosine antagonist; narrow TI; toxicity = arrhythmias, seizures, coma; levels rise with CYP450 inhibitors (erythromycin, ciprofloxacin, cimetidine).","trapType":"Reading 'narrow spectrum' and marking A false — the intended meaning is its narrow therapeutic window.","futureAlert":"Theophylline: non-selective PDE inhibitor + adenosine antagonist; narrow TI; toxicity = arrhythmias, seizures, coma; levels rise with CYP450 inhibitors (erythromycin, ciprofloxacin, cimetidine).","reviseTopic":"Clinical Pharmacology","syllabusTopic":"Clinical Pharmacology","correctRule":"Theophylline: non-selective PDE inhibitor + adenosine antagonist; narrow TI; toxicity = arrhythmias, seizures, coma; levels rise with CYP450 inhibitors (erythromycin, ciprofloxacin, cimetidine).","distractors":{"A":"True — therapeutic range is tight (10–20 mg/L), so toxicity is common.","B":"True — it non-selectively inhibits phosphodiesterases, raising cAMP.","D":"True — severe toxicity causes seizures, arrhythmias and coma."}},{"id":"GM-11","stem":"A 60-year-old started on atorvastatin develops severe muscle pain, tenderness and weakness with markedly raised CK. Most likely adverse effect?","options":[{"letter":"A","text":"Hepatotoxicity"},{"letter":"B","text":"Myopathy"},{"letter":"C","text":"Nephrotoxicity"},{"letter":"D","text":"Hypoglycaemia"}],"correct":"B","testedConcept":"Statin-associated myopathy","cognitiveTask":"Interpretation","discriminator":"Muscle pain + weakness + high CK on a statin = myopathy (risk of rhabdomyolysis).","whyCorrect":"Statin + myalgia → check CK; CK >10× ULN → stop statin. Risk ↑ with fibrates (gemfibrozil), macrolides, azoles.","trapType":"Picking hepatotoxicity because LFTs are monitored on statins — but the clue here is CK.","futureAlert":"Statin + myalgia → check CK; CK >10× ULN → stop statin. Risk ↑ with fibrates (gemfibrozil), macrolides, azoles.","reviseTopic":"Clinical Pharmacology","syllabusTopic":"Clinical Pharmacology","correctRule":"Statin + myalgia → check CK; CK >10× ULN → stop statin. Risk ↑ with fibrates (gemfibrozil), macrolides, azoles.","distractors":{"A":"Hepatotoxicity presents with raised transaminases, not raised CK and muscle weakness.","C":"Kidney injury can follow rhabdomyolysis but is a downstream complication, not the primary adverse effect.","D":"Statins do not cause hypoglycaemia (they slightly raise diabetes risk)."}},{"id":"GM-12","stem":"A 22-year-old has blurred vision, eye strain and headaches when reading. The corneal curvature is unequal so light focuses at multiple points. Most appropriate lens?","options":[{"letter":"A","text":"Convex lens"},{"letter":"B","text":"Concave lens"},{"letter":"C","text":"Cylindrical lens"},{"letter":"D","text":"Bifocal lens"}],"correct":"C","testedConcept":"Astigmatism","cognitiveTask":"Interpretation","discriminator":"Unequal corneal curvature → different meridians focus at different points = astigmatism → cylindrical lens.","whyCorrect":"Myopia → concave. Hypermetropia → convex. Astigmatism → cylindrical (or toric). Presbyopia → bifocal/progressive.","trapType":"Choosing convex/concave, which correct spherical errors only.","futureAlert":"Myopia → concave. Hypermetropia → convex. Astigmatism → cylindrical (or toric). Presbyopia → bifocal/progressive.","reviseTopic":"Ophthalmology","syllabusTopic":"Ophthalmology","correctRule":"Myopia → concave. Hypermetropia → convex. Astigmatism → cylindrical (or toric). Presbyopia → bifocal/progressive.","distractors":{"A":"Convex lenses correct hypermetropia (focus behind the retina).","B":"Concave lenses correct myopia (focus in front of the retina).","D":"Bifocals are for presbyopia in older adults."}},{"id":"GM-13","stem":"A 28-year-old has a painless, firm lump on the upper eyelid for 3 weeks with no redness or tenderness. Most likely diagnosis?","options":[{"letter":"A","text":"Hordeolum"},{"letter":"B","text":"Chalazion"},{"letter":"C","text":"Blepharitis"},{"letter":"D","text":"Dacryocystitis"}],"correct":"B","testedConcept":"Chalazion (meibomian lipogranuloma)","cognitiveTask":"Interpretation","discriminator":"PAINLESS + firm + weeks-long = chalazion. Painful + acute + red = hordeolum.","whyCorrect":"Chalazion: warm compresses; incision and curettage if persistent. Recurrent chalazion in elderly → biopsy (sebaceous carcinoma).","trapType":"Hordeolum is also an eyelid lump, but it is acutely painful and inflamed.","futureAlert":"Chalazion: warm compresses; incision and curettage if persistent. Recurrent chalazion in elderly → biopsy (sebaceous carcinoma).","reviseTopic":"Ophthalmology","syllabusTopic":"Ophthalmology","correctRule":"Chalazion: warm compresses; incision and curettage if persistent. Recurrent chalazion in elderly → biopsy (sebaceous carcinoma).","distractors":{"A":"Hordeolum (stye) is an acute painful infected gland.","C":"Blepharitis is diffuse lid-margin inflammation with crusting, not a discrete lump.","D":"Dacryocystitis is a painful swelling at the medial canthus (lacrimal sac), not upper lid."}},{"id":"GM-14","stem":"A 65-year-old has primary open-angle glaucoma. Which topical first-line drug works by increasing aqueous outflow?","options":[{"letter":"A","text":"Timolol"},{"letter":"B","text":"Latanoprost"},{"letter":"C","text":"Pilocarpine"},{"letter":"D","text":"Atropine"}],"correct":"B","testedConcept":"Prostaglandin analogues in POAG","cognitiveTask":"Interpretation","discriminator":"First-line + increases OUTFLOW (uveoscleral) = prostaglandin analogue (latanoprost).","whyCorrect":"Latanoprost → ↑ uveoscleral outflow (side effects: iris darkening, lash growth). Timolol → ↓ production. Pilocarpine → ↑ trabecular outflow (miosis).","trapType":"Timolol is also first-line, but it works by DECREASING aqueous production.","futureAlert":"Latanoprost → ↑ uveoscleral outflow (side effects: iris darkening, lash growth). Timolol → ↓ production. Pilocarpine → ↑ trabecular outflow (miosis).","reviseTopic":"Ophthalmology","syllabusTopic":"Ophthalmology","correctRule":"Latanoprost → ↑ uveoscleral outflow (side effects: iris darkening, lash growth). Timolol → ↓ production. Pilocarpine → ↑ trabecular outflow (miosis).","distractors":{"A":"Timolol reduces aqueous production; it doesn't increase outflow.","C":"Pilocarpine increases trabecular outflow but is not first-line for POAG (side effects, frequent dosing).","D":"Atropine dilates the pupil and can precipitate angle closure — contraindicated."}},{"id":"GM-15","stem":"A patient with diabetes for 15 years has decreased vision in both eyes, dull foveal reflex and macular oedema on OCT. Management?","options":[{"letter":"A","text":"Panretinal photocoagulation"},{"letter":"B","text":"Acetazolamide"},{"letter":"C","text":"Intravitreal anti-VEGF"},{"letter":"D","text":"Oral steroids"}],"correct":"C","testedConcept":"Centre-involving diabetic macular oedema (DMO)","cognitiveTask":"Interpretation","discriminator":"OCT-confirmed macular oedema with vision loss = intravitreal anti-VEGF (ranibizumab, aflibercept, bevacizumab).","whyCorrect":"DMO → anti-VEGF first-line (steroid implants/focal laser second-line). PDR → PRP ± anti-VEGF.","trapType":"PRP is for proliferative retinopathy (neovascularisation), not macular oedema.","futureAlert":"DMO → anti-VEGF first-line (steroid implants/focal laser second-line). PDR → PRP ± anti-VEGF.","reviseTopic":"Ophthalmology","syllabusTopic":"Ophthalmology","correctRule":"DMO → anti-VEGF first-line (steroid implants/focal laser second-line). PDR → PRP ± anti-VEGF.","distractors":{"A":"PRP treats proliferative disease and can worsen macular oedema.","B":"Acetazolamide lowers IOP; no role in diabetic macular oedema.","D":"Oral steroids are not used; steroids for DMO are intravitreal (dexamethasone implant) and second-line."}},{"id":"GM-16","stem":"A 30-year-old has a painful red left eye, severe photophobia and blurred vision. There is circumcorneal injection and a constricted pupil. Diagnosis?","options":[{"letter":"A","text":"Acute conjunctivitis"},{"letter":"B","text":"Acute anterior uveitis"},{"letter":"C","text":"Acute angle-closure glaucoma"},{"letter":"D","text":"Corneal abrasion"}],"correct":"B","testedConcept":"Acute anterior uveitis (iritis)","cognitiveTask":"Interpretation","discriminator":"Circumcorneal (ciliary) flush + photophobia + SMALL pupil = anterior uveitis.","whyCorrect":"Red eye pupil clue: small irregular = uveitis; mid-dilated fixed = acute glaucoma; normal = conjunctivitis/abrasion. Treat uveitis with topical steroid + cycloplegic.","trapType":"Angle-closure glaucoma is also a painful red eye, but the pupil is mid-dilated and fixed.","futureAlert":"Red eye pupil clue: small irregular = uveitis; mid-dilated fixed = acute glaucoma; normal = conjunctivitis/abrasion. Treat uveitis with topical steroid + cycloplegic.","reviseTopic":"Ophthalmology","syllabusTopic":"Ophthalmology","correctRule":"Red eye pupil clue: small irregular = uveitis; mid-dilated fixed = acute glaucoma; normal = conjunctivitis/abrasion. Treat uveitis with topical steroid + cycloplegic.","distractors":{"A":"Conjunctivitis: peripheral injection, discharge, normal vision and pupil, little pain.","C":"Angle closure: mid-dilated fixed pupil, hazy cornea, very high IOP, nausea/vomiting.","D":"Corneal abrasion: history of trauma, foreign-body sensation, fluorescein staining; pupil normal."}},{"id":"GM-17","stem":"Which medication immediately lowers intraocular pressure in an attack of acute congestive glaucoma?","options":[{"letter":"A","text":"Pilocarpine"},{"letter":"B","text":"Timolol"},{"letter":"C","text":"Mannitol"},{"letter":"D","text":"Atropine"}],"correct":"C","testedConcept":"Rapid IOP reduction in acute angle closure","cognitiveTask":"Interpretation","discriminator":"'Immediately' = IV hyperosmotic agent; mannitol dehydrates the vitreous within 30–60 min.","whyCorrect":"Acute angle closure: IV acetazolamide + IV mannitol + topical timolol/apraclonidine → pilocarpine once IOP drops → definitive laser peripheral iridotomy.","trapType":"Pilocarpine is part of treatment, but it is ineffective at very high IOP (ischaemic, paralysed sphincter) until pressure falls.","futureAlert":"Acute angle closure: IV acetazolamide + IV mannitol + topical timolol/apraclonidine → pilocarpine once IOP drops → definitive laser peripheral iridotomy.","reviseTopic":"Ophthalmology","syllabusTopic":"Ophthalmology","correctRule":"Acute angle closure: IV acetazolamide + IV mannitol + topical timolol/apraclonidine → pilocarpine once IOP drops → definitive laser peripheral iridotomy.","distractors":{"A":"Pilocarpine works only after IOP is partly reduced; it doesn't act immediately.","B":"Timolol helps but acts slower and less powerfully than IV mannitol.","D":"Atropine dilates the pupil and worsens angle closure — contraindicated."}},{"id":"GM-18","stem":"A newborn has a cystic lumbosacral swelling; the sac contains only meninges and CSF with no neural tissue. Diagnosis?","options":[{"letter":"A","text":"Myelomeningocele"},{"letter":"B","text":"Meningocele"},{"letter":"C","text":"Spina bifida occulta"},{"letter":"D","text":"Encephalocele"}],"correct":"B","testedConcept":"Neural tube defects — content of the sac","cognitiveTask":"Interpretation","discriminator":"Meninges + CSF ONLY (no cord/roots) = meningocele.","whyCorrect":"Occulta: no sac (tuft of hair/dimple). Meningocele: meninges + CSF. Myelomeningocele: + neural tissue (most common, with deficits). Folic acid prevents NTDs.","trapType":"Myelomeningocele also has a sac, but it contains spinal cord/nerve roots.","futureAlert":"Occulta: no sac (tuft of hair/dimple). Meningocele: meninges + CSF. Myelomeningocele: + neural tissue (most common, with deficits). Folic acid prevents NTDs.","reviseTopic":"Applied Anatomy","syllabusTopic":"Applied Anatomy","correctRule":"Occulta: no sac (tuft of hair/dimple). Meningocele: meninges + CSF. Myelomeningocele: + neural tissue (most common, with deficits). Folic acid prevents NTDs.","distractors":{"A":"Myelomeningocele includes neural tissue and usually neurological deficit.","C":"Spina bifida occulta has no herniated sac — just a vertebral arch defect.","D":"Encephalocele is a cranial (occipital) herniation, not lumbosacral."}},{"id":"GM-19","stem":"A 6-year-old with a supracondylar humerus fracture cannot flex the index and middle fingers and has sensory loss over the palmar lateral 3½ digits. Which nerve is injured?","options":[{"letter":"A","text":"Radial"},{"letter":"B","text":"Axillary"},{"letter":"C","text":"Ulnar"},{"letter":"D","text":"Median"}],"correct":"D","testedConcept":"Median nerve injury at the elbow","cognitiveTask":"Interpretation","discriminator":"Loss of index/middle finger flexion (pointing finger / hand of benediction) + palmar lateral 3½ digit numbness = median nerve.","whyCorrect":"Supracondylar fracture: median/AIN most commonly injured; brachial artery at risk (Volkmann ischaemic contracture).","trapType":"The ulnar nerve is near the elbow too, but it supplies the medial 1½ digits.","futureAlert":"Supracondylar fracture: median/AIN most commonly injured; brachial artery at risk (Volkmann ischaemic contracture).","reviseTopic":"Applied Anatomy","syllabusTopic":"Applied Anatomy","correctRule":"Supracondylar fracture: median/AIN most commonly injured; brachial artery at risk (Volkmann ischaemic contracture).","distractors":{"A":"Radial injury → wrist drop, dorsal first web space numbness.","B":"Axillary injury follows shoulder dislocation/surgical neck fracture → deltoid weakness, regimental badge numbness.","C":"Ulnar injury → claw of ring/little fingers, medial 1½ digit numbness."}},{"id":"GM-20","stem":"A patient with pontine haemorrhage has pinpoint pupils. Which artery is most likely damaged?","options":[{"letter":"A","text":"Anterior cerebral"},{"letter":"B","text":"Basilar"},{"letter":"C","text":"Middle cerebral"},{"letter":"D","text":"Posterior inferior cerebellar"}],"correct":"B","testedConcept":"Blood supply of the pons","cognitiveTask":"Interpretation","discriminator":"The pons is supplied by pontine branches of the basilar artery; pontine bleed → disrupted sympathetic fibres → pinpoint pupils.","whyCorrect":"Pinpoint pupils + coma + hyperpyrexia = pontine haemorrhage (basilar territory). Differential: opioid overdose.","trapType":"PICA is posterior circulation too, but it supplies the lateral medulla and cerebellum.","futureAlert":"Pinpoint pupils + coma + hyperpyrexia = pontine haemorrhage (basilar territory). Differential: opioid overdose.","reviseTopic":"Applied Anatomy","syllabusTopic":"Applied Anatomy","correctRule":"Pinpoint pupils + coma + hyperpyrexia = pontine haemorrhage (basilar territory). Differential: opioid overdose.","distractors":{"A":"ACA supplies medial frontal/parietal cortex (leg area).","C":"MCA supplies lateral cortex and internal capsule — not the brainstem.","D":"PICA → lateral medullary (Wallenberg) syndrome."}},{"id":"GM-21","stem":"A 62-year-old with pericardial effusion undergoes pericardiocentesis via the intercostal space adjacent to the sternum. Which space?","options":[{"letter":"A","text":"Right 4th"},{"letter":"B","text":"Left 4th"},{"letter":"C","text":"Right 5th"},{"letter":"D","text":"Left 5th"}],"correct":"D","testedConcept":"Parasternal approach for pericardiocentesis","cognitiveTask":"Interpretation","discriminator":"Left 5th (or 6th) intercostal space next to the sternum lies over the bare area of the pericardium where lung/pleura are absent (cardiac notch).","whyCorrect":"Parasternal route: left 5th ICS, close to the sternum to avoid the internal thoracic artery (~1 cm lateral). Most common route overall is subxiphoid.","trapType":"Choosing the 4th space — the lung and pleura are more likely in the path there.","futureAlert":"Parasternal route: left 5th ICS, close to the sternum to avoid the internal thoracic artery (~1 cm lateral). Most common route overall is subxiphoid.","reviseTopic":"Applied Anatomy","syllabusTopic":"Applied Anatomy","correctRule":"Parasternal route: left 5th ICS, close to the sternum to avoid the internal thoracic artery (~1 cm lateral). Most common route overall is subxiphoid.","distractors":{"A":"Right side would hit the right pleura/lung; no cardiac notch on the right.","B":"Higher spaces risk the lung and pleura — the bare area is lower.","C":"Right-sided approach risks the pleura and right atrium."}},{"id":"GM-22","stem":"A newborn has VSD, overriding aorta, pulmonary stenosis and RV hypertrophy. Which defect fits?","options":[{"letter":"A","text":"Atrial septal defect"},{"letter":"B","text":"DiGeorge syndrome"},{"letter":"C","text":"Down's syndrome"},{"letter":"D","text":"Tetralogy of Fallot"}],"correct":"D","testedConcept":"Tetralogy of Fallot","cognitiveTask":"Interpretation","discriminator":"The four named features ARE the tetralogy — caused by anterosuperior displacement of the infundibular septum.","whyCorrect":"ToF: most common cyanotic CHD after infancy; boot-shaped heart; 'tet spells' relieved by squatting.","trapType":"DiGeorge is associated with ToF, but the question asks which defect these anomalies define.","futureAlert":"ToF: most common cyanotic CHD after infancy; boot-shaped heart; 'tet spells' relieved by squatting.","reviseTopic":"Applied Anatomy","syllabusTopic":"Applied Anatomy","correctRule":"ToF: most common cyanotic CHD after infancy; boot-shaped heart; 'tet spells' relieved by squatting.","distractors":{"A":"ASD is a single septal defect with fixed split S2, not these four features.","B":"DiGeorge (22q11) is a syndrome associated with ToF/truncus, not the defect itself.","C":"Down's is classically linked to AVSD (endocardial cushion defect)."}},{"id":"GM-23","stem":"The maxillary nerve (V2) passes through which skull opening?","options":[{"letter":"A","text":"Foramen ovale"},{"letter":"B","text":"Foramen spinosum"},{"letter":"C","text":"Foramen rotundum"},{"letter":"D","text":"Superior orbital fissure"}],"correct":"C","testedConcept":"Trigeminal divisions and their foramina","cognitiveTask":"Interpretation","discriminator":"V2 → foramen rotundum (into pterygopalatine fossa).","whyCorrect":"'Standing Room Only': V1 Superior orbital fissure, V2 Rotundum, V3 Ovale.","trapType":"Foramen ovale is the neighbouring trigeminal exit but carries V3.","futureAlert":"'Standing Room Only': V1 Superior orbital fissure, V2 Rotundum, V3 Ovale.","reviseTopic":"Applied Anatomy","syllabusTopic":"Applied Anatomy","correctRule":"'Standing Room Only': V1 Superior orbital fissure, V2 Rotundum, V3 Ovale.","distractors":{"A":"Foramen ovale carries V3 (mandibular) and the lesser petrosal nerve.","B":"Foramen spinosum carries the middle meningeal artery.","D":"Superior orbital fissure carries V1, III, IV, VI and the superior ophthalmic vein."}},{"id":"GM-24","stem":"A 65-year-old has sudden weakness and sensory loss in the right leg, much more than arm or face, with urinary incontinence. Which artery is occluded?","options":[{"letter":"A","text":"Middle cerebral"},{"letter":"B","text":"Anterior cerebral"},{"letter":"C","text":"Posterior cerebral"},{"letter":"D","text":"Anterior inferior cerebellar"}],"correct":"B","testedConcept":"ACA stroke","cognitiveTask":"Interpretation","discriminator":"Leg > arm/face + urinary incontinence = medial frontal lobe (paracentral lobule) = ACA.","whyCorrect":"ACA: contralateral leg, incontinence, abulia. MCA: face/arm, aphasia (dominant), neglect. PCA: homonymous hemianopia with macular sparing.","trapType":"MCA is the most common stroke, but it gives face/arm > leg.","futureAlert":"ACA: contralateral leg, incontinence, abulia. MCA: face/arm, aphasia (dominant), neglect. PCA: homonymous hemianopia with macular sparing.","reviseTopic":"Applied Anatomy","syllabusTopic":"Applied Anatomy","correctRule":"ACA: contralateral leg, incontinence, abulia. MCA: face/arm, aphasia (dominant), neglect. PCA: homonymous hemianopia with macular sparing.","distractors":{"A":"MCA spares the leg relatively; face and arm dominate.","C":"PCA → visual field loss, not leg weakness.","D":"AICA → lateral pontine syndrome (facial palsy, deafness, ataxia)."}},{"id":"GM-25","stem":"The appendicular artery is a direct branch of which artery?","options":[{"letter":"A","text":"Right colic"},{"letter":"B","text":"Middle colic"},{"letter":"C","text":"Ileocolic"},{"letter":"D","text":"Superior mesenteric"}],"correct":"C","testedConcept":"Blood supply of the appendix","cognitiveTask":"Interpretation","discriminator":"Appendicular artery arises from the ileocolic artery (often its inferior/posterior caecal branch) — a branch of SMA.","whyCorrect":"Appendicular artery is an end artery in the mesoappendix → thrombosis causes gangrene/perforation in appendicitis.","trapType":"Choosing SMA — it is the parent trunk, not the DIRECT origin.","futureAlert":"Appendicular artery is an end artery in the mesoappendix → thrombosis causes gangrene/perforation in appendicitis.","reviseTopic":"Applied Anatomy","syllabusTopic":"Applied Anatomy","correctRule":"Appendicular artery is an end artery in the mesoappendix → thrombosis causes gangrene/perforation in appendicitis.","distractors":{"A":"Right colic supplies the ascending colon.","B":"Middle colic supplies the transverse colon.","D":"SMA gives off the ileocolic artery; the appendicular artery is not its direct branch."}},{"id":"GM-26","stem":"A 40-year-old with a stab wound to the anterior thigh cannot extend the knee and has an absent patellar reflex. Which nerve?","options":[{"letter":"A","text":"Sciatic"},{"letter":"B","text":"Obturator"},{"letter":"C","text":"Femoral"},{"letter":"D","text":"Tibial"}],"correct":"C","testedConcept":"Femoral nerve injury","cognitiveTask":"Interpretation","discriminator":"Quadriceps paralysis (no knee extension) + lost knee jerk (L2–L4) = femoral nerve.","whyCorrect":"Femoral: knee extension, knee jerk, anterior thigh + medial leg (saphenous) sensation.","trapType":"Obturator is also anterior/medial thigh but supplies adductors.","futureAlert":"Femoral: knee extension, knee jerk, anterior thigh + medial leg (saphenous) sensation.","reviseTopic":"Applied Anatomy","syllabusTopic":"Applied Anatomy","correctRule":"Femoral: knee extension, knee jerk, anterior thigh + medial leg (saphenous) sensation.","distractors":{"A":"Sciatic → hamstrings and everything below the knee; ankle jerk lost.","B":"Obturator → thigh adduction weakness, medial thigh numbness.","D":"Tibial → plantar flexion loss, sole numbness, absent ankle jerk."}},{"id":"GM-27","stem":"Which cervical roots form the phrenic nerve?","options":[{"letter":"A","text":"C1–C3"},{"letter":"B","text":"C2–C4"},{"letter":"C","text":"C3–C5"},{"letter":"D","text":"C4–C6"}],"correct":"C","testedConcept":"Phrenic nerve roots","cognitiveTask":"Interpretation","discriminator":"C3, C4, C5 (mainly C4).","whyCorrect":"'C3, 4, 5 keeps the diaphragm alive.' Cord injury above C3 → ventilator dependence. Referred shoulder-tip pain via C4.","trapType":"Off-by-one options; C2–C4 is the cervical plexus range.","futureAlert":"'C3, 4, 5 keeps the diaphragm alive.' Cord injury above C3 → ventilator dependence. Referred shoulder-tip pain via C4.","reviseTopic":"Applied Anatomy","syllabusTopic":"Applied Anatomy","correctRule":"'C3, 4, 5 keeps the diaphragm alive.' Cord injury above C3 → ventilator dependence. Referred shoulder-tip pain via C4.","distractors":{"A":"C1–C3 supply neck muscles/ansa cervicalis, not the diaphragm.","B":"Misses C5 and includes C2.","D":"C5–C6 are brachial plexus territory."}},{"id":"GM-28","stem":"A 60-year-old has sudden weakness of the right face and right arm with relative leg sparing. Which artery?","options":[{"letter":"A","text":"Anterior cerebral"},{"letter":"B","text":"Middle cerebral"},{"letter":"C","text":"Posterior cerebral"},{"letter":"D","text":"Vertebral"}],"correct":"B","testedConcept":"MCA stroke","cognitiveTask":"Interpretation","discriminator":"Face + arm > leg = lateral motor cortex (MCA territory).","whyCorrect":"Left MCA → right face/arm weakness + aphasia; right MCA → left weakness + neglect.","trapType":"Reversing the ACA/MCA homunculus pattern.","futureAlert":"Left MCA → right face/arm weakness + aphasia; right MCA → left weakness + neglect.","reviseTopic":"Applied Anatomy","syllabusTopic":"Applied Anatomy","correctRule":"Left MCA → right face/arm weakness + aphasia; right MCA → left weakness + neglect.","distractors":{"A":"ACA: leg > arm/face.","C":"PCA: homonymous hemianopia.","D":"Vertebral: lateral medullary signs, crossed findings, vertigo."}},{"id":"GM-29","stem":"A 26-year-old has a missed period, lower abdominal pain and slight vaginal bleeding. Ultrasound shows the gestational sac in the fallopian tube. Diagnosis?","options":[{"letter":"A","text":"Normal intrauterine pregnancy"},{"letter":"B","text":"PID"},{"letter":"C","text":"Ovarian cyst"},{"letter":"D","text":"Ectopic pregnancy"}],"correct":"D","testedConcept":"Tubal ectopic pregnancy","cognitiveTask":"Interpretation","discriminator":"Gestational sac seen OUTSIDE the uterus (tube) = ectopic.","whyCorrect":"Amenorrhoea + pain + bleeding = ectopic until proven otherwise. Most common site: ampulla. Stable → methotrexate/salpingostomy; unstable → laparotomy.","trapType":"Overthinking — the imaging gives the diagnosis outright.","futureAlert":"Amenorrhoea + pain + bleeding = ectopic until proven otherwise. Most common site: ampulla. Stable → methotrexate/salpingostomy; unstable → laparotomy.","reviseTopic":"Gynae & Obs","syllabusTopic":"Gynae & Obs","correctRule":"Amenorrhoea + pain + bleeding = ectopic until proven otherwise. Most common site: ampulla. Stable → methotrexate/salpingostomy; unstable → laparotomy.","distractors":{"A":"Intrauterine pregnancy has the sac in the uterine cavity.","B":"PID gives fever, discharge, cervical motion tenderness — no gestational sac.","C":"Ovarian cyst doesn't produce a tubal gestational sac."}},{"id":"GM-30","stem":"A 30-year-old at 28 weeks is diagnosed with gestational diabetes on OGTT. First-line management?","options":[{"letter":"A","text":"Metformin"},{"letter":"B","text":"Subcutaneous insulin"},{"letter":"C","text":"Medical nutrition therapy and exercise"},{"letter":"D","text":"Oral glibenclamide"}],"correct":"C","testedConcept":"Step-wise management of GDM","cognitiveTask":"Interpretation","discriminator":"Newly diagnosed GDM without a severe level → start with diet and exercise for 1–2 weeks.","whyCorrect":"GDM: diet/exercise → if targets not met, insulin (or metformin per NICE). Start insulin immediately if fasting glucose ≥7.0 mmol/L at diagnosis.","trapType":"Jumping to insulin because it is 'the safest drug in pregnancy' — it is the drug of choice, not the first step.","futureAlert":"GDM: diet/exercise → if targets not met, insulin (or metformin per NICE). Start insulin immediately if fasting glucose ≥7.0 mmol/L at diagnosis.","reviseTopic":"Gynae & Obs","syllabusTopic":"Gynae & Obs","correctRule":"GDM: diet/exercise → if targets not met, insulin (or metformin per NICE). Start insulin immediately if fasting glucose ≥7.0 mmol/L at diagnosis.","distractors":{"A":"Metformin is added if lifestyle fails, not first.","B":"Insulin is used if lifestyle fails or glucose is very high at diagnosis.","D":"Glibenclamide crosses the placenta (neonatal hypoglycaemia); not first-line."}},{"id":"GM-31","stem":"A 22-year-old presents 48 hours after unprotected intercourse wanting to prevent pregnancy. Most appropriate emergency contraceptive pill?","options":[{"letter":"A","text":"Mifepristone"},{"letter":"B","text":"Levonorgestrel"},{"letter":"C","text":"Misoprostol"},{"letter":"D","text":"Medroxyprogesterone"}],"correct":"B","testedConcept":"Emergency contraception","cognitiveTask":"Interpretation","discriminator":"Within 72 h → levonorgestrel 1.5 mg single dose (delays ovulation).","whyCorrect":"LNG ≤72 h; ulipristal ≤120 h; copper IUD ≤5 days (most effective).","trapType":"Mifepristone and misoprostol are abortifacients, not standard ECPs.","futureAlert":"LNG ≤72 h; ulipristal ≤120 h; copper IUD ≤5 days (most effective).","reviseTopic":"Gynae & Obs","syllabusTopic":"Gynae & Obs","correctRule":"LNG ≤72 h; ulipristal ≤120 h; copper IUD ≤5 days (most effective).","distractors":{"A":"Mifepristone is used for medical termination (low-dose EC exists in some countries but is not the standard choice).","C":"Misoprostol is a prostaglandin for termination/PPH; not a contraceptive.","D":"Medroxyprogesterone (Depo) is a long-acting injection, not emergency contraception."}},{"id":"GM-32","stem":"At what gestational age is the mid-trimester anomaly (TIFFA) scan most commonly performed?","options":[{"letter":"A","text":"8–10 weeks"},{"letter":"B","text":"11–13 weeks"},{"letter":"C","text":"18–22 weeks"},{"letter":"D","text":"28–32 weeks"}],"correct":"C","testedConcept":"Antenatal ultrasound schedule","cognitiveTask":"Interpretation","discriminator":"Structural anomaly survey (TIFFA) = 18–22 weeks (organs formed, still time for decisions).","whyCorrect":"Dating/viability 6–10 w; NT + combined test 11–13+6 w; anomaly scan 18–22 w; growth scans in 3rd trimester.","trapType":"11–13 weeks is the NT/dating scan, not the anatomy scan.","futureAlert":"Dating/viability 6–10 w; NT + combined test 11–13+6 w; anomaly scan 18–22 w; growth scans in 3rd trimester.","reviseTopic":"Gynae & Obs","syllabusTopic":"Gynae & Obs","correctRule":"Dating/viability 6–10 w; NT + combined test 11–13+6 w; anomaly scan 18–22 w; growth scans in 3rd trimester.","distractors":{"A":"8–10 w is dating/viability.","B":"11–13 w is nuchal translucency screening.","D":"28–32 w is for growth and placenta/liquor assessment."}},{"id":"GM-33","stem":"A 30-year-old at 10 weeks has no pain or bleeding; ultrasound shows a sac with a fetal pole but no cardiac activity; os closed. Diagnosis?","options":[{"letter":"A","text":"Threatened"},{"letter":"B","text":"Inevitable"},{"letter":"C","text":"Missed"},{"letter":"D","text":"Incomplete"}],"correct":"C","testedConcept":"Classification of miscarriage","cognitiveTask":"Interpretation","discriminator":"Dead fetus retained + os closed + no symptoms = missed abortion.","whyCorrect":"Threatened: bleeding, os closed, viable. Inevitable: os open, POC not passed. Incomplete: os open, some POC passed. Missed: non-viable, os closed, often asymptomatic.","trapType":"Threatened abortion also has a closed os, but the fetus is ALIVE and there is bleeding.","futureAlert":"Threatened: bleeding, os closed, viable. Inevitable: os open, POC not passed. Incomplete: os open, some POC passed. Missed: non-viable, os closed, often asymptomatic.","reviseTopic":"Gynae & Obs","syllabusTopic":"Gynae & Obs","correctRule":"Threatened: bleeding, os closed, viable. Inevitable: os open, POC not passed. Incomplete: os open, some POC passed. Missed: non-viable, os closed, often asymptomatic.","distractors":{"A":"Threatened requires a live fetus and bleeding.","B":"Inevitable requires an open os with pain/bleeding.","D":"Incomplete requires passage of some tissue and an open os."}},{"id":"GM-34","stem":"A 28-year-old has copious greenish-yellow frothy discharge and dysuria; wet mount shows motile flagellated organisms. Drug of choice?","options":[{"letter":"A","text":"Fluconazole"},{"letter":"B","text":"Metronidazole"},{"letter":"C","text":"Doxycycline"},{"letter":"D","text":"Clotrimazole"}],"correct":"B","testedConcept":"Trichomoniasis","cognitiveTask":"Interpretation","discriminator":"Frothy green-yellow discharge + motile flagellates = Trichomonas vaginalis → metronidazole.","whyCorrect":"Treat both partners with metronidazole; strawberry cervix; avoid alcohol (disulfiram-like reaction).","trapType":"Choosing an antifungal for 'discharge' — that fits thick white curdy candidiasis.","futureAlert":"Treat both partners with metronidazole; strawberry cervix; avoid alcohol (disulfiram-like reaction).","reviseTopic":"Gynae & Obs","syllabusTopic":"Gynae & Obs","correctRule":"Treat both partners with metronidazole; strawberry cervix; avoid alcohol (disulfiram-like reaction).","distractors":{"A":"Fluconazole treats candidiasis.","C":"Doxycycline treats chlamydia.","D":"Clotrimazole is a topical antifungal for candida."}},{"id":"GM-35","stem":"Why is severe Rh haemolytic disease unlikely in a first pregnancy (Rh-negative mother, Rh-positive fetus)?","options":[{"letter":"A","text":"Fetal RBCs lack Rh antigen"},{"letter":"B","text":"Initial antibodies are IgM"},{"letter":"C","text":"Placenta is an absolute barrier"},{"letter":"D","text":"Sensitisation usually occurs at delivery"}],"correct":"B","testedConcept":"Immunology of Rh isoimmunisation","cognitiveTask":"Interpretation","discriminator":"The primary immune response produces IgM, which is too large to cross the placenta; IgG appears only on re-exposure.","whyCorrect":"First pregnancy: sensitisation (mostly at delivery) → IgM. Next pregnancy: IgG crosses → haemolysis. Prevent with anti-D at 28 weeks and within 72 h of delivery.","trapType":"D is also true and contributes; the question tests the antibody-class mechanism most exams expect.","futureAlert":"First pregnancy: sensitisation (mostly at delivery) → IgM. Next pregnancy: IgG crosses → haemolysis. Prevent with anti-D at 28 weeks and within 72 h of delivery.","reviseTopic":"Gynae & Obs","syllabusTopic":"Gynae & Obs","correctRule":"First pregnancy: sensitisation (mostly at delivery) → IgM. Next pregnancy: IgG crosses → haemolysis. Prevent with anti-D at 28 weeks and within 72 h of delivery.","distractors":{"A":"Rh antigen is expressed on fetal RBCs early in gestation.","C":"The placenta is not an absolute barrier — fetomaternal haemorrhage and IgG transfer occur.","D":"Largely true, but the core reason the fetus is spared is that the primary response is IgM."}},{"id":"GM-36","stem":"A G3P2 at 34 weeks has sudden painful vaginal bleeding, a tense tender uterus and fetal distress. Placenta is normally situated. Diagnosis?","options":[{"letter":"A","text":"Placenta praevia"},{"letter":"B","text":"Abruptio placentae"},{"letter":"C","text":"Vasa praevia"},{"letter":"D","text":"Uterine rupture"}],"correct":"B","testedConcept":"Antepartum haemorrhage — painful vs painless","cognitiveTask":"Interpretation","discriminator":"PAINFUL bleed + woody tense uterus + fetal distress + normally sited placenta = abruption.","whyCorrect":"Praevia: painless, soft uterus, malpresentation. Abruption: painful, tender hard uterus, shock out of proportion to visible blood.","trapType":"Placenta praevia is excluded by 'normally situated placenta' and is painless.","futureAlert":"Praevia: painless, soft uterus, malpresentation. Abruption: painful, tender hard uterus, shock out of proportion to visible blood.","reviseTopic":"Gynae & Obs","syllabusTopic":"Gynae & Obs","correctRule":"Praevia: painless, soft uterus, malpresentation. Abruption: painful, tender hard uterus, shock out of proportion to visible blood.","distractors":{"A":"Praevia is painless with a soft uterus and low-lying placenta.","C":"Vasa praevia bleeds at membrane rupture; mother stable, fetus rapidly compromised.","D":"Rupture: previous scar, loss of contractions, palpable fetal parts — less likely without a scar history."}},{"id":"GM-37","stem":"A 35-year-old at 16 weeks is advised amniocentesis for fetal karyotyping. Most appropriate timing?","options":[{"letter":"A","text":"6–8 weeks"},{"letter":"B","text":"10–12 weeks"},{"letter":"C","text":"15–18 weeks"},{"letter":"D","text":"24–28 weeks"}],"correct":"C","testedConcept":"Timing of invasive prenatal diagnosis","cognitiveTask":"Interpretation","discriminator":"Amniocentesis is done from 15 weeks (enough amniotic fluid, lower loss risk); classic window 15–18 weeks.","whyCorrect":"CVS 10–13 w; amniocentesis ≥15 w (early amnio <14 w ↑ talipes and loss); cordocentesis ≥18–20 w.","trapType":"10–12 weeks is the window for chorionic villus sampling (CVS), not amniocentesis.","futureAlert":"CVS 10–13 w; amniocentesis ≥15 w (early amnio <14 w ↑ talipes and loss); cordocentesis ≥18–20 w.","reviseTopic":"Gynae & Obs","syllabusTopic":"Gynae & Obs","correctRule":"CVS 10–13 w; amniocentesis ≥15 w (early amnio <14 w ↑ talipes and loss); cordocentesis ≥18–20 w.","distractors":{"A":"Too early for any invasive test.","B":"This is CVS timing.","D":"Late — results come too late for reproductive decisions; used for other indications only."}},{"id":"GM-38","stem":"A 28-year-old with migraine with aura wants combined oral contraceptive pills. Most appropriate advice?","options":[{"letter":"A","text":"Start COC safely"},{"letter":"B","text":"Start low-dose estrogen COC"},{"letter":"C","text":"Avoid COC; use POP"},{"letter":"D","text":"Start COC after 6 months"}],"correct":"C","testedConcept":"UKMEC/WHO MEC — migraine with aura","cognitiveTask":"Interpretation","discriminator":"Migraine WITH aura = UKMEC 4 for any estrogen-containing method (↑ ischaemic stroke risk).","whyCorrect":"Aura → no estrogen ever. Use progestogen-only methods (POP, implant, LNG-IUS) or copper IUD.","trapType":"Thinking low-dose estrogen makes it safe — any dose is contraindicated.","futureAlert":"Aura → no estrogen ever. Use progestogen-only methods (POP, implant, LNG-IUS) or copper IUD.","reviseTopic":"Gynae & Obs","syllabusTopic":"Gynae & Obs","correctRule":"Aura → no estrogen ever. Use progestogen-only methods (POP, implant, LNG-IUS) or copper IUD.","distractors":{"A":"Unsafe — absolute contraindication.","B":"Low-dose estrogen still carries stroke risk; still UKMEC 4.","D":"Waiting doesn't change the contraindication."}},{"id":"GM-39","stem":"A 24-year-old has oligomenorrhoea, hirsutism and acne. Most characteristic hormonal finding in PCOS?","options":[{"letter":"A","text":"High FSH, low LH"},{"letter":"B","text":"Elevated LH with normal FSH"},{"letter":"C","text":"Low testosterone, high SHBG"},{"letter":"D","text":"Hyperprolactinaemia with low LH"}],"correct":"B","testedConcept":"Endocrine profile of PCOS","cognitiveTask":"Interpretation","discriminator":"Raised LH with normal FSH → LH:FSH ratio >2:1 → theca cell androgen excess.","whyCorrect":"PCOS (Rotterdam 2 of 3): oligo/anovulation, hyperandrogenism, polycystic ovaries. Labs: ↑LH, ↑testosterone, ↓SHBG, insulin resistance.","trapType":"High FSH is the profile of premature ovarian insufficiency/menopause.","futureAlert":"PCOS (Rotterdam 2 of 3): oligo/anovulation, hyperandrogenism, polycystic ovaries. Labs: ↑LH, ↑testosterone, ↓SHBG, insulin resistance.","reviseTopic":"Gynae & Obs","syllabusTopic":"Gynae & Obs","correctRule":"PCOS (Rotterdam 2 of 3): oligo/anovulation, hyperandrogenism, polycystic ovaries. Labs: ↑LH, ↑testosterone, ↓SHBG, insulin resistance.","distractors":{"A":"High FSH = ovarian failure, not PCOS.","C":"PCOS has HIGH testosterone and LOW SHBG — the reverse.","D":"Hyperprolactinaemia is a separate cause of oligomenorrhoea and must be excluded."}},{"id":"GM-40","stem":"Which is a major function of progesterone?","options":[{"letter":"A","text":"Pregnancy-maintaining hormone"},{"letter":"B","text":"Causes endometrial atrophy"},{"letter":"C","text":"Stimulates follicular development"},{"letter":"D","text":"Triggers ovulation"}],"correct":"A","testedConcept":"Physiology of progesterone","cognitiveTask":"Interpretation","discriminator":"'Pro-gestation': maintains the secretory endometrium/decidua and keeps the myometrium quiet.","whyCorrect":"Progesterone: secretory endometrium, ↓ myometrial contractility, thick cervical mucus, ↑ basal body temperature. Withdrawal → menstruation.","trapType":"Mixing it up with FSH (follicle growth) and LH (ovulation).","futureAlert":"Progesterone: secretory endometrium, ↓ myometrial contractility, thick cervical mucus, ↑ basal body temperature. Withdrawal → menstruation.","reviseTopic":"Gynae & Obs","syllabusTopic":"Gynae & Obs","correctRule":"Progesterone: secretory endometrium, ↓ myometrial contractility, thick cervical mucus, ↑ basal body temperature. Withdrawal → menstruation.","distractors":{"B":"Progesterone causes secretory change, not atrophy (atrophy is from long-term unopposed progestin or estrogen deficiency).","C":"Follicle development is driven by FSH.","D":"Ovulation is triggered by the LH surge."}},{"id":"GM-41","stem":"Most common cause of primary postpartum haemorrhage?","options":[{"letter":"A","text":"Retained placenta"},{"letter":"B","text":"Uterine atony"},{"letter":"C","text":"Genital tract trauma"},{"letter":"D","text":"Coagulopathy"}],"correct":"B","testedConcept":"The 4 Ts of PPH","cognitiveTask":"Interpretation","discriminator":"Tone (atony) accounts for ~70–80% of primary PPH.","whyCorrect":"4 Ts: Tone > Trauma > Tissue > Thrombin. First response: uterine massage + oxytocin.","trapType":"Choosing trauma because it is common in vaginal deliveries — it is second.","futureAlert":"4 Ts: Tone > Trauma > Tissue > Thrombin. First response: uterine massage + oxytocin.","reviseTopic":"Gynae & Obs","syllabusTopic":"Gynae & Obs","correctRule":"4 Ts: Tone > Trauma > Tissue > Thrombin. First response: uterine massage + oxytocin.","distractors":{"A":"Retained tissue is a cause but less common than atony.","C":"Trauma is the second most common cause.","D":"Coagulopathy is the least common of the four."}},{"id":"GM-42","stem":"A woman with regular cycles misses her period. Most reliable clinical sign of pregnancy?","options":[{"letter":"A","text":"Amenorrhoea"},{"letter":"B","text":"Nausea and vomiting"},{"letter":"C","text":"Fetal heart sounds"},{"letter":"D","text":"Breast tenderness"}],"correct":"C","testedConcept":"Presumptive, probable and positive signs","cognitiveTask":"Interpretation","discriminator":"Fetal heart sounds are a POSITIVE (diagnostic) sign — they come only from the fetus.","whyCorrect":"Positive signs: fetal heart sounds, fetal movements felt by examiner, fetus on ultrasound.","trapType":"Amenorrhoea is the earliest symptom but only presumptive.","futureAlert":"Positive signs: fetal heart sounds, fetal movements felt by examiner, fetus on ultrasound.","reviseTopic":"Gynae & Obs","syllabusTopic":"Gynae & Obs","correctRule":"Positive signs: fetal heart sounds, fetal movements felt by examiner, fetus on ultrasound.","distractors":{"A":"Amenorrhoea has many causes (stress, PCOS, thyroid).","B":"Nausea is presumptive and non-specific.","D":"Breast tenderness is presumptive and occurs premenstrually too."}},{"id":"GM-43","stem":"A 30-year-old with long-standing foul-smelling ear discharge develops fever, severe headache, neck stiffness and photophobia. Most likely complication?","options":[{"letter":"A","text":"Mastoiditis"},{"letter":"B","text":"Meningitis"},{"letter":"C","text":"Facial nerve palsy"},{"letter":"D","text":"Labyrinthitis"}],"correct":"B","testedConcept":"Intracranial complications of CSOM","cognitiveTask":"Interpretation","discriminator":"Neck stiffness + photophobia + headache + fever = meningism → meningitis.","whyCorrect":"Foul discharge = unsafe (cholesteatoma) CSOM. Commonest intracranial complication = meningitis; next brain abscess.","trapType":"Mastoiditis is a complication of the same disease but presents with postauricular swelling/tenderness.","futureAlert":"Foul discharge = unsafe (cholesteatoma) CSOM. Commonest intracranial complication = meningitis; next brain abscess.","reviseTopic":"ENT","syllabusTopic":"ENT","correctRule":"Foul discharge = unsafe (cholesteatoma) CSOM. Commonest intracranial complication = meningitis; next brain abscess.","distractors":{"A":"Mastoiditis: postauricular swelling, ear pushed forward; no meningism.","C":"Facial palsy gives facial weakness, not neck stiffness.","D":"Labyrinthitis gives vertigo, vomiting and hearing loss."}},{"id":"GM-44","stem":"A 16-year-old boy has recurrent epistaxis and nasal obstruction; a firm vascular nasopharyngeal mass is seen. Which investigation is contraindicated?","options":[{"letter":"A","text":"CT scan"},{"letter":"B","text":"MRI"},{"letter":"C","text":"Nasal endoscopy"},{"letter":"D","text":"Biopsy"}],"correct":"D","testedConcept":"Juvenile nasopharyngeal angiofibroma (JNA)","cognitiveTask":"Interpretation","discriminator":"Adolescent male + epistaxis + vascular nasopharyngeal mass = JNA → biopsy can cause torrential bleeding.","whyCorrect":"JNA: contrast CT/MRI (Holman–Miller sign), angiography + embolisation, then surgical excision.","trapType":"Thinking every mass needs a tissue diagnosis — JNA is diagnosed on imaging.","futureAlert":"JNA: contrast CT/MRI (Holman–Miller sign), angiography + embolisation, then surgical excision.","reviseTopic":"ENT","syllabusTopic":"ENT","correctRule":"JNA: contrast CT/MRI (Holman–Miller sign), angiography + embolisation, then surgical excision.","distractors":{"A":"Contrast CT is the key diagnostic and staging test.","B":"MRI defines soft-tissue extent; safe.","C":"Endoscopy is safe for visualisation without biopsy."}},{"id":"GM-45","stem":"A 40-year-old has bilateral nasal obstruction, anosmia and watery rhinorrhoea with pale grape-like masses in both nasal cavities. Most appropriate initial treatment?","options":[{"letter":"A","text":"Topical decongestants"},{"letter":"B","text":"Oral antibiotics"},{"letter":"C","text":"Intranasal corticosteroids"},{"letter":"D","text":"Immediate polypectomy"}],"correct":"C","testedConcept":"Bilateral ethmoidal (allergic) nasal polyps","cognitiveTask":"Interpretation","discriminator":"Bilateral pale polyps → medical treatment first with intranasal steroids.","whyCorrect":"Polyps: topical steroids ± short oral steroid course → FESS if refractory. Unilateral polyp in an adult → exclude malignancy.","trapType":"Going straight to surgery — reserved for failure of medical therapy.","futureAlert":"Polyps: topical steroids ± short oral steroid course → FESS if refractory. Unilateral polyp in an adult → exclude malignancy.","reviseTopic":"ENT","syllabusTopic":"ENT","correctRule":"Polyps: topical steroids ± short oral steroid course → FESS if refractory. Unilateral polyp in an adult → exclude malignancy.","distractors":{"A":"Decongestants give brief relief and cause rhinitis medicamentosa; they don't shrink polyps.","B":"Antibiotics only for acute infection, not for polyps.","D":"Surgery is second-line after failed medical therapy."}},{"id":"GM-46","stem":"After head trauma a 30-year-old has bilateral periorbital bruising (raccoon eyes). This indicates:","options":[{"letter":"A","text":"Anterior cranial fossa fracture"},{"letter":"B","text":"Middle cranial fossa fracture"},{"letter":"C","text":"Posterior cranial fossa fracture"},{"letter":"D","text":"Orbital floor fracture"}],"correct":"A","testedConcept":"Signs of basal skull fracture","cognitiveTask":"Interpretation","discriminator":"Raccoon eyes + CSF rhinorrhoea = anterior cranial fossa.","whyCorrect":"Anterior fossa: raccoon eyes, CSF rhinorrhoea, anosmia. Middle fossa: Battle's sign, CSF otorrhoea, haemotympanum, VII/VIII palsy. Avoid NG tube in anterior fossa fracture.","trapType":"Battle's sign (mastoid bruising) is middle fossa — easy to swap.","futureAlert":"Anterior fossa: raccoon eyes, CSF rhinorrhoea, anosmia. Middle fossa: Battle's sign, CSF otorrhoea, haemotympanum, VII/VIII palsy. Avoid NG tube in anterior fossa fracture.","reviseTopic":"ENT","syllabusTopic":"ENT","correctRule":"Anterior fossa: raccoon eyes, CSF rhinorrhoea, anosmia. Middle fossa: Battle's sign, CSF otorrhoea, haemotympanum, VII/VIII palsy. Avoid NG tube in anterior fossa fracture.","distractors":{"B":"Middle fossa → Battle's sign and CSF otorrhoea.","C":"Posterior fossa → mastoid bruising, lower cranial nerve palsies.","D":"Orbital floor (blow-out) is usually unilateral with diplopia on upgaze and infraorbital numbness."}},{"id":"GM-47","stem":"A 35-year-old develops sudden severe vertigo, nausea, vomiting and unilateral SNHL after a recent URTI. Diagnosis?","options":[{"letter":"A","text":"Vestibular neuritis"},{"letter":"B","text":"Acute labyrinthitis"},{"letter":"C","text":"BPPV"},{"letter":"D","text":"Ménière's disease"}],"correct":"B","testedConcept":"Viral labyrinthitis vs vestibular neuritis","cognitiveTask":"Interpretation","discriminator":"Vertigo + HEARING LOSS after a viral illness = labyrinthitis (whole labyrinth involved).","whyCorrect":"Vertigo alone post-viral = vestibular neuritis; + hearing loss = labyrinthitis; episodic + tinnitus + fullness = Ménière's; seconds with head movement = BPPV.","trapType":"Vestibular neuritis has the same story but hearing is preserved.","futureAlert":"Vertigo alone post-viral = vestibular neuritis; + hearing loss = labyrinthitis; episodic + tinnitus + fullness = Ménière's; seconds with head movement = BPPV.","reviseTopic":"ENT","syllabusTopic":"ENT","correctRule":"Vertigo alone post-viral = vestibular neuritis; + hearing loss = labyrinthitis; episodic + tinnitus + fullness = Ménière's; seconds with head movement = BPPV.","distractors":{"A":"Neuritis affects only the vestibular nerve — hearing normal.","C":"BPPV: brief positional vertigo, no hearing loss.","D":"Ménière's: recurrent episodes (20 min–hours) with tinnitus and aural fullness, not a single post-URTI event."}},{"id":"GM-48","stem":"A 5-year-old with enlarged adenoids has mouth breathing, snoring and obstructive sleep apnoea. Management?","options":[{"letter":"A","text":"Observation"},{"letter":"B","text":"Prolonged antibiotics"},{"letter":"C","text":"Adenoidectomy"},{"letter":"D","text":"Nasal decongestants"}],"correct":"C","testedConcept":"Adenoid hypertrophy with OSA","cognitiveTask":"Interpretation","discriminator":"Documented OSA is an indication for surgery (adenoidectomy ± tonsillectomy).","whyCorrect":"Indications for adenoidectomy: OSA, adenoid facies, recurrent OME/glue ear, recurrent adenoiditis.","trapType":"Observation is tempting since adenoids regress with age, but OSA causes growth, behaviour and cardiopulmonary harm.","futureAlert":"Indications for adenoidectomy: OSA, adenoid facies, recurrent OME/glue ear, recurrent adenoiditis.","reviseTopic":"ENT","syllabusTopic":"ENT","correctRule":"Indications for adenoidectomy: OSA, adenoid facies, recurrent OME/glue ear, recurrent adenoiditis.","distractors":{"A":"Untreated OSA risks failure to thrive and cor pulmonale.","B":"Antibiotics don't shrink hypertrophied lymphoid tissue.","D":"Decongestants are ineffective for adenoid hypertrophy and unsafe long-term in children."}},{"id":"GM-49","stem":"A patient receives 1 litre of 0.9% saline IV. Distribution?","options":[{"letter":"A","text":"Equal ICF and ECF"},{"letter":"B","text":"Mainly ICF"},{"letter":"C","text":"Mainly ECF, no effect on ICF"},{"letter":"D","text":"Only plasma"}],"correct":"C","testedConcept":"Fluid distribution of isotonic crystalloid","cognitiveTask":"Interpretation","discriminator":"Saline is isotonic, and Na⁺ stays extracellular, so there is no osmotic shift into cells.","whyCorrect":"1 L saline → ~250 mL plasma, ~750 mL interstitium. 1 L 5% dextrose → distributes like free water (2/3 ICF). Colloid → mostly plasma.","trapType":"Choosing 'only plasma' — saline crosses capillaries freely and distributes across the whole ECF.","futureAlert":"1 L saline → ~250 mL plasma, ~750 mL interstitium. 1 L 5% dextrose → distributes like free water (2/3 ICF). Colloid → mostly plasma.","reviseTopic":"Applied Physiology","syllabusTopic":"Applied Physiology","correctRule":"1 L saline → ~250 mL plasma, ~750 mL interstitium. 1 L 5% dextrose → distributes like free water (2/3 ICF). Colloid → mostly plasma.","distractors":{"A":"Equal ICF/ECF distribution would need free water/dextrose behaviour.","B":"Only hypotonic fluids/dextrose move mainly into cells.","D":"Restriction to plasma is the idealised behaviour of colloids."}},{"id":"GM-50","stem":"Which phase of the neuronal action potential is mainly caused by rapid Na⁺ influx?","options":[{"letter":"A","text":"Resting membrane potential"},{"letter":"B","text":"Depolarisation"},{"letter":"C","text":"Repolarisation"},{"letter":"D","text":"Hyperpolarisation"}],"correct":"B","testedConcept":"Ionic basis of the action potential","cognitiveTask":"Interpretation","discriminator":"Voltage-gated Na⁺ channels open → Na⁺ rushes in → upstroke (depolarisation).","whyCorrect":"Resting: K⁺ leak + Na/K ATPase. Upstroke: Na⁺ in. Repolarisation: K⁺ out. After-hyperpolarisation: delayed K⁺ channel closure.","trapType":"Confusing repolarisation (K⁺ efflux) with depolarisation.","futureAlert":"Resting: K⁺ leak + Na/K ATPase. Upstroke: Na⁺ in. Repolarisation: K⁺ out. After-hyperpolarisation: delayed K⁺ channel closure.","reviseTopic":"Applied Physiology","syllabusTopic":"Applied Physiology","correctRule":"Resting: K⁺ leak + Na/K ATPase. Upstroke: Na⁺ in. Repolarisation: K⁺ out. After-hyperpolarisation: delayed K⁺ channel closure.","distractors":{"A":"RMP is set mainly by K⁺ permeability.","C":"Repolarisation is from K⁺ efflux and Na⁺ channel inactivation.","D":"Hyperpolarisation comes from continued K⁺ efflux."}},{"id":"GM-51","stem":"Which phase of the neuronal action potential is mainly caused by rapid Na⁺ influx? (duplicate of Q50)","options":[{"letter":"A","text":"Resting membrane potential"},{"letter":"B","text":"Depolarisation"},{"letter":"C","text":"Repolarisation"},{"letter":"D","text":"Hyperpolarisation"}],"correct":"B","testedConcept":"Ionic basis of the action potential","cognitiveTask":"Interpretation","discriminator":"Na⁺ influx through voltage-gated channels = depolarisation.","whyCorrect":"Na⁺ in = up; K⁺ out = down.","trapType":"Same as Q50 — swapping Na⁺ and K⁺ phases.","futureAlert":"Na⁺ in = up; K⁺ out = down.","reviseTopic":"Applied Physiology","syllabusTopic":"Applied Physiology","correctRule":"Na⁺ in = up; K⁺ out = down.","distractors":{"A":"RMP depends on K⁺ leak.","C":"Repolarisation = K⁺ efflux.","D":"Hyperpolarisation = prolonged K⁺ efflux."}},{"id":"GM-52","stem":"Most potent physiological stimulus for growth hormone secretion?","options":[{"letter":"A","text":"Hyperglycaemia"},{"letter":"B","text":"Hypoglycaemia"},{"letter":"C","text":"Obesity"},{"letter":"D","text":"Somatostatin"}],"correct":"B","testedConcept":"Regulation of GH","cognitiveTask":"Interpretation","discriminator":"GH is a counter-regulatory (anti-insulin) hormone; hypoglycaemia is the strongest stimulus — basis of the insulin tolerance test.","whyCorrect":"GH ↑: hypoglycaemia, deep sleep, exercise, stress, arginine, ghrelin. GH ↓: glucose, somatostatin, obesity, IGF-1.","trapType":"Hyperglycaemia SUPPRESSES GH — used in the OGTT for acromegaly.","futureAlert":"GH ↑: hypoglycaemia, deep sleep, exercise, stress, arginine, ghrelin. GH ↓: glucose, somatostatin, obesity, IGF-1.","reviseTopic":"Applied Physiology","syllabusTopic":"Applied Physiology","correctRule":"GH ↑: hypoglycaemia, deep sleep, exercise, stress, arginine, ghrelin. GH ↓: glucose, somatostatin, obesity, IGF-1.","distractors":{"A":"Hyperglycaemia suppresses GH.","C":"Obesity blunts GH secretion.","D":"Somatostatin inhibits GH release."}},{"id":"GM-53","stem":"Residual volume is the volume of air:","options":[{"letter":"A","text":"Inspired after a normal inspiration"},{"letter":"B","text":"Remaining in the lungs after maximal expiration"},{"letter":"C","text":"Expired after a normal expiration"},{"letter":"D","text":"Moved during quiet breathing"}],"correct":"B","testedConcept":"Lung volumes","cognitiveTask":"Interpretation","discriminator":"RV = air left after a MAXIMAL forced expiration (~1.2 L); it cannot be measured by spirometry.","whyCorrect":"FRC = ERV + RV. TLC = VC + RV. Measure RV by helium dilution or body plethysmography.","trapType":"Confusing RV with FRC (air left after a NORMAL expiration).","futureAlert":"FRC = ERV + RV. TLC = VC + RV. Measure RV by helium dilution or body plethysmography.","reviseTopic":"Applied Physiology","syllabusTopic":"Applied Physiology","correctRule":"FRC = ERV + RV. TLC = VC + RV. Measure RV by helium dilution or body plethysmography.","distractors":{"A":"That describes inspiratory reserve volume.","C":"That describes expiratory reserve volume.","D":"That is tidal volume."}},{"id":"GM-54","stem":"The low-dose dexamethasone suppression test is first used to check:","options":[{"letter":"A","text":"Pituitary vs ectopic ACTH"},{"letter":"B","text":"Presence or absence of Cushing's syndrome"},{"letter":"C","text":"Adrenal insufficiency"},{"letter":"D","text":"Aldosterone excess"}],"correct":"B","testedConcept":"Cushing's syndrome investigation sequence","cognitiveTask":"Interpretation","discriminator":"LOW dose = screens whether hypercortisolism exists. HIGH dose = localises the cause.","whyCorrect":"Step 1 confirm (LDDST / 24-h UFC / late-night salivary cortisol) → Step 2 ACTH level → Step 3 HDDST/CRH/IPSS to localise.","trapType":"Mixing low-dose (screening) with high-dose (localising).","futureAlert":"Step 1 confirm (LDDST / 24-h UFC / late-night salivary cortisol) → Step 2 ACTH level → Step 3 HDDST/CRH/IPSS to localise.","reviseTopic":"Applied Physiology","syllabusTopic":"Applied Physiology","correctRule":"Step 1 confirm (LDDST / 24-h UFC / late-night salivary cortisol) → Step 2 ACTH level → Step 3 HDDST/CRH/IPSS to localise.","distractors":{"A":"Pituitary vs ectopic is answered by the HIGH-dose test.","C":"Adrenal insufficiency is tested with the short Synacthen test.","D":"Aldosterone excess is screened with aldosterone:renin ratio."}},{"id":"GM-55","stem":"Mean arterial pressure is best estimated by:","options":[{"letter":"A","text":"SBP − DBP"},{"letter":"B","text":"SBP + DBP"},{"letter":"C","text":"DBP + (pulse pressure ÷ 3)"},{"letter":"D","text":"DBP + (pulse pressure ÷ 2)"}],"correct":"C","testedConcept":"Mean arterial pressure","cognitiveTask":"Interpretation","discriminator":"Diastole lasts ~2/3 of the cycle, so MAP sits one-third of the way up from DBP.","whyCorrect":"MAP = DBP + ⅓(SBP − DBP) = (2·DBP + SBP)/3. Target MAP ≥65 mmHg in sepsis.","trapType":"Simple averaging (÷2) ignores the longer diastole.","futureAlert":"MAP = DBP + ⅓(SBP − DBP) = (2·DBP + SBP)/3. Target MAP ≥65 mmHg in sepsis.","reviseTopic":"Applied Physiology","syllabusTopic":"Applied Physiology","correctRule":"MAP = DBP + ⅓(SBP − DBP) = (2·DBP + SBP)/3. Target MAP ≥65 mmHg in sepsis.","distractors":{"A":"That is pulse pressure.","B":"Has no physiological meaning.","D":"Overestimates MAP — assumes equal systole and diastole."}},{"id":"GM-56","stem":"Normal lifespan of a red blood cell?","options":[{"letter":"A","text":"30 days"},{"letter":"B","text":"60 days"},{"letter":"C","text":"90 days"},{"letter":"D","text":"120 days"}],"correct":"D","testedConcept":"RBC lifespan","cognitiveTask":"Interpretation","discriminator":"Normal RBC
