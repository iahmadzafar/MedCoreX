<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medical Quick Reference</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:#0E1A2B;font-family:'Plus Jakarta Sans',-apple-system,sans-serif;overflow:hidden}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;border-radius:14px}
  .pill{
    position:fixed; bottom:18px; right:18px; z-index:2147483646;
    display:flex; align-items:center; gap:4px;
    background:rgba(14,26,43,.92); border:1px solid rgba(246,243,236,.18);
    border-radius:999px; padding:5px 6px; backdrop-filter:blur(8px);
    box-shadow:0 10px 30px rgba(0,0,0,.35);
  }
  .pill .lbl{
    font-family:'Geist Mono',monospace; font-size:0.5938rem; letter-spacing:1.5px;
    text-transform:uppercase; color:#9FB2CC; padding:0 8px 0 10px;
  }
  .pill button{
    border:0; border-radius:999px; padding:7px 10px; font-size:0.75rem; font-weight:700;
    font-family:'Plus Jakarta Sans',sans-serif; letter-spacing:.4px; transition:.15s;
    background:transparent; color:#9FB2CC;
  }
  .pill button.on{background:rgba(212,255,63,.18); outline:2px solid #D4FF3F}
  .pill .sw{display:block; width:14px; height:14px; border-radius:50%; border:1px solid rgba(246,243,236,.45)}
  .pill button:not(.on):hover{color:#F6F3EC; background:rgba(246,243,236,.08)}
  .pill .sep{width:1px; height:18px; background:rgba(246,243,236,.18); margin:0 3px}
  .pill a{
    color:#9FB2CC; text-decoration:none; font-size:0.75rem; padding:7px 10px;
    border-radius:999px; font-family:'Plus Jakarta Sans',sans-serif;
  }
  .pill a:hover{color:#D4FF3F}
</style>

<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Geist+Mono:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style id="mlx-notoggle">.mlx-toggle{display:none!important}</style>
<style id="mlx-2026">
button{transition:transform .15s cubic-bezier(.34,1.56,.64,1),box-shadow .15s,background .2s,border-color .2s,color .2s}
button:hover{transform:translateY(-2px)}
button:active{transform:translateY(0) scale(.96)}
summary{cursor:pointer}
@media print{button{transition:none!important;transform:none!important}}
@media(prefers-reduced-motion:reduce){button{transition:none!important;transform:none!important}}
</style>
</head>
<body>
<iframe id="pane" src="" title="Quick Reference"></iframe>
<div class="pill" role="tablist">
  <span class="lbl">Quick Reference</span>
  <button id="b-light" data-v="light" title="Light version"><span class="sw" style="background:#FFFFFF"></span></button>
  <button id="b-dark" data-v="dark" title="Dark version"><span class="sw" style="background:#1A1A2E"></span></button>
  <span class="sep"></span>
  <a id="pop" href="#" target="_blank" rel="noopener" title="Open in new tab">↗</a>
</div>
<script>
const SRC = { light: "standalone-htmls-medical-quick-reference-light.html", dark: "standalone-htmls-medical-quick-reference-dark.html" };
const KEY = "nre-mqr-view";
function set(v){
  document.getElementById("pane").src = SRC[v];
  document.getElementById("pop").href = SRC[v];
  document.getElementById("b-light").classList.toggle("on", v === "light");
  document.getElementById("b-dark").classList.toggle("on", v === "dark");
  try{ localStorage.setItem(KEY, v); }catch(e){}
}
document.getElementById("b-light").onclick = () => set("light");
document.getElementById("b-dark").onclick = () => set("dark");
let v = "light";
try{ v = localStorage.getItem(KEY) || "light"; }catch(e){}
set(v);
</script>

<style>/* phone guards (shared) */
@media (max-width:640px){
  img,video{max-width:100%;height:auto}
  pre{overflow-x:auto;-webkit-overflow-scrolling:touch}
  body{overflow-x:hidden;padding-left:14px;padding-right:14px}
}
</style>

<style id="mlx-live">
h1{font-weight:800}h2{font-weight:700}h3,h4{font-weight:700}
@keyframes mlxFade{from{opacity:0}to{opacity:1}}
body{animation:mlxFade .4s ease both}
.mlx-toggle{position:fixed;right:16px;bottom:16px;z-index:99;font:600 12px/1 'Geist Mono',ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;padding:11px 15px;border-radius:999px;cursor:pointer;background:var(--panel,#14171E);color:var(--chalk,#FFFFFF);border:1px solid var(--line,#2A3140);box-shadow:0 10px 30px -12px rgba(0,0,0,.55);transition:transform .15s,border-color .2s}
.mlx-toggle:hover{border-color:var(--cyan,#4DA3FF)}
.mlx-toggle:active{transform:scale(.94)}
@media print{.mlx-toggle{display:none!important}body{animation:none!important}}
@media(prefers-reduced-motion:reduce){body,.mlx-toggle{animation:none!important;transition:none!important}}
</style>
<script>
(function(){
 try{
  var s=localStorage.getItem('mlx-theme');
  var m=s||(window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');
  document.documentElement.setAttribute('data-mode',m);
 }catch(e){}
 var b=document.createElement('button');
 b.className='mlx-toggle';b.type='button';
 function lbl(){b.textContent=document.documentElement.getAttribute('data-mode')==='light'?'dark':'light';}
 b.addEventListener('click',function(){
  var n=document.documentElement.getAttribute('data-mode')==='light'?'dark':'light';
  document.documentElement.setAttribute('data-mode',n);
  try{localStorage.setItem('mlx-theme',n);}catch(e){}
  lbl();
 });
 document.body.appendChild(b);lbl();
})();
</script>

</body>
</html>
