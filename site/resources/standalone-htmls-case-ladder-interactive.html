  padding: 11px 12px; cursor: pointer; color: var(--chalk-2);

.topic-title { display: block; font-weight: 500; color: var(--topic-ink, var(--chalk)); line-height: 1.25; font-size: 0.9375rem; }
.topic-meta { display: block; margin-top: 5px; font-family: var(--mono); font-size: 0.625rem; color: var(--faint); }
.main { padding: 30px clamp(22px, 4vw, 56px) 54px; }

a before labeling unipolar depression."}, {"title": "Psychosis Shift", "tag": "variant", "stem": "Now he hears voices commenting on him and has fixed persecutory delusions with functional decline. What feature is present?", "options": [["A", "Psychotic symptoms"], ["B", "Simple grief only"], ["C", "Specific phobia"], ["D", "Insomnia only"]], "answer": "A. Psychotic symptoms", "discriminator": "Hallucinations and fixed delusions.", "trap": "Severe anxiety may feel paranoid, but fixed delusions/hallucinations are psychosis.", "future_alert": "Voices plus fixed delusions are psychotic symptoms."}], "final_learning_rule": "Psych ladders change duration, anhedonia, suicidality, past mania, psychosis, substance use, and functional decline."}, {"title": "Pediatric Rash Fever: Measles vs Varicella vs Scarlet Fever", "accent": "coral", "base_case": "A 5-year-old child has high fever, cough, coryza, conjunctivitis, Koplik spots, and a maculopapular rash starting on the face and spreading downward.", "decision_flow": [{"label": "3 Cs + Koplik", "text": "Measles"}, {"label": "Vesicles different stages", "text": "Varicella"}, {"label": "Sandpaper rash", "text": "Scarlet fever"}, {"label": "Non-blanching rash", "text": "Meningococcemia danger"}], "segments": [{"title": "Diagnosis Recognition", "tag": "diagnosis", "stem": "What is the most likely diagnosis?", "options": [["A", "Measles"], ["B", "Varicella"], ["C", "Scarlet fever"], ["D", "Roseola"]], "answer": "A. Measles", "discriminator": "Cough, coryza, conjunctivitis, Koplik spots, and cephalocaudal rash.", "trap": "Many childhood rashes have fever; Koplik spots and 3 Cs decide.", "future_alert": "Fever with 3 Cs and Koplik spots is measles."}, {"title": "Varicella Shift", "tag": "variant", "stem": "Now the rash is itchy vesicles in different stages of evolution, mainly on trunk. What is likely?", "options": [["A", "Varicella"], ["B", "Measles"], ["C", "Scarlet fever"], ["D", "Kawasaki disease"]], "answer": "A. Varicella", "di ice"], ["B", "Pathologic jaundice"], ["C", "Biliary atresia"], ["D", "Acute appendicitis"]], "answer": "A. Physiologic neonatal jaundice", "discriminator": "Well baby with jaundice beginning after the first day and mild bilirubin rise.", "trap": "All neonatal jaundice needs assessment, but timing and wellness guide classification.", "future_alert": "Jaundice after day 2 in a well baby is often physiologic."}, {"title": "Pathologic Timing", "tag": "danger shift", "stem": "Jaundice appears within the first 24 hours of life. What does this imply?", "options": [["A", "Pathologic jaundice until proven otherwise"], ["B", "Always normal"], ["C", "No need to check bilirubin"], ["D", "Adult hepatitis only"]], "answer": "A. Pathologic jaundice until proven otherwise", "discriminator": "First-day jaundice is abnormal and may reflect hemolysis or serious disease.", "trap": "Physiologic jaundice does not start in the first 24 hours.", "future_alert": "Jaundice in first 24 hours is pathologic."}, {"title": "Sepsis Shift", "tag": "danger shift", "stem": "Now the baby is lethargic, febrile, feeding poorly, and jaundiced. What must be considered?", "options": [["A", "Neonatal sepsis"], ["B", "Simple physiologic jaundice only"], ["C", "Migraine"], ["D", "Otitis externa"]], "answer": "A. Neonatal sepsis", "discriminator": "Systemic illness with poor feeding and temperature abnormality.", "trap": "Do not label jaundice physiologic when the baby is unwell.", "future_alert": "Unwell jaundiced neonate means sepsis workup."}, {"title": "Obstructive Shift", "tag": "variant", "stem": "Jaundice persists with pale stools and dark urine. What is concerning?", "options": [["A", "Cholestasis/biliary atresia"], ["B", "Physiologic jaundice only"], ["C", "Bronchiolitis"], ["D", "Croup"]], "answer": "A. Cholestasis/biliary atresia", "discriminator": "Pale stools and dark urine suggest conjugated obstructive jaundice.", "trap": "Persistence and stool color override reassuring early assumptions.", "fut ge, mobility, borders, fixation, skin/nodes, lactation, fever, and pain."}, {"title": "Pediatric Nutrition: SAM vs Rickets", "accent": "coral", "base_case": "A 2-year-old child has severe wasting, visible ribs, lethargy, poor appetite, and bilateral pedal edema.", "decision_flow": [{"label": "Wasting + edema", "text": "Severe acute malnutrition"}, {"label": "No edema wasting", "text": "Marasmus pattern"}, {"label": "Wrist widening/bowing", "text": "Rickets shift"}, {"label": "Hypoglycemia/hypothermia", "text": "SAM emergency"}], "segments": [{"title": "Diagnosis Recognition", "tag": "diagnosis", "stem": "What is the most likely diagnosis?", "options": [["A", "Severe acute malnutrition"], ["B", "Simple obesity"], ["C", "Asthma"], ["D", "Nephrolithiasis"]], "answer": "A. Severe acute malnutrition", "discriminator": "Severe wasting with bilateral pedal edema.", "trap": "Edema may falsely suggest renal disease, but in a wasted child it supports kwashiorkor/SAM.", "future_alert": "Bilateral edema in a severely wasted child is SAM."}, {"title": "Emergency Risk", "tag": "danger shift", "stem": "Which complication must be prevented early in SAM care?", "options": [["A", "Hypoglycemia and hypothermia"], ["B", "Hyperactivity"], ["C", "Migraine aura"], ["D", "Acne"]], "answer": "A. Hypoglycemia and hypothermia", "discriminator": "Severely malnourished children have poor reserves and high early mortality risk.", "trap": "Aggressive feeding without stabilization can be dangerous.", "future_alert": "SAM care starts with stabilization."}, {"title": "Rickets Shift", "tag": "variant", "stem": "Now the child has delayed walking, bowed legs, widened wrists, and rachitic rosary. What is likely?", "options": [["A", "Rickets"], ["B", "SAM only"], ["C", "Scurvy only"], ["D", "Pertussis"]], "answer": "A. Rickets", "discriminator": "Bone deformities and widened growth plates suggest vitamin D deficiency rickets.", "trap": "Poor growth overlaps, but skeletal signs shift to rickets.", "future_alert": "Bowed legs plus widened wrists means rickets."}, {"title": "Kwashiorkor Clue", "tag": "classification", "stem": "A malnourished child has edema, flaky paint dermatosis, and hair changes. What pattern is suggested?", "options": [["A", "Kwashiorkor/edematous malnutrition"], ["B", "Simple iron deficiency only"], ["C", "Croup"], ["D", "Otitis media"]], "answer": "A. Kwashiorkor/edematous malnutrition", "discriminator": "Edema with skin and hair changes.", "trap": "Weight may be masked by edema.", "future_alert": "Edema can hide severe malnutrition."}], "final_learning_rule": "Nutrition ladders change edema, wasting, appetite, temperature/glucose risk, skin/hair changes, and skeletal deformities."}, {"title": "Rheumatic Fever vs Infective Endocarditis", "accent": "emerald", "base_case": "A 10-year-old child develops fever, migratory polyarthritis, carditis murmur, and raised inflammatory markers 3 weeks after sore throat.", "decision_flow": [{"label": "Post-strep + migratory joints", "text": "Rheumatic fever"}, {"label": "Murmur + fever + risk", "text": "Endocarditis shift"}, {"label": "Chorea", "text": "Jones feature"}, {"label": "Prophylaxis", "text": "Prevent recurrence"}], "segments": [{"title": "Diagnosis Recognition", "tag": "diagnosis", "stem": "What is the most likely diagnosis?", "options": [["A", "Acute rheumatic fever"], ["B", "Juvenile idiopathic arthritis only"], ["C", "Osteoarthritis"], ["D", "Septic arthritis only"]], "answer": "A. Acute rheumatic fever", "discriminator": "Post-streptococcal timing with migratory polyarthritis and carditis.", "trap": "Joint pain alone is broad; post-sore-throat pattern and carditis decide.", "future_alert": "Migratory arthritis after sore throat suggests rheumatic fever."}, {"title": "Criteria Feature", "tag": "classification", "stem": "Which is a major Jones criterion feature?", "options": [["A", "Sydenham chorea"], ["B", "Rhinorrhea only"], ["C", "Acne"], ["D", "Constipation"]], "answer": "A. Sydenham chorea", "discriminator": "Chorea is a classic major manifestation.", "trap": "Minor symptoms are not enough without the pattern.", "future_alert": "Chorea after strep exposure fits rheumatic fever."}, {"title": "Endocarditis Shift", "tag": "mimic", "stem": "Now an adult with prosthetic valve has fever, new murmur, petechiae, and positive blood cultures. What is likely?", "options": [["A", "Infective endocarditis"], ["B", "Rheumatic fever only"], ["C", "Asthma"], ["D", "GERD"]], "answer": "A. Infective endocarditis", "discriminator": "Fever, valve risk, new murmur, peripheral signs, and bacteremia.", "trap": "Both involve murmurs, but blood cultures and prosthetic valve shift to endocarditis.", "future_alert": "Fever plus new murmur with bacteremia means endocarditis."}, {"title": "Secondary Prevention", "tag": "management", "stem": "What long-term principle matters after rheumatic fever?", "options": [["A", "Secondary antibiotic prophylaxis to prevent recurrence"], ["B", "No follow-up ever"], ["C", "Daily anticoagulation for all children"], ["D", "Avoid all vaccines"]], "answer": "A. Secondary antibiotic prophylaxis to prevent recurrence", "discriminator": "Recurrent strep-triggered episodes worsen rheumatic heart disease.", "trap": "Treating the acute episode alone is incomplete.", "future_alert": "Rheumatic fever needs recurrence prevention."}], "final_learning_rule": "Carditis ladders change post-strep timing, migratory joints, chorea, cultures, valve risk, murmur, and prophylaxis."}, {"title": "Snake Bite: Neurotoxic vs Hemotoxic", "accent": "coral", "base_case": "A farmer is bitten on the foot and later develops ptosis, diplopia, dysphagia, and descending weakness.", "decision_flow": [{"label": "Ptosis + weakness", "text": "Neurotoxic bite"}, {"label": "Bleeding + swelling", "text": "Hemotoxic shift"}, {"label": "Resp failure", "text": "Ventilation priority"}, {"label": "Antivenom", "text": "Indicated if systemic"}], "segments": [{"title": "Syndrome Recognition", "tag": "diagnosis", "stem": "What envenomation pattern is suggested?", "options": [["A", "Neurotoxic snake bite"], ["B", "Simple cellulitis only"], ["C", "Heat stroke"], ["D", "Migraine"]], "answer": "A. Neurotoxic snake bite", "discriminator": "Ptosis, diplopia, bulbar symptoms, and descending weakness.", "trap": "Local bite marks alone do not define toxicity; neurologic signs do.", "future_alert": "Ptosis after snake bite suggests neurotoxic envenomation."}, {"title": "Immediate Danger", "tag": "danger shift", "stem": "What life-threatening complication must be watched for?", "options": [["A", "Respiratory failure"], ["B", "Acne"], ["C", "Chronic constipation"], ["D", "Otitis externa"]], "answer": "A. Respiratory failure", "discriminator": "Bulbar and respiratory muscle weakness can progress.", "trap": "Antivenom matters, but airway/ventilation cannot wait.", "future_alert": "Neurotoxic bite: monitor breathing."}, {"title": "Hemotoxic Shift", "tag": "variant", "stem": "Now there is painful swelling, bleeding gums, hematuria, and incoagulable blood. What pattern is likely?", "options": [["A", "Hemotoxic/viper envenomation"], ["B", "Pure neurotoxic only"], ["C", "Panic attack"], ["D", "Appendicitis"]], "answer": "A. Hemotoxic/viper envenomation", "discriminator": "Bleeding tendency, swelling, hematuria, and coagulopathy.", "trap": "Pain/swelling can distract from systemic bleeding risk.", "future_alert": "Bleeding after snake bite means hemotoxic envenomation."}, {"title": "First Aid Error", "tag": "safety", "stem": "Which first-aid practice should be avoided?", "options": [["A", "Cutting/sucking the wound or tight tourniquet"], ["B", "Immobilizing the limb"], ["C", "Rapid transport"], ["D", "Reassurance while arranging care"]], "answer": "A. Cutting/sucking the wound or tight tourniquet", "discriminator": "Harmful traditional measures worsen injury and delay care.", "trap": "Doing something dramatic is tempting but unsafe.", "future_alert": "Snake bite first aid: immobilize and transport, do not cut or suck."}], "final_learning_rule": "Snake-bite ladders change ptosis, bleeding, swelling, coagulopathy, respiratory signs, and unsafe first aid."}], "manual_review_fields": ["Topic approved?", "Base case clinically correct?", "Segments worth keeping?", "Discriminator to strengthen?", "Recall wording to add?", "Trap to remove or replace?"]}</script>
<script>
const data = JSON.parse(document.getElementById('caseData').textContent);
const palette = {"emerald": {"primary": "var(--mint)", "soft": "var(--mint-soft)", "line": "var(--mint-line)", "ink": "var(--mint)"}, "coral": {"primary": "var(--coral)", "soft": "var(--coral-soft)", "line": "var(--coral-line)", "ink": "var(--coral)"}, "violet": {"primary": "var(--violet)", "soft": "var(--violet-soft)", "line": "var(--violet-line)", "ink": "var(--violet)"}, "blue": {"primary": "var(--cyan)", "soft": "var(--cyan-soft)", "line": "var(--cyan-line)", "ink": "var(--cyan)"}};
let activeIndex = 0;
const completed = new Set(JSON.parse(localStorage.getItem('caseLadderCompleted') || '[]'));
const topicList = document.getElementById('topicList');
const content = document.getElementById('content');
const searchBox = document.getElementById('searchBox');
const tagFilter = document.getElementById('tagFilter');
const empty = document.getElementById('empty');

document.getElementById('topicCount').textContent = data.topics.length;
document.getElementById('segmentCount').textContent = data.topics.reduce((n,t)=>n+t.segments.length,0);

function themeFor(topic) { return palette[topic.accent] || palette.emerald; }
function segmentId(ti, si) { return `${ti}-${si}`; }
function saveProgress() { localStorage.setItem('caseLadderCompleted', JSON.stringify([...completed])); updateProgress(); }
function updateProgress() {
  const total = data.topics.reduce((n,t)=>n+t.segments.length,0);
  const count = completed.size;
  document.getElementById('progressText').textContent = `${count} of ${total} segments completed`;
  document.getElementById('progressBar').style.width = total ? `${Math.round(count/total*100)}%` : '0%';
}
function allTags() { return [...new Set(data.topics.flatMap(t => t.segments.map(s => s.tag || 'untagged')))].sort(); }
function matchesTopic(topic) {
  const q = searchBox.value.trim().toLowerCase();
  const tag = tagFilter.value;
  const hay = JSON.stringify(topic).toLowerCase();
  const tagOk = !tag || topic.segments.some(s => (s.tag || 'untagged') === tag);
  return tagOk && (!q || hay.includes(q));
}
function renderSidebar() {
  topicList.innerHTML = '';
  let shown = 0;
  data.topics.forEach((topic, idx) => {
    if (!matchesTopic(topic)) return;
    shown++;
    const th = themeFor(topic);
    const btn = document.createElement('button');
    btn.className = 'topic-button' + (idx === activeIndex ? ' active' : '');
    btn.style.setProperty('--topic-primary', th.primary);
    btn.style.setProperty('--topic-soft', th.soft);
    btn.style.setProperty('--topic-ink', th.ink);
    btn.innerHTML = `<span class="topic-title">${idx+1}. ${escapeHtml(topic.title)}</span><span class="topic-meta">${topic.segments.length} segments</span>`;
    btn.onclick = () => { activeIndex = idx; render(); window.scrollTo({top:0, behavior:'smooth'}); };
    topicList.appendChild(btn);
  });
  empty.style.display = shown ? 'none' : 'block';
}
function renderTopic(topic, idx) {
  const th = themeFor(topic);
  content.style.setProperty('--topic-primary', th.primary);
  content.style.setProperty('--topic-soft', th.soft);
  content.style.setProperty('--topic-ink', th.ink);
  const flow = topic.decision_flow.map(step => `<div class="flow-card"><strong>${escapeHtml(step.label)}</strong><span>${escapeHtml(step.text)}</span></div>`).join('');
  const segments = topic.segments.map((s, si) => renderSegment(s, idx, si)).join('');
  return `<section class="hero"><h2>Topic ${idx+1}: ${escapeHtml(topic.title)}</h2><div class="base-case"><div class="label">Base Case</div><p>${escapeHtml(topic.base_case)}</p></div><div class="flow">${flow}</div></section><section class="segment-grid">${segments}</section><div class="final-rule"><strong>Final Learning Rule</strong>${escapeHtml(topic.final_learning_rule)}</div>`;
}
function renderSegment(s, ti, si) {
  const id = segmentId(ti, si);
  const opts = s.options.map(o => `<div class="option"><span class="letter">${escapeHtml(o[0])}</span><span class="ot">${escapeHtml(o[1])}</span></div>`).join('');
  const done = completed.has(id) ? 'Done' : 'Mark done';
  return `<article class="segment" data-segment="${id}"><div class="segment-head"><h3>Segment ${si+1}: ${escapeHtml(s.title)}</h3><span class="tag">${escapeHtml(s.tag || 'untagged')}</span></div><div class="segment-body"><p class="stem">${escapeHtml(s.stem)}</p><div class="options">${opts}</div><div class="reveal-row"><button class="reveal-btn" data-action="answer">Show answer</button><button class="reveal-btn alt" data-action="all">Show all reasoning</button><button class="reveal-btn alt" data-action="done">${done}</button></div><div class="explain"><div class="explain-card answer"><b>Answer</b><p>${escapeHtml(s.answer)}</p></div><div class="explain-card"><b>Discriminator</b><p>${escapeHtml(s.discriminator)}</p></div><div class="explain-card trap"><b>Trap</b><p>${escapeHtml(s.trap)}</p></div><div class="explain-card alert"><b>Future Alert</b><p>${escapeHtml(s.future_alert)}</p></div></div></div></article>`;
}
function mlxEqCase(){
  document.querySelectorAll('.segment').forEach(function(seg){
    var revealed=seg.querySelector('.explain.show');
    seg.querySelectorAll('.option').forEach(function(o){
      var s=o.querySelector('.ot'); if(!s) return;
      if(!revealed && s.scrollHeight>s.clientHeight+2 && !o.querySelector('.exp')){
        var e=document.createElement('span'); e.className='exp'; e.textContent='+';
        e.addEventListener('click',function(ev){ev.stopPropagation(); o.classList.add('open');});
        o.appendChild(e);
      }
    });
    var rows=[].slice.call(seg.querySelectorAll('.option:not(.open)'));
    var h=0; rows.forEach(function(r){h=Math.max(h,r.offsetHeight);});
    if(h && !revealed) rows.forEach(function(r){r.style.minHeight=h+'px';});
  });
}
if(document.fonts&&!mlxEqCase._f){mlxEqCase._f=1;document.fonts.ready.then(function(){mlxEqCase();});}
function wireContent() {
  document.querySelectorAll('.segment-head').forEach(head => head.onclick = () => head.parentElement.classList.toggle('open'));
  document.querySelectorAll('[data-action]').forEach(btn => btn.onclick = e => {
    const segment = e.target.closest('.segment');
    const explain = segment.querySelector('.explain');
    const action = e.target.dataset.action;
    if (action === 'answer' || action === 'all') explain.classList.toggle('show');
    if (action === 'done') {
      const id = segment.dataset.segment;
      if (completed.has(id)) completed.delete(id); else completed.add(id);
      e.target.textContent = completed.has(id) ? 'Done' : 'Mark done';
      saveProgress();
    }
  });
  mlxEqCase();
}
function render() {
  if (!matchesTopic(data.topics[activeIndex])) {
    const next = data.topics.findIndex(matchesTopic);
    if (next >= 0) activeIndex = next;
  }
  renderSidebar();
  if (matchesTopic(data.topics[activeIndex])) { content.innerHTML = renderTopic(data.topics[activeIndex], activeIndex); wireContent(); }
  else { content.innerHTML = ''; }
  updateProgress();
}
function escapeHtml(str) { return String(str).replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch])); }

allTags().forEach(tag => { const opt=document.createElement('option'); opt.value=tag; opt.textContent=tag; tagFilter.appendChild(opt); });
searchBox.addEventListener('input', render);
tagFilter.addEventListener('change', render);
document.getElementById('expandAll').onclick = () => document.querySelectorAll('.segment').forEach(s => s.classList.add('open'));
document.getElementById('collapseAll').onclick = () => document.querySelectorAll('.segment').forEach(s => s.classList.remove('open'));
render();

/* theme toggle */
var root = document.documentElement, TK = "caseLadder.theme";
function setTheme(t) { root.setAttribute("data-theme", t); try { localStorage.setItem(TK, t); } catch(e){} }
function initTheme() { var t = "dark"; try { t = localStorage.getItem(TK) || "dark"; } catch(e){} setTheme(t); }
initTheme();
var themeBtn = document.getElementById("themeBtn");
if (themeBtn) themeBtn.addEventListener("click", function() {
  setTheme(root.getAttribute("data-theme") === "dark" ? "light" : "dark");
});
render();
</script>

<style>/* phone guards (shared) */
@media (max-width:640px){
  img,video{max-width:100%;height:auto}
  pre{overflow-x:auto;-webkit-overflow-scrolling:touch}
  body{overflow-x:hidden;padding-left:14px;padding-right:14px}
}
</style>

<style id="mlx-live">
h1{font-weight:800}h2{font-weight:700}h3,h4{font-weight:700}
@keyframes mlxFade{from{opacity:0}to{opacity:1}}
body{animation:mlxFade .4s ease both}
.mlx-toggle{position:fixed;right:16px;bottom:16px;z-index:99;font:600 12px/1 'Geist Mono',ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;padding:11px 15px;border-radius:999px;cursor:pointer;background:var(--panel,#14171E);color:var(--chalk,#FFFFFF);border:1px solid var(--line,#2A3140);box-shadow:0 10px 30px -12px rgba(0,0,0,.55);transition:transform .15s,border-color .2s}
.mlx-toggle:hover{border-color:var(--cyan,#4DA3FF)}
.mlx-toggle:active{transform:scale(.94)}
@media print{.mlx-toggle{display:none!important}body{animation:none!important}}
@media(prefers-reduced-motion:reduce){body,.mlx-toggle{animation:none!important;transition:none!important}}
</style>
<script>
(function(){
 try{
  var s=localStorage.getItem('mlx-theme');
  var m=s||(window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');
  document.documentElement.setAttribute('data-mode',m);
 }catch(e){}
 var b=document.createElement('button');
 b.className='mlx-toggle';b.type='button';
 function lbl(){b.textContent=document.documentElement.getAttribute('data-mode')==='light'?'dark':'light';}
 b.addEventListener('click',function(){
  var n=document.documentElement.getAttribute('data-mode')==='light'?'dark':'light';
  document.documentElement.setAttribute('data-mode',n);
  try{localStorage.setItem('mlx-theme',n);}catch(e){}
  lbl();
 });
 document.body.appendChild(b);lbl();
})();
</script>
